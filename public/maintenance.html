<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="robots" content="noindex, follow" />
    <meta name="description" content="Puddle 1.0 is coming soon." />
    <title>Puddle — 1.0 coming soon</title>
    <link rel="preload" as="image" href="/figma/assets/hero-right.webp" type="image/webp" fetchpriority="high" />
    <link rel="stylesheet" href="/maintenance.css" />
  </head>
  <body>
    <main class="maintenance" aria-labelledby="maintenance-title">
      <a class="maintenance__brand" href="/landing.html" aria-label="View the Puddle landing page">
        <img src="/figma/assets/mobile-logo-exact.svg" alt="" width="46" height="47" />
        <span>puddle<span>.you</span></span>
      </a>

      <section class="maintenance__scene" aria-label="Puddle 1.0 announcement">
        <picture class="maintenance__art" aria-hidden="true">
          <source srcset="/figma/assets/hero-right.webp" type="image/webp" />
          <img src="/figma/assets/hero-right.png" alt="" width="1024" height="1024" fetchpriority="high" />
        </picture>
        <div class="maintenance__message">
          <p>Alpha closed</p>
          <h1 id="maintenance-title">1.0 coming soon</h1>
          <a class="maintenance__instagram" href="https://www.instagram.com/puddle.you/">
            <span>Instagram</span>
            <span aria-hidden="true">↗</span>
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
