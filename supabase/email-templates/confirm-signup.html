<div style="margin:0;padding:32px;background:#fff8f3;font-family:Arial,sans-serif;color:#171114">
  <div style="max-width:560px;margin:0 auto;background:#ffffff;border:3px solid #171114;border-radius:24px;padding:32px;box-shadow:6px 7px 0 #171114">
    <div style="display:inline-block;background:#ffd86b;border:2px solid #171114;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase">One tiny step</div>
    <h1 style="font-size:36px;line-height:1.05;margin:22px 0 12px">Confirm your Puddle account.</h1>
    <p style="font-size:16px;line-height:1.6;color:#66565f">Confirm this email address to finish creating your account and continue to onboarding.</p>
    <p style="margin:28px 0">
      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=signup&amp;next=/onboarding" style="display:inline-block;background:#ff4fa3;color:#171114;border:3px solid #171114;border-radius:16px;padding:14px 20px;font-weight:800;text-decoration:none;box-shadow:4px 5px 0 #171114">Confirm email address →</a>
    </p>
    <p style="font-size:13px;line-height:1.5;color:#76666f">If you did not create a Puddle account, you can ignore this email.</p>
  </div>
</div>
