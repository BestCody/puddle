name: Build static place catalogue

on:
  workflow_dispatch:
    inputs:
      bbox:
        description: 'Overture bounding box: west,south,east,north'
        required: true
        type: string
      release:
        description: 'Immutable release label'
        required: true
        type: string
      zoom:
        description: 'Static tile zoom'
        required: false
        default: '10'
        type: string

permissions:
  contents: read

concurrency:
  group: static-place-catalogue-${{ inputs.release }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: npm ci --no-audit --no-fund
      - name: Install official Overture client
        run: python -m pip install --disable-pip-version-check overturemaps==1.0.1
      - name: Download Overture places shard
        run: overturemaps download --bbox="${{ inputs.bbox }}" -f geojsonseq --type=place -o overture-places.geojsonseq
      - name: Build compressed static tiles
        run: npm run locations:catalogue:build-static -- --source=overture --file=overture-places.geojsonseq --output=dist/static-catalogue --release="${{ inputs.release }}" --zoom="${{ inputs.zoom }}"
      - name: Publish immutable release to R2
        run: npm run locations:catalogue:publish-r2 -- --directory=dist/static-catalogue --apply
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
