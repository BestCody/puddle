name: Snapshot current Puddle catalogue to B2

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: global-bootstrap-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm ci --no-audit --no-fund
      - run: python -m pip install --disable-pip-version-check duckdb
      - id: stamp
        shell: bash
        run: echo "snapshot=$(date -u +%Y-%m-%dT%H-%M-%SZ)" >> "$GITHUB_OUTPUT"
      - name: Export stable UUIDs, source links and enrichment metadata
        run: npm run global:bootstrap:export -- --out=.global-data/bootstrap-jsonl
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      - name: Convert bootstrap to Parquet
        run: npm run global:bootstrap:parquet -- --input=.global-data/bootstrap-jsonl --output=.global-data/bootstrap-parquet
      - name: Upload immutable bootstrap snapshot
        run: npm run b2:upload-tree -- --dir=.global-data/bootstrap-parquet --prefix=data/snapshots/bootstrap/snapshot=${{ steps.stamp.outputs.snapshot }} --env-prefix=B2_DATA --concurrency=32
        env:
          B2_DATA_APPLICATION_KEY_ID: ${{ secrets.B2_DATA_APPLICATION_KEY_ID || secrets.B2_KEY_ID }}
          B2_DATA_APPLICATION_KEY: ${{ secrets.B2_DATA_APPLICATION_KEY || secrets.B2_APPLICATION_KEY }}
          B2_DATA_BUCKET_ID: ${{ secrets.B2_DATA_BUCKET_ID }}
          B2_DATA_BUCKET_NAME: ${{ vars.B2_DATA_BUCKET_NAME || secrets.B2_BUCKET || 'puddle-assets' }}
      - name: Update bootstrap current pointer only after immutable upload succeeds
        run: npm run b2:upload-tree -- --dir=.global-data/bootstrap-parquet --prefix=data/snapshots/bootstrap/current --env-prefix=B2_DATA --concurrency=32
        env:
          B2_DATA_APPLICATION_KEY_ID: ${{ secrets.B2_DATA_APPLICATION_KEY_ID || secrets.B2_KEY_ID }}
          B2_DATA_APPLICATION_KEY: ${{ secrets.B2_DATA_APPLICATION_KEY || secrets.B2_APPLICATION_KEY }}
          B2_DATA_BUCKET_ID: ${{ secrets.B2_DATA_BUCKET_ID }}
          B2_DATA_BUCKET_NAME: ${{ vars.B2_DATA_BUCKET_NAME || secrets.B2_BUCKET || 'puddle-assets' }}
