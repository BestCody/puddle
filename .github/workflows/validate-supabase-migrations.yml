name: Validate Supabase migrations

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migration-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Start local Supabase and apply migrations
        shell: bash
        run: |
          set -o pipefail
          npx --yes supabase@2.110.0 start --debug --exclude studio,imgproxy,edge-runtime,logflare,vector,supavisor 2>&1 | tee supabase-start.log

      - name: Dump local database logs after failure
        if: failure()
        shell: bash
        run: |
          docker ps -a
          docker logs supabase_db_puddle 2>&1 || true

      - name: Rebuild database from all migrations
        run: npx --yes supabase@2.110.0 db reset --debug
