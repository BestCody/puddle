name: Validate Supabase migrations

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'supabase/**'
      - '.github/workflows/validate-supabase-migrations.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'supabase/**'
      - '.github/workflows/validate-supabase-migrations.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  migration-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Start local Supabase database and apply migrations
        shell: bash
        run: |
          set -o pipefail
          npx --yes supabase@2.114.0 db start --debug 2>&1 | tee supabase-db-start.log

      - name: Test B2/OpenSearch location architecture and global photo uniqueness after initial migration apply
        shell: bash
        run: |
          database="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n 1)"
          test -n "$database"
          docker exec -i "$database" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/location_architecture_integrity.sql
          docker exec -i "$database" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/global_photo_uniqueness.sql

      - name: Dump local database logs after failure
        if: failure()
        shell: bash
        run: |
          docker ps -a
          for container in $(docker ps -aq --filter 'name=supabase_db_'); do
            docker logs "$container" 2>&1 || true
          done

      - name: Rebuild database from all migrations
        run: npx --yes supabase@2.114.0 db reset --debug

      - name: Test B2/OpenSearch location architecture and global photo uniqueness after clean rebuild
        shell: bash
        run: |
          database="$(docker ps --filter 'name=supabase_db_' --format '{{.Names}}' | head -n 1)"
          test -n "$database"
          docker exec -i "$database" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/location_architecture_integrity.sql
          docker exec -i "$database" psql -v ON_ERROR_STOP=1 -U postgres -d postgres < supabase/tests/global_photo_uniqueness.sql
