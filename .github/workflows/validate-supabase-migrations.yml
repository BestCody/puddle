name: Validate Supabase migrations

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migration-reset:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply candidate migration repairs
        shell: bash
        run: |
          if [[ -f scripts/repair_supabase_migrations.py ]]; then
            python scripts/repair_supabase_migrations.py
            git diff -- supabase/migrations
          fi

      - name: Start local Supabase database and apply migrations
        shell: bash
        run: |
          set -o pipefail
          npx --yes supabase@2.110.0 db start --debug 2>&1 | tee supabase-db-start.log

      - name: Dump local database logs after failure
        if: failure()
        shell: bash
        run: |
          docker ps -a
          for container in $(docker ps -aq --filter 'name=supabase_db_'); do
            docker logs "$container" 2>&1 || true
          done

      - name: Rebuild database from all migrations
        run: npx --yes supabase@2.110.0 db reset --debug

      - name: Commit validated migration repairs
        if: success() && github.event_name == 'pull_request'
        shell: bash
        run: |
          if git diff --quiet -- supabase/migrations; then
            echo "No migration repairs to persist."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations
          git commit -m "Repair Supabase migrations"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
