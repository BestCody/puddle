name: One-time photo provider credential probe

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Report provider credential presence
        env:
          WIKIMEDIA_ACCESS_TOKEN: ${{ secrets.WIKIMEDIA_ACCESS_TOKEN }}
          MAPILLARY_ACCESS_TOKEN: ${{ secrets.MAPILLARY_ACCESS_TOKEN }}
          KARTAVIEW_ACCESS_TOKEN: ${{ secrets.KARTAVIEW_ACCESS_TOKEN }}
        run: |
          python - <<'PY'
          import json, os
          print(json.dumps({
              'wikimediaTokenConfigured': bool(os.environ.get('WIKIMEDIA_ACCESS_TOKEN', '').strip()),
              'mapillaryTokenConfigured': bool(os.environ.get('MAPILLARY_ACCESS_TOKEN', '').strip()),
              'kartaviewTokenConfigured': bool(os.environ.get('KARTAVIEW_ACCESS_TOKEN', '').strip()),
          }, sort_keys=True))
          PY
