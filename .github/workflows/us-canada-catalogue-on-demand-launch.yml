name: US and Canada catalogue on-demand launch

on:
  workflow_dispatch:
    inputs:
      release:
        description: Immutable inactive release to preflight or activate
        required: true
        default: us-ca-cities-2026-08-05-catalogue-01
        type: string
      activate:
        description: Publish catalogue/manifest.json only after the on-demand preflight passes
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: us-canada-catalogue-on-demand-${{ inputs.release }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  B2_LAUNCH_MAX_BYTES: '9000000000'
  B2_PHOTO_START_MAX_BYTES: '8900000000'
  SUPABASE_LAUNCH_MAX_BYTES: '400000000'
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  B2_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
  B2_REGION: ${{ secrets.B2_REGION }}
  B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
  B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
  B2_BUCKET: ${{ secrets.B2_BUCKET }}
  B2_DOWNLOAD_BASE_URL: ${{ secrets.B2_DOWNLOAD_BASE_URL }}
  STATIC_CATALOGUE_BASE_URL: ${{ secrets.B2_DOWNLOAD_BASE_URL }}
  STATIC_CATALOGUE_ACTION_SECRET: ${{ secrets.STATIC_CATALOGUE_ACTION_SECRET }}
  B2_RUNTIME_WRITE_KEY_ID: ${{ secrets.B2_RUNTIME_WRITE_KEY_ID }}
  B2_RUNTIME_WRITE_APPLICATION_KEY: ${{ secrets.B2_RUNTIME_WRITE_APPLICATION_KEY }}
  STATIC_MEDIA_B2_BASELINE_BYTES: ${{ vars.STATIC_MEDIA_B2_BASELINE_BYTES }}
  STATIC_MEDIA_PHOTO_RESERVATION_BYTES: '131072'
  STATIC_MEDIA_GOOGLE_DAILY_LIMIT: ${{ vars.STATIC_MEDIA_GOOGLE_DAILY_LIMIT || '0' }}
  STATIC_MEDIA_GOOGLE_MONTHLY_LIMIT: ${{ vars.STATIC_MEDIA_GOOGLE_MONTHLY_LIMIT || '0' }}
  GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
  NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
  NEXT_PUBLIC_GOOGLE_PLACES_UI_KIT_ENABLED: 'true'
  STATIC_MEDIA_RESOLUTION_ENABLED: 'false'
  NEXT_PUBLIC_STATIC_MEDIA_RESOLUTION_ENABLED: 'false'

jobs:
  preflight:
    name: Read-only on-demand launch preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RELEASE: ${{ inputs.release }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate non-mutating launch configuration
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE" =~ ^[a-z0-9][a-z0-9-]{2,79}$ ]] || {
            echo 'release must contain only lowercase letters, numbers, and hyphens (3-80 characters).' >&2
            exit 1
          }
          [[ "$RELEASE" != *canary* ]] || {
            echo 'The production on-demand launch path cannot use a canary release name.' >&2
            exit 1
          }

          required=(
            NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
            SUPABASE_SECRET_KEY
            B2_S3_ENDPOINT
            B2_REGION
            B2_KEY_ID
            B2_APPLICATION_KEY
            B2_BUCKET
            B2_DOWNLOAD_BASE_URL
            STATIC_CATALOGUE_ACTION_SECRET
            B2_RUNTIME_WRITE_KEY_ID
            B2_RUNTIME_WRITE_APPLICATION_KEY
            STATIC_MEDIA_B2_BASELINE_BYTES
          )
          missing=()
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing launch configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          if [[ "$B2_RUNTIME_WRITE_KEY_ID" == "$B2_KEY_ID" ]]; then
            echo 'The application runtime B2 writer must not reuse the GitHub publisher key.' >&2
            exit 1
          fi

          if (( STATIC_MEDIA_GOOGLE_DAILY_LIMIT > 0 || STATIC_MEDIA_GOOGLE_MONTHLY_LIMIT > 0 )); then
            [[ -n "${GOOGLE_PLACES_API_KEY:-}" ]] || { echo 'GOOGLE_PLACES_API_KEY is required when Google runtime budget is non-zero.' >&2; exit 1; }
            [[ -n "${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}" ]] || { echo 'NEXT_PUBLIC_GOOGLE_MAPS_API_KEY is required when Google runtime budget is non-zero.' >&2; exit 1; }
          fi

      - name: Enforce B2 and Supabase byte ceilings
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-launch-budgets.mjs --phase=activate

      - name: Verify immutable catalogue object structure
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-static-catalogue-structure.mjs \
            --release="$RELEASE" \
            --fail-on-incomplete

      - name: Verify on-demand resolver database and runtime prerequisites
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-on-demand-media-readiness.mjs --release="$RELEASE"

      - name: Confirm preflight remained read-only
        shell: bash
        run: |
          set -euo pipefail
          echo "On-demand launch preflight passed for inactive release: $RELEASE"
          echo 'No catalogue manifest was published, no migration was applied, no provider request was made, and production was not activated.'

  activate:
    name: Activate structurally audited on-demand release
    if: ${{ inputs.activate && needs.preflight.result == 'success' }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    env:
      RELEASE: ${{ inputs.release }}
      ZOOM: '10'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Regenerate root manifest for the audited immutable release
        shell: bash
        run: |
          set -euo pipefail
          npm run locations:catalogue:build-mixed -- \
            --output="$RUNNER_TEMP/finalize" \
            --release="$RELEASE" \
            --finalize-release \
            --zoom="$ZOOM"
          mkdir -p "$RUNNER_TEMP/activate/catalogue"
          cp "$RUNNER_TEMP/finalize/catalogue/manifest.json" "$RUNNER_TEMP/activate/catalogue/manifest.json"

      - name: Recheck hard limits immediately before activation
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-launch-budgets.mjs \
            --phase=activate \
            --incoming-directory="$RUNNER_TEMP/activate"

      - name: Publish root manifest last
        shell: bash
        run: |
          set -euo pipefail
          npm run locations:catalogue:publish-b2 -- \
            --directory="$RUNNER_TEMP/activate" \
            --apply
