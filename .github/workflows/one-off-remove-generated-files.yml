name: One-off remove generated refactor artifacts

on:
  push:
    branches: [media-hash-serving-architecture-20260817]
    paths:
      - '.github/workflows/one-off-remove-generated-files.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: media-hash-serving-architecture-20260817
      - name: Remove generated artifacts and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf scripts/global-data/__pycache__
          rm .github/workflows/one-off-remove-generated-files.yml
          git config user.name "Hansen"
          git config user.email "louhansen811@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove generated Python artifacts"
          git push origin HEAD:media-hash-serving-architecture-20260817
