# Retry after validating production hash/key relationships.
name: One-off remove open-photo legacy compatibility

on:
  push:
    branches: [media-hash-legacy-cleanup-20260818]
    paths:
      - '.github/workflows/one-off-remove-open-photo-legacy.yml'

permissions:
  contents: write
  statuses: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: media-hash-legacy-cleanup-20260818
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund

      - name: Remove retired compatibility and fix canonical hash validation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          importer = Path('scripts/import-open-location-photos.mjs')
          text = importer.read_text()
          text = text.replace("import { storeOpenPhotoInSupabase } from '../lib/app/open-photo-supabase.js'", "import { storeOpenPhotoInB2 } from '../lib/app/open-photo-b2.js'")
          text = text.replace('storeOpenPhotoInSupabase(admin, candidate)', 'storeOpenPhotoInB2(admin, candidate)')
          if 'storeOpenPhotoInSupabase' in text or 'open-photo-supabase' in text:
              raise RuntimeError('failed to remove Supabase open-photo compatibility from importer')
          importer.write_text(text)

          shim = Path('lib/app/open-photo-supabase.js')
          if shim.exists():
              shim.unlink()

          validator = Path('scripts/global-data/build-bootstrap-parquet.py')
          text = validator.read_text()
          if "'[0-9a-f]{64}'" not in text:
              raise RuntimeError('expected SHA-256 regex was not found in bootstrap validator')
          text = text.replace("'[0-9a-f]{64}'", "'[0-9a-f]{{64}}'")
          validator.write_text(text)

          check = Path('scripts/check.mjs')
          text = check.read_text()

          for token in [
              "'lib/app/open-photo-supabase.js',",
              ",'lib/app/open-photo-supabase.js'",
              "'scripts/migrate-open-photos-to-b2.mjs',",
              ",'scripts/migrate-open-photos-to-b2.mjs'",
              "'.github/workflows/migrate-open-photos-b2.yml',",
              ",'.github/workflows/migrate-open-photos-b2.yml'",
              "'locations:photos:migrate-b2',",
              ",'locations:photos:migrate-b2'",
              "'B2_MEDIA_PUBLIC_BASE_URL',",
              ",'B2_MEDIA_PUBLIC_BASE_URL'"
          ]:
              text = text.replace(token, '')

          required_anchor = "'lib/app/open-photo-b2.js','lib/app/open-photo-transform.js'"
          if required_anchor in text:
              text = text.replace(required_anchor, "'lib/app/open-photo-b2.js','lib/media/open-photo-url.js','lib/app/open-photo-transform.js'")

          pattern = re.compile(
              r"const openPhotoImporter = await read\('scripts/import-open-location-photos\.mjs'\)\n"
              r"const photoCompatibility = await read\('lib/app/open-photo-supabase\.js'\)\n"
              r"const photoB2 = await read\('lib/app/open-photo-b2\.js'\)\n"
              r"if \(!openPhotoImporter\.includes\('storeOpenPhotoInSupabase'\)\).*?\n"
              r"for \(const marker of \[\"storageBackend: 'b2'\",'photos/by-sha256'\]\).*?\n",
              re.S,
          )
          replacement = """const openPhotoImporter = await read('scripts/import-open-location-photos.mjs')
const photoB2 = await read('lib/app/open-photo-b2.js')
const openPhotoUrl = await read('lib/media/open-photo-url.js')
for (const marker of ['storeOpenPhotoInB2', "../lib/app/open-photo-b2.js"]) if (!openPhotoImporter.includes(marker)) throw new Error(`Open-photo importer is missing direct canonical B2 ingestion marker ${marker}`)
for (const forbidden of ['storeOpenPhotoInSupabase','open-photo-supabase']) if (openPhotoImporter.includes(forbidden)) throw new Error(`Retired Supabase open-photo compatibility remains in importer: ${forbidden}`)
for (const marker of ["storageBackend: 'b2'",'media/photos/by-sha256',".from('media_objects')",'mediaObjectId: mediaObject.id','remoteUrl: null']) if (!photoB2.includes(marker)) throw new Error(`Canonical B2 open-photo writer is missing ${marker}`)
for (const marker of ['normalizeOpenPhotoHash','/api/open-photo/']) if (!openPhotoUrl.includes(marker)) throw new Error(`Puddle open-photo URL resolver is missing ${marker}`)
"""
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise RuntimeError(f'expected one legacy compatibility validation block, replaced {count}')

          invariant = """
const retiredOpenPhotoPaths = [
  'lib/app/open-photo-supabase.js',
  'scripts/migrate-open-photos-to-b2.mjs',
  'scripts/validate-open-photo-b2-migration.mjs',
  '.github/workflows/migrate-open-photos-b2.yml',
  '.github/workflows/validate-open-photo-b2.yml',
  '.github/workflows/cleanup-open-photo-supabase.yml',
  '.github/trigger-migrate-open-photos-b2',
  '.github/trigger-validate-open-photo-b2',
  '.github/trigger-cleanup-open-photo-supabase'
]
for (const path of retiredOpenPhotoPaths) {
  try {
    await access(join(root, path))
    throw new Error(`Retired open-photo migration/compatibility path is present: ${path}`)
  } catch (error) {
    if (error?.code !== 'ENOENT') throw error
  }
}
"""
          syntax_anchor = "\nconst syntaxFiles = ["
          if syntax_anchor not in text:
              raise RuntimeError('could not find syntaxFiles anchor in scripts/check.mjs')
          text = text.replace(syntax_anchor, invariant + syntax_anchor, 1)

          env_old = "['STATIC_CATALOGUE_','STATIC_MEDIA_RESOLUTION_ENABLED','PUDDLE_LEGACY_SYSTEMS_ENABLED','R2_PUBLIC_BASE_URL','R2_CONFIG']"
          env_new = "['STATIC_CATALOGUE_','STATIC_MEDIA_RESOLUTION_ENABLED','PUDDLE_LEGACY_SYSTEMS_ENABLED','R2_PUBLIC_BASE_URL','R2_CONFIG','B2_MEDIA_PUBLIC_BASE_URL','B2_DOWNLOAD_BASE_URL','OPEN_PHOTO_SUPABASE_BUCKET','f005.backblazeb2.com/file/puddle-assets']"
          if env_old in text:
              text = text.replace(env_old, env_new, 1)

          marker = "for (const marker of ['geo_distance','multi_match','GLOBAL_LOCATION_CANDIDATE_LIMIT','locations-active']) if (!globalSearch.includes(marker)) throw new Error(`Global location search is missing ${marker}`)"
          if marker in text and 'primary_photo.content_hash' not in text[text.index(marker):text.index(marker)+1000]:
              text = text.replace(marker, marker + "\nif (!globalSearch.includes('primary_photo.content_hash')) throw new Error('Global location search is missing primary_photo.content_hash')\nif (globalSearch.includes('primary_photo.url')) throw new Error('Global location search restored primary_photo.url storage coupling')", 1)

          check.write_text(text)
          Path('.github/workflows/one-off-remove-open-photo-legacy.yml').unlink()
          PY

      - name: Verify durable media architecture
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check.mjs
          node --check scripts/import-open-location-photos.mjs
          python3 -m py_compile scripts/global-data/build-bootstrap-parquet.py scripts/global-data/build_bootstrap_overlays.py scripts/global-data/index_opensearch.py scripts/global-data/materialize_photo_candidates.py
          rm -rf scripts/global-data/__pycache__
          node --test tests/unit/b2-native.test.mjs tests/unit/global-location-search.test.mjs tests/unit/open-photo-candidates.test.mjs
          if git grep -n -E 'storeOpenPhotoInSupabase|open-photo-supabase|B2_MEDIA_PUBLIC_BASE_URL|B2_DOWNLOAD_BASE_URL|OPEN_PHOTO_SUPABASE_BUCKET' -- ':!supabase/migrations/*' ':!docs/*' ':!scripts/check.mjs'; then
            echo 'Retired media compatibility remains outside explicit repository invariants.' >&2
            exit 1
          fi

      - name: Commit cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hansen"
          git config user.email "louhansen811@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "Remove retired open-photo compatibility"
          git push origin HEAD:media-hash-legacy-cleanup-20260818

      - name: Publish cleanup success
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GITHUB_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"success\",\"context\":\"Media architecture cleanup\",\"description\":\"Retired open-photo compatibility removed\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"

      - name: Publish cleanup failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GITHUB_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"failure\",\"context\":\"Media architecture cleanup\",\"description\":\"Retired compatibility cleanup failed\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
