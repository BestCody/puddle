name: Patch swipe actions

on:
  push:
    branches:
      - feat/figma-landing-v2-swipe-motion
    paths:
      - .github/workflows/patch-swipe-actions.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/figma-landing-v2-swipe-motion
      - name: Route dock and keyboard choices through card motion
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          card = Path('components/minimal-swipe-card.js')
          text = card.read_text()
          text = text.replace(
              'export function MinimalSwipeCard({ item, onChoice, busy }) {',
              'export function MinimalSwipeCard({ item, onChoice, busy, actionRequest }) {', 1)
          text = text.replace(
              "  const [detailsOpen, setDetailsOpen] = useState(false)\n",
              "  const [detailsOpen, setDetailsOpen] = useState(false)\n  const choiceInFlight = useRef(false)\n", 1)
          old_choose = '''  async function choose(action) {
            if (busy) return
            setDragging(false)
            setDragX(action === 'pass' ? -720 : action === 'save' ? 720 : 0)
            const motionMs = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : action === 'save' ? 560 : 280
            await new Promise((resolve) => window.setTimeout(resolve, motionMs))
            await onChoice(action, item)
            setDragX(0)
          }
          '''
          new_choose = '''  async function choose(action) {
            if (busy || choiceInFlight.current) return
            choiceInFlight.current = true
            setDragging(false)
            setDragX(action === 'pass' ? -720 : action === 'save' ? 720 : 0)
            const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches
            const motionMs = reducedMotion ? 0 : action === 'save' ? 560 : action === 'pass' ? 280 : 0
            try {
              if (motionMs) await new Promise((resolve) => window.setTimeout(resolve, motionMs))
              await onChoice(action, item)
            } finally {
              setDragX(0)
              choiceInFlight.current = false
            }
          }

          useEffect(() => {
            if (!actionRequest?.id) return
            choose(actionRequest.action)
          }, [actionRequest?.id])
          '''
          if old_choose not in text: raise SystemExit('choose block not found')
          text = text.replace(old_choose, new_choose, 1)
          card.write_text(text)

          workspace = Path('components/date-swipe-workspace-v2.js')
          text = workspace.read_text()
          text = text.replace(
              "  const [message, setMessage] = useState('')\n",
              "  const [message, setMessage] = useState('')\n  const [actionRequest, setActionRequest] = useState(null)\n", 1)
          text = text.replace(
              '  const actionSequence = useRef(0)\n',
              '  const actionSequence = useRef(0)\n  const actionRequestSequence = useRef(0)\n', 1)
          anchor = '  function updateFilter(name, value) {'
          helper = '''  function requestChoice(action) {
            if (!current || busy) return
            actionRequestSequence.current += 1
            setActionRequest({ action, id: actionRequestSequence.current })
          }

          '''
          if anchor not in text: raise SystemExit('request helper anchor not found')
          text = text.replace(anchor, helper + anchor, 1)
          text = text.replace("if (event.key === 'ArrowLeft') persistChoice('pass', current)", "if (event.key === 'ArrowLeft') requestChoice('pass')", 1)
          text = text.replace("if (event.key === 'ArrowRight') persistChoice('save', current)", "if (event.key === 'ArrowRight') requestChoice('save')", 1)
          text = text.replace("if (event.key.toLowerCase() === 'p') persistChoice('perfect', current)", "if (event.key.toLowerCase() === 'p') requestChoice('perfect')", 1)
          text = text.replace(
              '<MinimalSwipeCard item={current} onChoice={persistChoice} busy={busy} />',
              '<MinimalSwipeCard item={current} onChoice={persistChoice} busy={busy} actionRequest={actionRequest} />', 1)
          text = text.replace("onPass={() => persistChoice('pass', current)}", "onPass={() => requestChoice('pass')}", 1)
          text = text.replace("onSave={() => persistChoice('save', current)}", "onSave={() => requestChoice('save')}", 1)
          text = text.replace("onPerfect={() => persistChoice('perfect', current)}", "onPerfect={() => requestChoice('perfect')}", 1)
          workspace.write_text(text)
          PY
      - name: Commit action routing
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add components/minimal-swipe-card.js components/date-swipe-workspace-v2.js
          git commit -m "Animate swipe controls through card transition"
          git push origin HEAD:feat/figma-landing-v2-swipe-motion
