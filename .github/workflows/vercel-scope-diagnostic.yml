name: Vercel scope diagnostic

on:
  push:
    branches:
      - agent/diagnose-vercel-scope

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CONFIGURED_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      CONFIGURED_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Inspect Vercel project environment API safely
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = String(process.env.VERCEL_TOKEN || '').trim()
          const orgId = String(process.env.CONFIGURED_ORG_ID || '').trim()
          const projectId = String(process.env.CONFIGURED_PROJECT_ID || '').trim()
          if (!token || !orgId || !projectId) throw new Error('Vercel diagnostic configuration is incomplete.')

          async function request(path) {
            const response = await fetch(`https://api.vercel.com${path}`, {
              headers: { Authorization: `Bearer ${token}` }
            })
            let body = null
            try { body = await response.json() } catch { body = null }
            return { status: response.status, ok: response.ok, body }
          }

          function safeError(result) {
            const error = result?.body?.error
            return error ? { code: error.code || null, message: error.message || null } : null
          }

          const project = await request(`/v9/projects/${encodeURIComponent(projectId)}?teamId=${encodeURIComponent(orgId)}`)
          if (!project.ok) throw new Error(`Project lookup failed (${project.status}): ${JSON.stringify(safeError(project))}`)
          console.log('Project API access:', {
            id: project.body?.id || null,
            name: project.body?.name || null,
            accountId: project.body?.accountId || null,
            gitRepository: project.body?.link ? {
              type: project.body.link.type || null,
              org: project.body.link.org || null,
              repo: project.body.link.repo || null
            } : null
          })

          const listed = await request(`/v10/projects/${encodeURIComponent(projectId)}/env?teamId=${encodeURIComponent(orgId)}&decrypt=true`)
          if (!listed.ok) throw new Error(`Environment listing failed (${listed.status}): ${JSON.stringify(safeError(listed))}`)
          const envs = Array.isArray(listed.body?.envs) ? listed.body.envs : []
          console.log(`Listed ${envs.length} project environment variables.`)

          const requiredProbeKeys = [
            'NEXT_PUBLIC_SUPABASE_URL',
            'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY',
            'SUPABASE_SECRET_KEY',
            'B2_BUCKET',
            'B2_DOWNLOAD_BASE_URL'
          ]
          const production = envs.filter((env) => {
            const targets = Array.isArray(env.target) ? env.target : [env.target].filter(Boolean)
            return targets.includes('production')
          })
          const byKey = new Map(production.map((env) => [env.key, env]))

          const probeResults = []
          for (const key of requiredProbeKeys) {
            const env = byKey.get(key)
            if (!env?.id) {
              probeResults.push({ key, found: false, status: null, hasValue: false, valueLength: null, error: null })
              continue
            }
            const variants = [
              `/v1/projects/${encodeURIComponent(projectId)}/env/${encodeURIComponent(env.id)}?teamId=${encodeURIComponent(orgId)}`,
              `/v9/projects/${encodeURIComponent(projectId)}/env/${encodeURIComponent(env.id)}?teamId=${encodeURIComponent(orgId)}`,
              `/v10/projects/${encodeURIComponent(projectId)}/env/${encodeURIComponent(env.id)}?teamId=${encodeURIComponent(orgId)}`
            ]
            let resolved = null
            for (const path of variants) {
              const result = await request(path)
              if (result.ok) {
                resolved = { path, result }
                break
              }
              if (!resolved) resolved = { path, result }
            }
            const value = resolved?.result?.body?.value
            probeResults.push({
              key,
              found: true,
              endpoint: resolved?.path?.replace(projectId, '<project>').replace(env.id, '<env>') || null,
              status: resolved?.result?.status ?? null,
              hasValue: typeof value === 'string' && value.length > 0,
              valueLength: typeof value === 'string' ? value.length : null,
              error: resolved?.result?.ok ? null : safeError(resolved?.result)
            })
          }
          console.log('Per-variable decrypted-value probes (values hidden):', probeResults)

          const failures = probeResults.filter((item) => !item.found || item.status !== 200 || !item.hasValue)
          if (failures.length) {
            throw new Error(`Per-variable decrypted values were unavailable for: ${failures.map((item) => item.key).join(', ')}`)
          }
          NODE
