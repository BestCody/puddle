name: Vercel scope diagnostic

on:
  push:
    branches:
      - agent/diagnose-vercel-scope

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      CONFIGURED_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
      CONFIGURED_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
    steps:
      - name: Inspect Vercel project environment API safely
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          const token = String(process.env.VERCEL_TOKEN || '').trim()
          const orgId = String(process.env.CONFIGURED_ORG_ID || '').trim()
          const projectId = String(process.env.CONFIGURED_PROJECT_ID || '').trim()
          if (!token || !orgId || !projectId) throw new Error('Vercel diagnostic configuration is incomplete.')

          async function request(path) {
            const response = await fetch(`https://api.vercel.com${path}`, {
              headers: { Authorization: `Bearer ${token}` }
            })
            let body = null
            try { body = await response.json() } catch { body = null }
            return { status: response.status, ok: response.ok, body }
          }

          function safeError(result) {
            const error = result?.body?.error
            return error ? { code: error.code || null, message: error.message || null } : null
          }

          const project = await request(`/v9/projects/${encodeURIComponent(projectId)}?teamId=${encodeURIComponent(orgId)}`)
          if (!project.ok) throw new Error(`Project lookup failed (${project.status}): ${JSON.stringify(safeError(project))}`)
          console.log('Project API access:', {
            id: project.body?.id || null,
            name: project.body?.name || null,
            accountId: project.body?.accountId || null,
            gitRepository: project.body?.link ? {
              type: project.body.link.type || null,
              org: project.body.link.org || null,
              repo: project.body.link.repo || null
            } : null
          })

          const variants = [
            `/v10/projects/${encodeURIComponent(projectId)}/env?teamId=${encodeURIComponent(orgId)}&decrypt=true`,
            `/v9/projects/${encodeURIComponent(projectId)}/env?teamId=${encodeURIComponent(orgId)}&decrypt=true`,
            `/v10/projects/${encodeURIComponent(projectId)}/env?teamId=${encodeURIComponent(orgId)}`,
            `/v9/projects/${encodeURIComponent(projectId)}/env?teamId=${encodeURIComponent(orgId)}`
          ]

          let successful = null
          for (const path of variants) {
            const result = await request(path)
            const envs = Array.isArray(result.body?.envs) ? result.body.envs : []
            console.log('Environment endpoint attempt:', {
              path: path.replace(projectId, '<project>'),
              status: result.status,
              count: envs.length,
              error: result.ok ? null : safeError(result)
            })
            if (result.ok && !successful) successful = { path, envs }
          }

          if (!successful) throw new Error('No documented Vercel environment endpoint was accessible.')

          const metadata = successful.envs.map((env) => ({
            id: env.id || null,
            key: env.key || null,
            type: env.type || null,
            target: env.target || null,
            customEnvironmentIds: env.customEnvironmentIds || null,
            hasValue: typeof env.value === 'string',
            valueLength: typeof env.value === 'string' ? env.value.length : null
          }))
          console.log('Environment metadata (values hidden):', metadata)

          const required = [
            'NEXT_PUBLIC_SUPABASE_URL',
            'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY',
            'SUPABASE_SECRET_KEY',
            'B2_S3_ENDPOINT',
            'B2_REGION',
            'B2_KEY_ID',
            'B2_APPLICATION_KEY',
            'B2_BUCKET',
            'B2_DOWNLOAD_BASE_URL'
          ]
          const production = successful.envs.filter((env) => {
            const targets = Array.isArray(env.target) ? env.target : [env.target].filter(Boolean)
            return targets.includes('production')
          })
          const byKey = new Map(production.map((env) => [env.key, env]))
          const missing = required.filter((key) => !byKey.has(key))
          const withoutValues = required.filter((key) => typeof byKey.get(key)?.value !== 'string' || !byKey.get(key).value)
          console.log('Required Production environment validation:', {
            missing,
            withoutDecryptedValues: withoutValues,
            usable: missing.length === 0 && withoutValues.length === 0
          })

          if (missing.length) throw new Error(`Missing required Production variables: ${missing.join(', ')}`)
          if (withoutValues.length) throw new Error(`Environment endpoint did not return decrypted values for: ${withoutValues.join(', ')}`)
          NODE
