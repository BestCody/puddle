name: Repair B2 photo references

# This repair is deliberately separate from the byte-level inventory repair.
# It removes broken metadata references from serving and materialization views
# by writing an append-only exclusion ledger. It never deletes B2 objects.
on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: ISO snapshot date; empty uses the active manifest
        required: false
        default: ''
        type: string
      apply:
        description: Persist the verified exclusion ledger and republish the overlay
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: repair-b2-photo-references
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ${{ vars.GLOBAL_DATA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: '1'
      B2_DATA_APPLICATION_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_DATA_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_DATA_BUCKET_NAME: ${{ secrets.B2_BUCKET }}
      B2_DATA_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
      B2_DATA_S3_REGION: ${{ secrets.B2_REGION }}
      B2_DATA_PREFIX: data
      B2_MEDIA_APPLICATION_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_MEDIA_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_MEDIA_BUCKET_NAME: ${{ secrets.B2_BUCKET }}
      B2_MEDIA_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
      B2_MEDIA_S3_REGION: ${{ secrets.B2_REGION }}
      B2_MEDIA_OPEN_PHOTO_PREFIX: ${{ vars.B2_MEDIA_OPEN_PHOTO_PREFIX || 'media/photos/by-sha256' }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install repair dependencies
        run: python -m pip install --disable-pip-version-check boto3 brotli duckdb orjson
      - id: active
        name: Resolve the active location snapshot
        run: python scripts/global-data/active_snapshot.py
      - name: Audit photo references
        shell: bash
        run: |
          set -euo pipefail
          args=(--snapshot='${{ inputs.snapshot || steps.active.outputs.snapshot }}')
          if [[ '${{ inputs.apply }}' == 'true' ]]; then
            args+=(--apply)
          fi
          python scripts/global-data/repair_b2_photo_references.py "${args[@]}" | tee photo-reference-repair.json
      - name: Publish serving overlay after applying repair
        if: inputs.apply == true
        run: python scripts/global-data/build_b2_photo_search_overlay.py --snapshot='${{ inputs.snapshot || steps.active.outputs.snapshot }}'
        env:
          GLOBAL_LOCATION_PHOTO_OVERLAY_MAX_BYTES: ${{ vars.GLOBAL_LOCATION_PHOTO_OVERLAY_MAX_BYTES || '12582912' }}
      - name: Upload repair report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: b2-photo-reference-repair
          path: photo-reference-repair.json
          if-no-files-found: ignore
          retention-days: 30
