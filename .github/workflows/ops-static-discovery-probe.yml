name: Ops - probe static discovery after photo imports

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ops-static-discovery-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      B2_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
      B2_REGION: ${{ secrets.B2_REGION }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_DOWNLOAD_BASE_URL: ${{ secrets.B2_DOWNLOAD_BASE_URL }}
      STATIC_CATALOGUE_BASE_URL: ${{ secrets.B2_DOWNLOAD_BASE_URL }}
      NEXT_PUBLIC_CATALOGUE_ASSET_BASE_URL: ${{ secrets.B2_DOWNLOAD_BASE_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Load Toronto catalogue with media overlays
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { b2Configuration, b2Request } from './lib/app/b2-s3.js'
          import { fetchNearbyStaticPlaces } from './lib/app/static-catalogue.js'

          const config = b2Configuration()
          if (!config) throw new Error('Signed Backblaze B2 configuration is missing.')
          const base = new URL(`${process.env.B2_DOWNLOAD_BASE_URL.replace(/\/$/, '')}/`)
          const signedFetch = async (value, options = {}) => {
            const url = new URL(String(value))
            if (url.origin !== base.origin || !url.pathname.startsWith(base.pathname)) {
              return fetch(value, options)
            }
            const encoded = url.pathname.slice(base.pathname.length)
            const key = encoded.split('/').map((part) => decodeURIComponent(part)).join('/')
            return b2Request({
              method: options.method || 'GET',
              key,
              config,
              timeoutMs: 10_000
            })
          }

          try {
            const result = await fetchNearbyStaticPlaces({
              latitude: 43.6532,
              longitude: -79.3832,
              radiusKm: 25,
              limit: 96,
              includeDetails: false,
              baseUrl: process.env.B2_DOWNLOAD_BASE_URL,
              fetchImpl: signedFetch,
              timeoutMs: 10_000
            })
            const photos = result.places.filter((place) => place.media?.photoUrl)
            console.log(JSON.stringify({
              release: result.manifest?.release,
              tilesRequested: result.tilesRequested,
              tilesLoaded: result.tilesLoaded,
              places: result.places.length,
              photos: photos.length,
              photoExamples: photos.slice(0, 10).map((place) => ({
                id: place.contentId,
                name: place.name,
                provider: place.media?.provider,
                hasPhotoUrl: Boolean(place.media?.photoUrl)
              }))
            }, null, 2))
            if (!result.places.length) throw new Error('Toronto static catalogue returned no places.')
            if (!photos.length) throw new Error('Toronto static catalogue returned no media-overlay photos.')
          } catch (error) {
            console.error(error?.stack || error)
            process.exitCode = 1
          }
          NODE
