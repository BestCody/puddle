name: Ops - probe Supabase discovery fallback

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ops-static-discovery-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Build Toronto deck without any Backblaze reads
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createClient } from '@supabase/supabase-js'
          import { getRelationalDiscoveryFallback } from './lib/app/discovery-relational-fallback.js'

          const url = process.env.NEXT_PUBLIC_SUPABASE_URL
          const key = process.env.SUPABASE_SECRET_KEY
          if (!url || !key) throw new Error('Production Supabase configuration is missing.')
          const admin = createClient(url, key, { auth: { persistSession: false, autoRefreshToken: false } })
          const email = `fallback-probe-${Date.now()}@puddle.invalid`
          const password = `Probe-${crypto.randomUUID()}-9a!`
          let userId = null

          try {
            const created = await admin.auth.admin.createUser({ email, password, email_confirm: true })
            if (created.error) throw created.error
            userId = created.data.user.id
            const client = createClient(url, key, { auth: { persistSession: false, autoRefreshToken: false } })
            const signed = await client.auth.signInWithPassword({ email, password })
            if (signed.error) throw signed.error

            const feed = await getRelationalDiscoveryFallback({
              supabase: client,
              user: signed.data.user,
              profile: {
                id: userId,
                latitude: 43.6532,
                longitude: -79.3832,
                city: 'Toronto',
                region: 'Ontario',
                country: 'Canada',
                location_label: 'Toronto',
                search_radius_km: 25,
                interests: []
              }
            }, { limit: 24, distance: 25, kind: 'place', date: 'any' })

            const photos = feed.items.filter((item) => item.photo_url || item.cover_url)
            const google = feed.items.filter((item) => !item.photo_url && item.google_place_id)
            console.log(JSON.stringify({
              items: feed.items.length,
              photos: photos.length,
              googleFallbackEligible: google.length,
              fallback: feed.fallback,
              fallbackReason: feed.fallbackReason,
              examples: feed.items.slice(0, 15).map((item) => ({
                id: item.content_id,
                title: item.title,
                provider: item.photo_provider,
                hasPhoto: Boolean(item.photo_url || item.cover_url),
                hasGoogle: Boolean(item.google_place_id),
                distanceM: item.distance_m
              }))
            }, null, 2))
            if (!feed.items.length) throw new Error('Supabase-only fallback returned no Toronto cards.')
          } finally {
            if (userId) await admin.auth.admin.deleteUser(userId)
          }
          NODE
