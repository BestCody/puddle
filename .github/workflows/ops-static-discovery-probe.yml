name: Ops - probe Backblaze manifest access

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ops-static-discovery-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      B2_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
      B2_REGION: ${{ secrets.B2_REGION }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_DOWNLOAD_BASE_URL: ${{ secrets.B2_DOWNLOAD_BASE_URL }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Read only catalogue manifest once
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { b2Configuration, signB2Request } from './lib/app/b2-s3.js'

          const config = b2Configuration()
          if (!config) throw new Error('Backblaze B2 configuration is missing.')
          const signed = signB2Request({ method: 'GET', key: 'catalogue/manifest.json', config })
          const response = await fetch(signed.url, {
            method: 'GET',
            headers: signed.headers,
            redirect: 'error',
            signal: AbortSignal.timeout(10_000)
          })
          const raw = (await response.text()).slice(0, 4000)
          const safe = raw
            .replaceAll(config.accessKeyId, '[redacted-key-id]')
            .replaceAll(config.secretAccessKey, '[redacted-application-key]')
          console.log(`status=${response.status}`)
          console.log(`content-type=${response.headers.get('content-type') || ''}`)
          console.log(`retry-after=${response.headers.get('retry-after') || ''}`)
          console.log('body-begin')
          console.log(safe)
          console.log('body-end')
          if (!response.ok) process.exitCode = 1
          NODE
