name: Ops - import open photos for live cards

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ops-live-photo-open-import.yml'

permissions:
  contents: read

concurrency:
  group: ops-live-photo-open-import
  cancel-in-progress: false

jobs:
  import-live-card-photos:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      B2_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
      B2_REGION: ${{ secrets.B2_REGION }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_DOWNLOAD_BASE_URL: ${{ secrets.B2_DOWNLOAD_BASE_URL }}
      MAPILLARY_ACCESS_TOKEN: ${{ secrets.MAPILLARY_ACCESS_TOKEN }}
      OPEN_PHOTO_MIN_SCORE: '0.60'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Import open photos for exact production smoke cards
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createAdminClient } from './lib/supabase/admin.js'
          import { b2Configuration } from './lib/app/b2-s3.js'
          import { storeOpenPhotoInB2 } from './lib/app/open-photo-b2.js'
          import {
            downloadStaticOpenPhotoCandidate,
            findStaticOpenPhotoCandidates
          } from './lib/app/static-open-photo-provider.js'
          import { loadStaticReleasePlan, readStaticReleaseTile } from './lib/app/static-catalogue-release.js'
          import { syncStaticMediaOverlayRecords } from './lib/app/static-media-overlay.js'

          const TARGET_IDS = [
            'b38cac40-8a46-55a3-b199-4b9c86eccbc1',
            '231074a7-ead0-53ba-90c3-af694d376245',
            '78a00dd1-1feb-5c59-8eca-a83341b497d4',
            '77b59b2d-f2c8-5a35-a46f-1e79389f4412',
            '5df74d0a-42a1-52b6-8183-34ba2fdd93dc',
            '2b0a396b-3fe7-5a9b-9603-5c0eba324344',
            'e55055af-b86a-5b71-8faa-318c8930752b',
            '67415543-5877-5405-8e60-1faddd499bdc'
          ]
          const targets = new Set(TARGET_IDS)
          const config = b2Configuration()
          if (!config?.downloadBaseUrl) throw new Error('Backblaze B2 configuration is required.')
          const admin = createAdminClient()
          const plan = await loadStaticReleasePlan({ config })
          const found = new Map()

          for (const tile of plan.tiles) {
            if (found.size === targets.size) break
            const { places } = await readStaticReleaseTile(plan.release, tile, { config })
            for (const place of places) {
              if (targets.has(place.staticLocationId)) found.set(place.staticLocationId, place)
            }
          }

          function relation(value) {
            return Array.isArray(value) ? value[0] || null : value || null
          }

          async function staticAsset(id) {
            const result = await admin
              .from('static_location_assets')
              .select('static_location_id,source,source_place_id,photo_provider,external_photo_id,attribution_text,attribution_url,license_code,terms_url,google_place_id,google_match_score,google_matched_name,media_objects(public_url,storage_key,byte_size,width,height)')
              .eq('static_location_id', id)
              .maybeSingle()
            if (result.error && result.error.code !== 'PGRST116') throw result.error
            return result.data || null
          }

          function overlayRecord(place, asset) {
            const media = relation(asset?.media_objects)
            return {
              staticLocationId: place.staticLocationId,
              latitude: place.latitude,
              longitude: place.longitude,
              photoUrl: media?.public_url || null,
              photoProvider: asset?.photo_provider || null,
              attributionText: asset?.attribution_text || null,
              attributionUrl: asset?.attribution_url || null,
              licenseCode: asset?.license_code || null,
              googlePlaceId: asset?.google_place_id || null,
              googleMatchScore: asset?.google_match_score ?? null
            }
          }

          async function persistPhoto(place, candidate) {
            const source = await downloadStaticOpenPhotoCandidate(candidate)
            const stored = await storeOpenPhotoInB2(admin, source, { config })
            const saved = await admin.rpc('upsert_static_location_asset_v1', {
              target_static_location: place.staticLocationId,
              import_source: place.source,
              import_source_place_id: place.sourcePlaceId,
              photo_media_object: stored.mediaObjectId,
              photo_provider_value: candidate.provider,
              external_photo_value: candidate.externalId,
              attribution_text_value: candidate.attribution,
              attribution_url_value: candidate.pageUrl,
              license_code_value: candidate.license,
              terms_url_value: candidate.licenseUrl
            })
            if (saved.error) throw saved.error
            const asset = await staticAsset(place.staticLocationId)
            await syncStaticMediaOverlayRecords([overlayRecord(place, asset)], { config, zoom: place.tile.z })
            return { stored, asset }
          }

          let existing = 0
          let imported = 0
          let noCandidate = 0
          let failed = 0
          let missing = 0

          for (const id of TARGET_IDS) {
            const place = found.get(id)
            if (!place) {
              missing += 1
              console.log(`Target not found in active release: ${id}`)
              continue
            }

            const current = await staticAsset(id)
            if (relation(current?.media_objects)?.public_url) {
              existing += 1
              await syncStaticMediaOverlayRecords([overlayRecord(place, current)], { config, zoom: place.tile.z })
              console.log(`Existing open photo retained for ${place.name}.`)
              continue
            }

            const result = await findStaticOpenPhotoCandidates(place, {
              minScore: 0.60,
              maxCandidatesPerProvider: 3
            })
            if (!result.candidates.length) {
              noCandidate += 1
              console.log(`No open candidate for ${place.name}; provider diagnostics: ${result.failures.slice(0, 3).join(' | ') || 'none'}`)
              continue
            }

            let stored = false
            for (const candidate of result.candidates.slice(0, 6)) {
              try {
                console.log(`Trying ${place.name} from ${candidate.provider} (${candidate.score.toFixed(3)}).`)
                const saved = await persistPhoto(place, candidate)
                imported += 1
                stored = true
                console.log(`Stored ${place.name} from ${candidate.provider}: ${saved.stored.byteSize} bytes.`)
                break
              } catch (error) {
                console.warn(`${place.name}: ${candidate.provider} candidate failed: ${error.message}`)
              }
            }
            if (!stored) failed += 1
          }

          const summary = {
            release: plan.release,
            targets: TARGET_IDS.length,
            found: found.size,
            existing,
            imported,
            noCandidate,
            failed,
            missing
          }
          console.log(JSON.stringify(summary, null, 2))
          if (existing + imported < 1) throw new Error('No production smoke card has a stored open photo after the targeted run.')
          NODE
