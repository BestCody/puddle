name: Build global location dataset

on:
  workflow_dispatch:
    inputs:
      activate_opensearch:
        description: Build, validate, and switch the OpenSearch active alias after the canonical snapshot succeeds
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

concurrency:
  group: global-location-dataset
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.GLOBAL_DATA_PIPELINE_ENABLED == 'true'
    runs-on: ${{ vars.GLOBAL_DATA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 360
    env:
      B2_DATA_APPLICATION_KEY_ID: ${{ secrets.B2_DATA_APPLICATION_KEY_ID || secrets.B2_KEY_ID }}
      B2_DATA_APPLICATION_KEY: ${{ secrets.B2_DATA_APPLICATION_KEY || secrets.B2_APPLICATION_KEY }}
      B2_DATA_BUCKET_NAME: ${{ vars.B2_DATA_BUCKET_NAME || secrets.B2_BUCKET || 'puddle-assets' }}
      B2_DATA_S3_ENDPOINT: ${{ secrets.B2_DATA_S3_ENDPOINT || secrets.B2_S3_ENDPOINT }}
      B2_DATA_S3_REGION: ${{ vars.B2_DATA_S3_REGION || secrets.B2_REGION || 'us-east-005' }}
      B2_DATA_PREFIX: data
      GLOBAL_BOOTSTRAP_B2_PREFIX: data/snapshots/bootstrap/current
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install bulk data dependencies
        run: python -m pip install --disable-pip-version-check duckdb boto3
      - id: snapshot
        shell: bash
        run: echo "snapshot=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - id: overture
        name: Mirror latest Overture Places release to canonical B2 raw lake
        run: python scripts/global-data/mirror_overture.py --release=latest
      - id: fsq
        name: Mirror FSQ OS bulk release to canonical B2 raw lake
        run: python scripts/global-data/mirror_fsq_iceberg.py
        env:
          FSQ_OS_CONNECTION_SQL: ${{ secrets.FSQ_OS_CONNECTION_SQL }}
          FSQ_ICEBERG_TOKEN: ${{ secrets.FSQ_ICEBERG_TOKEN }}
          FSQ_ICEBERG_ENDPOINT: ${{ vars.FSQ_ICEBERG_ENDPOINT || 'https://h3-hub-foursquare.acryl.io/gms/iceberg/' }}
          FSQ_ICEBERG_CATALOG: ${{ vars.FSQ_ICEBERG_CATALOG || 'open_h3' }}
          FSQ_ICEBERG_TABLE: ${{ vars.FSQ_ICEBERG_TABLE }}
          FSQ_ICEBERG_DELTA_TABLE: ${{ vars.FSQ_ICEBERG_DELTA_TABLE }}
      - name: Vector-normalize both source datasets into country partitions
        run: python scripts/global-data/stage_global_sources.py --overture-release='${{ steps.overture.outputs.overture_release }}' --fsq-release='${{ steps.fsq.outputs.fsq_release }}' --snapshot='${{ steps.snapshot.outputs.snapshot }}'
        env:
          DUCKDB_TEMP_DIRECTORY: ${{ runner.temp }}/duckdb
      - name: Resolve cross-source entities and preserve existing Puddle UUIDs
        run: python scripts/global-data/resolve_global_entities.py --snapshot='${{ steps.snapshot.outputs.snapshot }}' --bootstrap-prefix='data/snapshots/bootstrap/current'
        env:
          DUCKDB_TEMP_DIRECTORY: ${{ runner.temp }}/duckdb
          GLOBAL_LOCATION_COUNTRIES: ${{ vars.GLOBAL_LOCATION_COUNTRIES }}
      - name: Carry current photo and Google-ID overlays into the snapshot
        run: python scripts/global-data/build_bootstrap_overlays.py --snapshot='${{ steps.snapshot.outputs.snapshot }}' --bootstrap-prefix='data/snapshots/bootstrap/current'
      - name: Build, validate and atomically activate blue/green OpenSearch index
        if: (github.event_name == 'workflow_dispatch' && inputs.activate_opensearch) || (github.event_name != 'workflow_dispatch' && vars.GLOBAL_OPENSEARCH_INDEX_ENABLED == 'true')
        run: python scripts/global-data/index_opensearch.py --snapshot='${{ steps.snapshot.outputs.snapshot }}' --alias=locations-active
        env:
          GLOBAL_LOCATION_SEARCH_URL: ${{ secrets.OPENSEARCH_URL }}
          OPENSEARCH_USERNAME: ${{ secrets.OPENSEARCH_USERNAME }}
          OPENSEARCH_PASSWORD: ${{ secrets.OPENSEARCH_PASSWORD }}
          OPENSEARCH_BEARER_TOKEN: ${{ secrets.OPENSEARCH_BEARER_TOKEN }}
          OPENSEARCH_LOCATION_SHARDS: ${{ vars.OPENSEARCH_LOCATION_SHARDS || '6' }}
          OPENSEARCH_LOCATION_REPLICAS: ${{ vars.OPENSEARCH_LOCATION_REPLICAS || '1' }}
