name: Build global location dataset

on:
  workflow_dispatch:
    inputs:
      activate_search:
        description: Build, validate, and atomically activate the B2 search snapshot
        required: false
        default: true
        type: boolean
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

concurrency:
  group: global-location-dataset
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || vars.GLOBAL_DATA_PIPELINE_ENABLED == 'true'
    runs-on: ${{ vars.GLOBAL_DATA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 360
    env:
      B2_DATA_APPLICATION_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_DATA_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_DATA_BUCKET_NAME: ${{ secrets.B2_BUCKET }}
      B2_DATA_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
      B2_DATA_S3_REGION: ${{ secrets.B2_REGION }}
      B2_DATA_PREFIX: data
      GLOBAL_BOOTSTRAP_B2_PREFIX: data/snapshots/bootstrap/current
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install bulk data and search-index dependencies
        run: python -m pip install --disable-pip-version-check duckdb boto3 numpy 'h3>=4,<5' brotli orjson zstandard
      - name: Validate current bootstrap schema before expensive global work
        run: python scripts/global-data/verify_bootstrap_schema.py
      - id: active
        name: Resolve active snapshot for canonical enrichment carry-forward
        run: python scripts/global-data/active_snapshot.py
      - id: snapshot
        shell: bash
        run: echo "snapshot=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - id: overture
        name: Mirror latest Overture Places release to canonical B2 raw lake
        run: python scripts/global-data/mirror_overture.py --release=latest
      - id: fsq
        name: Mirror FSQ OS bulk release to canonical B2 raw lake
        run: python scripts/global-data/mirror_fsq_iceberg.py
        env:
          FSQ_OS_CONNECTION_SQL: ${{ secrets.FSQ_OS_CONNECTION_SQL }}
          FSQ_ICEBERG_TOKEN: ${{ secrets.FSQ_ICEBERG_TOKEN }}
          FSQ_ICEBERG_ENDPOINT: ${{ vars.FSQ_ICEBERG_ENDPOINT || 'https://h3-hub-foursquare.acryl.io/gms/iceberg/' }}
          FSQ_ICEBERG_CATALOG: ${{ vars.FSQ_ICEBERG_CATALOG || 'open_h3' }}
          FSQ_ICEBERG_TABLE: ${{ vars.FSQ_ICEBERG_TABLE }}
          FSQ_ICEBERG_DELTA_TABLE: ${{ vars.FSQ_ICEBERG_DELTA_TABLE }}
      - name: Vector-normalize both source datasets into country partitions
        run: python scripts/global-data/stage_global_sources.py --overture-release='${{ steps.overture.outputs.overture_release }}' --fsq-release='${{ steps.fsq.outputs.fsq_release }}' --snapshot='${{ steps.snapshot.outputs.snapshot }}'
        env:
          DUCKDB_TEMP_DIRECTORY: ${{ runner.temp }}/duckdb
      - name: Resolve cross-source entities and preserve existing Puddle UUIDs
        run: python scripts/global-data/resolve_global_entities.py --snapshot='${{ steps.snapshot.outputs.snapshot }}' --bootstrap-prefix='data/snapshots/bootstrap/current'
        env:
          DUCKDB_TEMP_DIRECTORY: ${{ runner.temp }}/duckdb
          GLOBAL_LOCATION_COUNTRIES: ${{ vars.GLOBAL_LOCATION_COUNTRIES }}
      - name: Carry canonical photo metadata and exclusions into the new snapshot
        run: >-
          python scripts/global-data/carry_photo_enrichment.py
          --source-snapshot='${{ steps.active.outputs.snapshot }}'
          --target-snapshot='${{ steps.snapshot.outputs.snapshot }}'
      - name: Carry current photo and Google-ID overlays into the snapshot
        run: python scripts/global-data/build_bootstrap_overlays.py --snapshot='${{ steps.snapshot.outputs.snapshot }}' --bootstrap-prefix='data/snapshots/bootstrap/current'
      - name: Build immutable adaptive-H3 B2 search snapshot
        run: python scripts/global-data/build_b2_search_index.py --snapshot='${{ steps.snapshot.outputs.snapshot }}'
        env:
          DUCKDB_TEMP_DIRECTORY: ${{ runner.temp }}/duckdb
          GLOBAL_LOCATION_SEARCH_WORK_DIR: ${{ runner.temp }}/b2-search-index
          GLOBAL_LOCATION_BUILD_THREADS: ${{ vars.GLOBAL_LOCATION_BUILD_THREADS || '8' }}
          GLOBAL_LOCATION_H3_ROOT_RESOLUTION: ${{ vars.GLOBAL_LOCATION_H3_ROOT_RESOLUTION || '5' }}
          GLOBAL_LOCATION_H3_MAX_RESOLUTION: ${{ vars.GLOBAL_LOCATION_H3_MAX_RESOLUTION || '10' }}
          GLOBAL_LOCATION_SHARD_TARGET_CANDIDATES: ${{ vars.GLOBAL_LOCATION_SHARD_TARGET_CANDIDATES || '6000' }}
          GLOBAL_LOCATION_SHARD_HARD_CANDIDATES: ${{ vars.GLOBAL_LOCATION_SHARD_HARD_CANDIDATES || '20000' }}
          GLOBAL_LOCATION_SHARD_TARGET_BYTES: ${{ vars.GLOBAL_LOCATION_SHARD_TARGET_BYTES || '786432' }}
          GLOBAL_LOCATION_SHARD_HARD_BYTES: ${{ vars.GLOBAL_LOCATION_SHARD_HARD_BYTES || '2097152' }}
      - name: Validate immutable B2 search snapshot
        run: python scripts/global-data/validate_b2_search_index.py --snapshot='${{ steps.snapshot.outputs.snapshot }}'
      - name: Atomically activate validated B2 search snapshot
        if: github.event_name != 'workflow_dispatch' || inputs.activate_search
        run: python scripts/global-data/validate_b2_search_index.py --snapshot='${{ steps.snapshot.outputs.snapshot }}' --activate
