name: Validate

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Compile global data Python scripts
        run: python -m py_compile scripts/global-data/*.py
      - name: Run no-key global data fixture smoke test
        run: python scripts/global-data/fixture_smoke.py
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run repository checks and build
        run: npm run build
      - name: Install Chromium for local UI verification
        run: npx playwright install --with-deps chromium
      - name: Verify scoped UI with read-only local fixtures
        env:
          CSS_VISUAL_PRODUCTION: '1'
          NEXT_TELEMETRY_DISABLED: '1'
        run: npm run e2e:visual
      - name: Preserve UI screenshots and report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: scoped-ui-report
          path: |
            .e2e-local/css-report
            .e2e-local/css-regression
          include-hidden-files: true
          if-no-files-found: ignore
