name: Validate

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  finalize-media-architecture:
    if: ${{ github.event_name == 'pull_request' && github.actor == 'BestCody' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'media-hash-legacy-cleanup-20260818' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          token: ${{ github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: npm ci --no-audit --no-fund
      - name: Apply canonical media cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Hansen"
          git config user.email "louhansen811@gmail.com"
          git fetch origin main
          git show origin/main:scripts/one-off-finalize-media-architecture.py | python -
      - name: Verify durable media architecture
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check.mjs
          node --check scripts/import-open-location-photos.mjs
          python -m py_compile scripts/b2-preflight.py scripts/global-data/*.py
          node --test tests/unit/b2-native.test.mjs tests/unit/global-location-search.test.mjs tests/unit/open-photo-candidates.test.mjs
          test ! -e lib/app/open-photo-supabase.js
          test ! -e scripts/migrate-open-photos-to-b2.mjs
          test ! -e scripts/validate-open-photo-b2-migration.mjs
          test ! -e scripts/one-off-finalize-media-architecture.py
          if git grep -n -E 'storeOpenPhotoInSupabase|open-photo-supabase|OPEN_PHOTO_SUPABASE_BUCKET' -- ':!supabase/migrations/*' ':!docs/*' ':!scripts/check.mjs'; then
            echo 'Retired open-photo compatibility remains in active code.' >&2
            exit 1
          fi
      - name: Commit and push verified cleanup
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git commit -m "Remove retired open-photo compatibility"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Compile global data Python scripts
        run: python -m py_compile scripts/b2-preflight.py scripts/global-data/*.py
      - name: Run no-key global data fixture smoke test
        run: python scripts/global-data/fixture_smoke.py
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run repository checks and build
        run: npm run build
