name: Validate

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Compile global data Python scripts
        run: python -m py_compile scripts/b2-preflight.py scripts/global-data/*.py
      - name: Run no-key global data fixture smoke test
        run: python scripts/global-data/fixture_smoke.py
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Run repository checks and build
        run: npm run build
      - name: Launch B2 migration when explicitly requested
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, '[launch-b2-migration]')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          workflow_id = '337946286'
          headers = {
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }

          enable_url = f'https://api.github.com/repos/{repo}/actions/workflows/{workflow_id}/enable'
          enable = urllib.request.Request(enable_url, data=b'', method='PUT', headers=headers)
          with urllib.request.urlopen(enable, timeout=30) as response:
              print(f'b2_migration_workflow_enable_status={response.status}')

          dispatch_url = f'https://api.github.com/repos/{repo}/actions/workflows/{workflow_id}/dispatches'
          body = json.dumps({'ref': 'main'}).encode()
          dispatch = urllib.request.Request(dispatch_url, data=body, method='POST', headers=headers)
          with urllib.request.urlopen(dispatch, timeout=30) as response:
              print(f'b2_migration_workflow_dispatch_status={response.status}')
          PY
