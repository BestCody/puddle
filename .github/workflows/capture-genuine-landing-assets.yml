name: Capture genuine landing assets

on:
  push:
    branches:
      - agent/genuine-figma-landing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/genuine-figma-landing
      - name: Download exact individual Figma assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/figma/assets
          if [ -f public/figma/assets/hero-left.png ]; then
            echo "Assets already captured."
            exit 0
          fi
          curl -L --fail --retry 3 -o public/figma/assets/hero-left.png 'https://www.figma.com/api/mcp/asset/71581d92-7694-4675-a72b-3fa0854e820a.png'
          curl -L --fail --retry 3 -o public/figma/assets/hero-right.png 'https://www.figma.com/api/mcp/asset/d6b22f80-0cde-4b7a-a724-6bda00cd629c.png'
          curl -L --fail --retry 3 -o public/figma/assets/google.png 'https://www.figma.com/api/mcp/asset/b4a2d373-da27-42d0-a653-3c04c5e39b7f.png'
          curl -L --fail --retry 3 -o public/figma/assets/city.png 'https://www.figma.com/api/mcp/asset/556b290d-7cf8-41af-88d0-145f3bb1cfef.png'
          curl -L --fail --retry 3 -o public/figma/assets/collage-1.png 'https://www.figma.com/api/mcp/asset/2e3ba8bb-f2b7-47fe-8f74-87392e422984.png'
          curl -L --fail --retry 3 -o public/figma/assets/collage-4.png 'https://www.figma.com/api/mcp/asset/896eb4a0-1a63-4707-8485-82180f35ba2e.png'
          curl -L --fail --retry 3 -o public/figma/assets/collage-5.png 'https://www.figma.com/api/mcp/asset/5a5f9f9c-da42-4b2f-aab7-7b53bb4fc76c.png'
          curl -L --fail --retry 3 -o public/figma/assets/logo.svg 'https://www.figma.com/api/mcp/asset/be3a937a-cc95-462c-9153-9b4c03bac9e3.svg'
          curl -L --fail --retry 3 -o public/figma/assets/logo-large.svg 'https://www.figma.com/api/mcp/asset/8cfa431e-6c3c-44af-81d9-4999c4e2b0d5.svg'
          curl -L --fail --retry 3 -o public/figma/assets/menu.svg 'https://www.figma.com/api/mcp/asset/2a4859cc-05ef-4c42-8085-e3c6af72674d.svg'
          curl -L --fail --retry 3 -o public/figma/assets/feature-swipe.svg 'https://www.figma.com/api/mcp/asset/9635e024-a9f6-4240-84df-db622fd3f7e8.svg'
          curl -L --fail --retry 3 -o public/figma/assets/feature-save.svg 'https://www.figma.com/api/mcp/asset/4bb9d09c-5fd1-4982-a77c-3be7cab0a9b1.svg'
          curl -L --fail --retry 3 -o public/figma/assets/feature-feed.svg 'https://www.figma.com/api/mcp/asset/392e7f46-1204-47a0-a0c3-1a1e4663c46f.svg'
          curl -L --fail --retry 3 -o public/figma/assets/hero-phone.png 'https://www.figma.com/api/mcp/asset/d2a635bc-9500-4704-bb98-31173197dd60.png'
          curl -L --fail --retry 3 -o public/figma/assets/phone-swipe.png 'https://www.figma.com/api/mcp/asset/b779c91d-d683-4cce-b3e8-e1f12a8cc67a.png'
          curl -L --fail --retry 3 -o public/figma/assets/phone-save.png 'https://www.figma.com/api/mcp/asset/3e48354e-0403-46ed-8608-e56c40fc887a.png'
          curl -L --fail --retry 3 -o public/figma/assets/phone-feed.png 'https://www.figma.com/api/mcp/asset/09f4ad99-e294-480d-b3e8-c6f4a0010318.png'
          curl -L --fail --retry 3 -o public/figma/assets/phone-profile.png 'https://www.figma.com/api/mcp/asset/8dfef283-2754-4b69-a76f-690d7a49cca5.png'
          curl -L --fail --retry 3 -o public/figma/assets/heart.png 'https://www.figma.com/api/mcp/asset/da0b50a6-30ba-4c08-bf09-b6a90664c20b.png'
          curl -L --fail --retry 3 -o public/figma/assets/move.png 'https://www.figma.com/api/mcp/asset/02822558-2eae-4a3e-92d3-324a06a7c346.png'
          curl -L --fail --retry 3 -o public/figma/assets/lock.png 'https://www.figma.com/api/mcp/asset/b9390a53-bb3a-42ed-910d-ef533c6ca9f6.png'
          curl -L --fail --retry 3 -o public/figma/assets/mobile-arrow.svg 'https://www.figma.com/api/mcp/asset/9c030047-7a4b-4368-afc5-b0fa4cdd9342.svg'
          curl -L --fail --retry 3 -o public/figma/assets/mobile-divider.png 'https://www.figma.com/api/mcp/asset/0d924f7a-1731-4006-9235-a314c1522cf1.png'
      - name: Commit captured assets
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/figma/assets
          git commit -m 'Add individual Figma landing assets'
          git push origin HEAD:agent/genuine-figma-landing
