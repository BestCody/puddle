name: Resume global location activation

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/trigger-global-location-resume'

permissions:
  contents: read

# This recovery invocation intentionally supersedes the redundant full re-index
# currently in progress. The normal non-cancelling production setting is restored
# on main immediately after this run is triggered.
concurrency:
  group: global-location-dataset
  cancel-in-progress: true

env:
  GLOBAL_LOCATION_SNAPSHOT: '2026-08-17'
  PYTHONUNBUFFERED: '1'

jobs:
  activate-validated-index:
    runs-on: ${{ vars.GLOBAL_DATA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    env:
      GLOBAL_LOCATION_SEARCH_URL: ${{ secrets.OPENSEARCH_URL }}
      OPENSEARCH_USERNAME: ${{ secrets.OPENSEARCH_USERNAME }}
      OPENSEARCH_PASSWORD: ${{ secrets.OPENSEARCH_PASSWORD }}
      OPENSEARCH_LOCATION_SHARDS: ${{ vars.OPENSEARCH_LOCATION_SHARDS || '6' }}
      OPENSEARCH_LOCATION_REPLICAS: ${{ vars.OPENSEARCH_LOCATION_REPLICAS || '2' }}
      B2_DATA_APPLICATION_KEY_ID: ${{ secrets.B2_DATA_APPLICATION_KEY_ID || secrets.B2_KEY_ID }}
      B2_DATA_APPLICATION_KEY: ${{ secrets.B2_DATA_APPLICATION_KEY || secrets.B2_APPLICATION_KEY }}
      B2_DATA_BUCKET_NAME: ${{ vars.B2_DATA_BUCKET_NAME || secrets.B2_BUCKET || 'puddle-assets' }}
      B2_DATA_S3_ENDPOINT: ${{ secrets.B2_DATA_S3_ENDPOINT || secrets.B2_S3_ENDPOINT }}
      B2_DATA_S3_REGION: ${{ vars.B2_DATA_S3_REGION || secrets.B2_REGION || 'us-east-005' }}
      B2_DATA_PREFIX: data
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install activation dependencies
        run: python -m pip install --disable-pip-version-check boto3
      - name: Validate existing 29.9M-document index and atomically activate it
        run: >-
          python scripts/global-data/activate_existing_opensearch_index.py
          --index=locations-v1-2026-08-17-1786951831
          --alias=locations-active
          --expected-count=29899219
          --snapshot="$GLOBAL_LOCATION_SNAPSHOT"
