name: Sync B2 media runtime auth

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-b2-media-runtime-auth.yml'
      - 'supabase/migrations/10072_b2_media_runtime_vault.sql'
      - 'supabase/migrations/20260825180000_b2_media_bucket_id_optional.sql'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-b2-media-runtime-auth
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      # The first production deployment reuses the existing restricted B2 key.
      # Keep the runtime namespace explicit while accepting the repository's
      # established legacy secret names until separately scoped media keys exist.
      B2_MEDIA_APPLICATION_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_MEDIA_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_MEDIA_BUCKET_ID: ${{ secrets.B2_BUCKET_ID }}
      B2_MEDIA_BUCKET_NAME: ${{ secrets.B2_BUCKET }}
    steps:
      - name: Validate required secret presence
        shell: bash
        run: |
          set -euo pipefail
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$SUPABASE_SECRET_KEY"
          test -n "$B2_MEDIA_APPLICATION_KEY_ID"
          test -n "$B2_MEDIA_APPLICATION_KEY"
          test -n "$B2_MEDIA_BUCKET_NAME"

      - name: Verify private B2 read access and store encrypted runtime copy
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const required = [
            'NEXT_PUBLIC_SUPABASE_URL', 'SUPABASE_SECRET_KEY',
            'B2_MEDIA_APPLICATION_KEY_ID', 'B2_MEDIA_APPLICATION_KEY',
            'B2_MEDIA_BUCKET_NAME'
          ]
          for (const name of required) if (!process.env[name]) throw new Error(`${name} is not configured.`)

          const authorization = `Basic ${Buffer.from(`${process.env.B2_MEDIA_APPLICATION_KEY_ID}:${process.env.B2_MEDIA_APPLICATION_KEY}`).toString('base64')}`
          const b2Response = await fetch('https://api.backblazeb2.com/b2api/v4/b2_authorize_account', {
            headers: { Authorization: authorization, Accept: 'application/json' },
            redirect: 'error',
            signal: AbortSignal.timeout(10_000)
          })
          if (!b2Response.ok) throw new Error(`B2 credential verification failed with HTTP ${b2Response.status}.`)
          const b2 = await b2Response.json()
          const storage = b2?.apiInfo?.storageApi
          const buckets = Array.isArray(storage?.allowed?.buckets) ? storage.allowed.buckets : []
          const capabilities = new Set(storage?.allowed?.capabilities || [])
          if (!storage?.downloadUrl || !b2?.authorizationToken) throw new Error('B2 authorization did not return a download endpoint.')
          if (capabilities.size && !capabilities.has('readFiles')) throw new Error('B2 media key lacks readFiles capability.')
          const configuredBucketId = process.env.B2_MEDIA_BUCKET_ID || ''
          const configuredBucketName = process.env.B2_MEDIA_BUCKET_NAME
          const matchingBucket = buckets.find((bucket) => {
            const idMatches = !configuredBucketId || bucket?.id === configuredBucketId
            return idMatches && bucket?.name === configuredBucketName
          })
          if (buckets.length && !matchingBucket) {
            throw new Error('B2 media key is not restricted to/authorized for the configured production bucket.')
          }
          // B2 data/runtime auth already supports unrestricted keys scoped by bucket
          // name. Preserve that behavior when the legacy repository secrets do not
          // include a bucket ID; a restricted key still yields and stores its ID.
          const bucketId = configuredBucketId || matchingBucket?.id || ''

          const supabaseUrl = process.env.NEXT_PUBLIC_SUPABASE_URL.replace(/\/$/, '')
          const serviceKey = process.env.SUPABASE_SECRET_KEY
          const vaultResponse = await fetch(`${supabaseUrl}/rest/v1/rpc/set_b2_media_runtime_auth`, {
            method: 'POST',
            headers: {
              apikey: serviceKey,
              Authorization: `Bearer ${serviceKey}`,
              'Content-Type': 'application/json',
              Accept: 'application/json'
            },
            body: JSON.stringify({
              p_key_id: process.env.B2_MEDIA_APPLICATION_KEY_ID,
              p_application_key: process.env.B2_MEDIA_APPLICATION_KEY,
              p_bucket_id: bucketId,
              p_bucket_name: configuredBucketName
            }),
            redirect: 'error',
            signal: AbortSignal.timeout(10_000)
          })
          if (!vaultResponse.ok) {
            const message = await vaultResponse.text().catch(() => '')
            throw new Error(`Supabase Vault B2 sync failed with HTTP ${vaultResponse.status}${message ? `: ${message.slice(0, 200)}` : ''}.`)
          }

          console.log('Private B2 media credentials verified and encrypted runtime auth synchronized to Supabase Vault.')
          NODE
