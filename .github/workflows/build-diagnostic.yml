name: Apply Validated Release Fix
on:
  push:
    branches: [agent/vercel-build-diagnostic]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test
      SUPABASE_SERVICE_ROLE_KEY: test_service_role_key
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      TURNSTILE_REQUIRED: "false"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/vercel-build-diagnostic
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Update stale Stage 3 validation markers
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const path = 'scripts/check.mjs'
          const source = fs.readFileSync(path, 'utf8')
          const legacy = "['scoreCandidate','diversify','rules-v1','logDiscoveryImpressions','dismissed']"
          const current = "['scoreHybridCandidate','diversifyRecommendations','RULES_FALLBACK_VERSION','logDiscoveryImpressions','dismissed']"
          if (source.includes(legacy)) fs.writeFileSync(path, source.replace(legacy, current))
          else if (!source.includes(current)) throw new Error('Discovery validation marker set is unexpected')
          NODE
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Commit validated check fix
        run: |
          if git diff --quiet -- scripts/check.mjs; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/check.mjs
          git commit -m "Fix release validation markers"
          git push origin HEAD:agent/vercel-build-diagnostic
