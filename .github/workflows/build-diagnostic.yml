name: Vercel Build Diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test
      SUPABASE_SERVICE_ROLE_KEY: test_service_role_key
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      TURNSTILE_REQUIRED: "false"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Update stale Stage 3 validation markers
        run: |
          node - <<'NODE'
          const fs = require('node:fs')
          const path = 'scripts/check.mjs'
          const source = fs.readFileSync(path, 'utf8')
          const legacy = "['scoreCandidate','diversify','rules-v1','logDiscoveryImpressions','dismissed']"
          const current = "['scoreHybridCandidate','diversifyRecommendations','RULES_FALLBACK_VERSION','logDiscoveryImpressions','dismissed']"
          if (!source.includes(legacy)) throw new Error('Legacy discovery validation marker was not found')
          fs.writeFileSync(path, source.replace(legacy, current))
          NODE
      - run: npm run build
