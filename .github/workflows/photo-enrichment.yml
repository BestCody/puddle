name: Enrich place photos

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'

permissions:
  contents: read

concurrency:
  group: progressive-place-photo-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    if: ${{ vars.R2_INFRA_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm ci --no-audit --no-fund
      - name: Drain prioritized open-photo candidates into R2
        run: npm run locations:photos:enrich
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MAPILLARY_ACCESS_TOKEN: ${{ secrets.MAPILLARY_ACCESS_TOKEN }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          PHOTO_ENRICH_MIGRATOR: 'scripts/migrate-open-photos-to-r2.mjs'
          OPEN_PHOTO_R2_MIGRATION_LIMIT: '100'
          OPEN_PHOTO_TARGET_BYTES: '45000'
          OPEN_PHOTO_HARD_MAX_BYTES: '60000'
          PHOTO_ENRICH_BATCH_SIZE: '100'
          PHOTO_ENRICH_MAX_BATCHES: '50'
          PHOTO_ENRICH_MAX_RUNTIME_MINUTES: '105'
          OPEN_PHOTO_MIN_SCORE: '0.76'
          OPEN_PHOTO_REQUEST_TIMEOUT_MS: '12000'
          OPEN_PHOTO_WIKIMEDIA_MIN_INTERVAL_MS: '1100'
          OPEN_PHOTO_MAX_CANDIDATES_PER_PROVIDER: '3'
          OPEN_PHOTO_CLAIM_MIN_BATCH_SIZE: '1'
