name: Enrich place photos (legacy manual)

# Transitional relational-catalogue importer. Continuous free-provider quota is
# owned by the global B2 workers so KartaView/Wikimedia requests are not spent
# twice. The historical schedule remains as a compatibility trigger, but the job
# is deliberately skipped unless this workflow is manually dispatched.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: legacy-place-photo-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    # B2_MEDIA_ENABLED no longer enables scheduled legacy imports; global B2 workers own that quota.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Drain prioritized open-photo candidates into B2 media
        run: npm run locations:photos:enrich
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MAPILLARY_ACCESS_TOKEN: ${{ secrets.MAPILLARY_ACCESS_TOKEN }}
          KARTAVIEW_ACCESS_TOKEN: ${{ secrets.KARTAVIEW_ACCESS_TOKEN }}
          B2_MEDIA_APPLICATION_KEY_ID: ${{ secrets.B2_MEDIA_APPLICATION_KEY_ID || secrets.B2_KEY_ID }}
          B2_MEDIA_APPLICATION_KEY: ${{ secrets.B2_MEDIA_APPLICATION_KEY || secrets.B2_APPLICATION_KEY }}
          B2_MEDIA_BUCKET_ID: ${{ secrets.B2_MEDIA_BUCKET_ID }}
          B2_MEDIA_BUCKET_NAME: ${{ vars.B2_MEDIA_BUCKET_NAME || secrets.B2_BUCKET || 'puddle-assets' }}
          B2_MEDIA_OPEN_PHOTO_PREFIX: ${{ vars.B2_MEDIA_OPEN_PHOTO_PREFIX || 'media/photos/by-sha256' }}
          PHOTO_ENRICH_BATCH_SIZE: '100'
          PHOTO_ENRICH_MAX_BATCHES: '200'
          PHOTO_ENRICH_MAX_RUNTIME_MINUTES: '110'
          OPEN_PHOTO_MIN_SCORE: '0.76'
          OPEN_PHOTO_REQUEST_TIMEOUT_MS: '12000'
          OPEN_PHOTO_LOCATION_CONCURRENCY: '100'
          OPEN_PHOTO_WIKIMEDIA_MIN_INTERVAL_MS: '300'
          OPEN_PHOTO_WIKIMEDIA_MAX_CONCURRENCY: '3'
          OPEN_PHOTO_MAPILLARY_MAX_CONCURRENCY: '32'
          OPEN_PHOTO_KARTAVIEW_MIN_INTERVAL_MS: '3600'
          OPEN_PHOTO_MAX_CANDIDATES_PER_PROVIDER: '3'
          OPEN_PHOTO_CLAIM_MIN_BATCH_SIZE: '1'
