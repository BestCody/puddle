name: Enrich place photos

# Transitional Supabase queue for the existing ~72k catalogue. Accepted image bytes
# are written to B2. Global-scale candidate discovery runs in global-photo-enrichment.yml.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/photo-enrichment.yml'
      - 'scripts/import-open-location-photos.mjs'
      - 'scripts/enrich-open-location-photos.mjs'
      - 'lib/app/open-photo-b2.js'
      - 'lib/app/open-photo-transform.js'
      - 'lib/storage/b2-native.js'

permissions:
  contents: read

concurrency:
  group: progressive-place-photo-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    if: github.event_name == 'workflow_dispatch' || vars.B2_MEDIA_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Drain prioritized open-photo candidates into B2 media
        run: npm run locations:photos:enrich
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MAPILLARY_ACCESS_TOKEN: ${{ secrets.MAPILLARY_ACCESS_TOKEN }}
          KARTAVIEW_ACCESS_TOKEN: ${{ secrets.KARTAVIEW_ACCESS_TOKEN }}
          B2_MEDIA_APPLICATION_KEY_ID: ${{ secrets.B2_MEDIA_APPLICATION_KEY_ID || secrets.B2_KEY_ID }}
          B2_MEDIA_APPLICATION_KEY: ${{ secrets.B2_MEDIA_APPLICATION_KEY || secrets.B2_APPLICATION_KEY }}
          B2_MEDIA_BUCKET_ID: ${{ secrets.B2_MEDIA_BUCKET_ID }}
          B2_MEDIA_BUCKET_NAME: ${{ vars.B2_MEDIA_BUCKET_NAME || secrets.B2_BUCKET || 'puddle-assets' }}
          B2_MEDIA_PUBLIC_BASE_URL: ${{ vars.B2_MEDIA_PUBLIC_BASE_URL || secrets.B2_DOWNLOAD_BASE_URL }}
          B2_MEDIA_OPEN_PHOTO_PREFIX: ${{ vars.B2_MEDIA_OPEN_PHOTO_PREFIX || 'media/photos/by-sha256' }}
          PHOTO_ENRICH_SYNC_MEDIA: 'false'
          PHOTO_ENRICH_BATCH_SIZE: '100'
          PHOTO_ENRICH_MAX_BATCHES: '200'
          PHOTO_ENRICH_MAX_RUNTIME_MINUTES: '110'
          OPEN_PHOTO_MIN_SCORE: '0.76'
          OPEN_PHOTO_REQUEST_TIMEOUT_MS: '12000'
          OPEN_PHOTO_LOCATION_CONCURRENCY: '100'
          # Identified Wikimedia clients: full 200 requests/minute, <=3 concurrent.
          OPEN_PHOTO_WIKIMEDIA_MIN_INTERVAL_MS: '300'
          OPEN_PHOTO_WIKIMEDIA_MAX_CONCURRENCY: '3'
          # No artificial Mapillary delay; current fallback importer saturates its 32-worker code path.
          OPEN_PHOTO_MAPILLARY_MAX_CONCURRENCY: '32'
          # Authenticated KartaView quota is 1,000/hour => 3.6 seconds/request.
          OPEN_PHOTO_KARTAVIEW_MIN_INTERVAL_MS: '3600'
          OPEN_PHOTO_MAX_CANDIDATES_PER_PROVIDER: '3'
          OPEN_PHOTO_CLAIM_MIN_BATCH_SIZE: '1'
