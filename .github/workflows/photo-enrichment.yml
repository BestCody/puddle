name: Enrich place photos

# Relational discovery reads approved open-photo rows directly from Supabase.
# Keep the catalogue moving in the background and run once when this workflow is
# changed so a stalled queue resumes immediately after deployment.
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/photo-enrichment.yml'

permissions:
  contents: read

concurrency:
  group: progressive-place-photo-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 115
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm ci --no-audit --no-fund
      - name: Drain prioritized open-photo candidates into Supabase public media
        run: npm run locations:photos:enrich
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          MAPILLARY_ACCESS_TOKEN: ${{ secrets.MAPILLARY_ACCESS_TOKEN }}
          PHOTO_ENRICH_SYNC_MEDIA: 'false'
          PHOTO_ENRICH_BATCH_SIZE: '100'
          PHOTO_ENRICH_MAX_BATCHES: '50'
          PHOTO_ENRICH_MAX_RUNTIME_MINUTES: '105'
          OPEN_PHOTO_MIN_SCORE: '0.76'
          OPEN_PHOTO_REQUEST_TIMEOUT_MS: '12000'
          OPEN_PHOTO_WIKIMEDIA_MIN_INTERVAL_MS: '1100'
          OPEN_PHOTO_MAX_CANDIDATES_PER_PROVIDER: '3'
          OPEN_PHOTO_CLAIM_MIN_BATCH_SIZE: '1'
