name: Deploy Contabo

on:
  workflow_run:
    workflows: [Validate]
    types: [completed]
    branches: [main]

concurrency:
  group: contabo-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://puddle.you
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.RELEASE_SHA }}
          persist-credentials: false
      - name: Skip superseded main revisions
        id: current
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "${{ github.repository }}"
          if test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$RELEASE_SHA"; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo 'deploy=false' >> "$GITHUB_OUTPUT"
            echo 'A newer main revision exists; skipping this release.'
          fi
      - name: Prepare public build configuration
        if: steps.current.outputs.deploy == 'true'
        env:
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os
          keys = ['NEXT_PUBLIC_SITE_URL', 'NEXT_PUBLIC_SUPABASE_URL', 'NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY', 'NEXT_PUBLIC_TURNSTILE_SITE_KEY', 'NEXT_PUBLIC_GOOGLE_MAPS_API_KEY']
          config = {key: os.environ.get(key, '') for key in keys}
          for key in keys[:3]:
              if not config[key]:
                  raise SystemExit(f'Missing public build variable: {key}')
          digest = hashlib.sha256(json.dumps(config, sort_keys=True, separators=(',', ':')).encode()).hexdigest()
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'PUBLIC_CONFIG_SHA={digest}\n')
              output.write(f'IMAGE=ghcr.io/{os.environ["GITHUB_REPOSITORY"].lower()}\n')
          PY
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        if: steps.current.outputs.deploy == 'true'
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        if: steps.current.outputs.deploy == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and publish the exact release
        if: steps.current.outputs.deploy == 'true'
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: deploy/self-host/Dockerfile
          push: true
          tags: ${{ env.IMAGE }}:${{ env.RELEASE_SHA }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.RELEASE_SHA }}
            you.puddle.public-config=${{ env.PUBLIC_CONFIG_SHA }}
          build-args: |
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
            NEXT_PUBLIC_SUPABASE_URL=${{ vars.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ vars.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
            PUDDLE_BUILD_SHA=${{ env.RELEASE_SHA }}
      - name: Activate on Contabo
        if: steps.current.outputs.deploy == 'true'
        env:
          DEPLOY_KEY: ${{ secrets.CONTABO_DEPLOY_KEY }}
          DEPLOY_HOST: ${{ vars.CONTABO_HOST }}
          KNOWN_HOSTS: ${{ vars.CONTABO_KNOWN_HOSTS }}
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          # Check again after building: never activate a known superseded release.
          if test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" != "$RELEASE_SHA"; then
            echo 'A newer main revision exists; skipping activation.'
            exit 0
          fi
          umask 077
          ssh_dir="$(mktemp -d)"
          trap 'rm -rf -- "$ssh_dir"' EXIT
          printf '%s\n' "$DEPLOY_KEY" > "$ssh_dir/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          git archive --format=tar.gz "$RELEASE_SHA" -- . ':(exclude,glob)**/.env*' > "$ssh_dir/source.tar.gz"
          { printf '%s\n' "$GH_TOKEN"; cat "$ssh_dir/source.tar.gz"; } |
            ssh -T -i "$ssh_dir/key" -o IdentitiesOnly=yes -o BatchMode=yes \
              -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
              -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$ssh_dir/known_hosts" \
              "root@$DEPLOY_HOST" "deploy $RELEASE_SHA $IMAGE@$IMAGE_DIGEST $GITHUB_ACTOR"
          response="$(curl --fail --silent --show-error --retry 3 --retry-delay 2 https://puddle.you/api/health)"
          HEALTH="$response" python3 - <<'PY'
          import json, os
          health = json.loads(os.environ['HEALTH'])
          assert health['ok'] and health['buildSha'] == os.environ['RELEASE_SHA'], 'Public release SHA mismatch'
          PY
          echo "Deployed $RELEASE_SHA to https://puddle.you" >> "$GITHUB_STEP_SUMMARY"
