name: Supabase size diagnostic

on:
  push:
    branches:
      - agent/catalogue-autopilot

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Link Supabase project
        shell: bash
        run: |
          set -euo pipefail
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Report table sizes
        shell: bash
        run: npx supabase inspect db table-sizes --linked

      - name: Report table and index sizes
        shell: bash
        run: npx supabase inspect db table-index-sizes --linked

      - name: Report individual index sizes
        shell: bash
        run: npx supabase inspect db index-sizes --linked

      - name: Estimate table bloat
        shell: bash
        run: npx supabase inspect db bloat --linked

      - name: Report estimated row counts
        shell: bash
        run: npx supabase inspect db table-record-counts --linked

      - name: Audit legacy catalogue ownership and dependencies
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createClient } from '@supabase/supabase-js'

          const client = createClient(
            process.env.NEXT_PUBLIC_SUPABASE_URL,
            process.env.SUPABASE_SECRET_KEY,
            { auth: { persistSession: false, autoRefreshToken: false } }
          )

          async function exactCount(table, configure = (query) => query) {
            let query = client.from(table).select('*', { count: 'exact', head: true })
            query = configure(query)
            const { count, error } = await query
            if (error) throw new Error(`${table}: ${error.message}`)
            return Number(count || 0)
          }

          const locationSources = {}
          for (const source of ['import', 'seed', 'user', 'host']) {
            locationSources[source] = await exactCount('locations', (query) => query.eq('source', source))
          }
          locationSources.other = await exactCount('locations', (query) => query.not('source', 'in', '(import,seed,user,host)'))
          const locationsWithoutCreator = await exactCount('locations', (query) => query.is('created_by', null))
          const claimedImportedLocations = await exactCount('locations', (query) => query.eq('source', 'import').not('claimed_by_host_id', 'is', null))

          const revisionSources = {}
          for (const source of ['create', 'autosave', 'manual', 'publication', 'status', 'claim', 'system', 'update']) {
            revisionSources[source] = await exactCount('location_revisions', (query) => query.eq('change_source', source))
          }

          async function relatedCount(table, foreignRelation, configure = (query) => query) {
            let query = client
              .from(table)
              .select(`*,${foreignRelation}!inner(source)`, { count: 'exact', head: true })
              .eq(`${foreignRelation}.source`, 'import')
            query = configure(query)
            const { count, error } = await query
            if (error) return { unavailable: error.message }
            return Number(count || 0)
          }

          const dependencies = {
            revisionsForImportedLocations: await relatedCount('location_revisions', 'locations'),
            savesOrStatesForImportedLocations: await relatedCount('user_content_states', 'locations'),
            eventsUsingImportedLocations: await relatedCount('events', 'locations'),
            claimsForImportedLocations: await relatedCount('location_claims', 'locations')
          }

          console.log(JSON.stringify({
            locationSources,
            locationsWithoutCreator,
            claimedImportedLocations,
            revisionSources,
            dependencies
          }, null, 2))
          NODE
