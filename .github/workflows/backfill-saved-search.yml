name: Backfill saved location search

on:
  workflow_dispatch:
    inputs:
      restart:
        description: Revisit every referenced global place
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: backfill-saved-location-search
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      B2_DATA_APPLICATION_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_DATA_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_DATA_BUCKET_NAME: ${{ secrets.B2_BUCKET }}
      B2_DATA_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
      B2_DATA_S3_REGION: ${{ secrets.B2_REGION }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Index references from the canonical B2 catalogue
        shell: bash
        env:
          RESTART: ${{ inputs.restart }}
        run: |
          set -euo pipefail
          if [[ "$RESTART" == 'true' ]]; then
            node scripts/backfill-location-ref-search.mjs --restart
          else
            node scripts/backfill-location-ref-search.mjs
          fi
