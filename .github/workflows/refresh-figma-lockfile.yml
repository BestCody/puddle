name: Refresh Figma branch lockfile

on:
  push:
    branches: [figma-official-shell-swipe]

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: figma-official-shell-swipe
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Refresh vulnerable transitive packages in lockfile
        run: |
          npm audit fix --package-lock-only --omit=dev --ignore-scripts --no-fund
      - name: Commit lockfile refresh
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No lockfile change required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Refresh audited transitive dependencies"
          git push origin HEAD:figma-official-shell-swipe
