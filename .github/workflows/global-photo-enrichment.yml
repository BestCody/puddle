name: Materialize global licensed photos

# Candidate discovery is intentionally split into independent quota workers:
# - scripts/global-data/build_wikimedia_candidates.py via global-wikimedia-enrichment.yml
# - scripts/global-data/build_mapillary_candidates.py via global-mapillary-enrichment.yml
# - scripts/global-data/build_kartaview_candidates.py via global-kartaview-enrichment.yml
# Historical relational photo bridges are retired. This workflow only reconciles
# canonical B2 metadata/claims and then drains ranked candidates into B2 media.

on:
  workflow_dispatch:
    inputs:
      countries:
        description: Comma-separated country codes; empty uses all active partitions
        required: false
        default: ''
        type: string
      materialize_limit:
        description: Maximum locations to attempt in this run; duplicate candidates automatically fall through
        required: false
        default: '100000'
        type: string
  schedule:
    - cron: '31 * * * *'

permissions:
  contents: read

concurrency:
  # Preserve the legacy group's name so a pre-merge monolithic run can never
  # overlap the first registry reconciliation/materialization run.
  group: global-photo-enrichment
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || vars.GLOBAL_PHOTO_PIPELINE_ENABLED == 'true'
    runs-on: ${{ vars.GLOBAL_DATA_RUNNER || 'ubuntu-latest' }}
    env:
      B2_DATA_APPLICATION_KEY_ID: ${{ secrets.B2_DATA_APPLICATION_KEY_ID || secrets.B2_KEY_ID }}
      B2_DATA_APPLICATION_KEY: ${{ secrets.B2_DATA_APPLICATION_KEY || secrets.B2_APPLICATION_KEY }}
      B2_DATA_BUCKET_NAME: ${{ vars.B2_DATA_BUCKET_NAME || secrets.B2_BUCKET || 'puddle-assets' }}
      B2_DATA_S3_ENDPOINT: ${{ secrets.B2_DATA_S3_ENDPOINT || secrets.B2_S3_ENDPOINT }}
      B2_DATA_S3_REGION: ${{ vars.B2_DATA_S3_REGION || secrets.B2_REGION || 'us-east-005' }}
      B2_DATA_PREFIX: data
      B2_MEDIA_APPLICATION_KEY_ID: ${{ secrets.B2_MEDIA_APPLICATION_KEY_ID || secrets.B2_KEY_ID }}
      B2_MEDIA_APPLICATION_KEY: ${{ secrets.B2_MEDIA_APPLICATION_KEY || secrets.B2_APPLICATION_KEY }}
      B2_MEDIA_BUCKET_NAME: ${{ vars.B2_MEDIA_BUCKET_NAME || secrets.B2_BUCKET || 'puddle-assets' }}
      B2_MEDIA_S3_ENDPOINT: ${{ secrets.B2_MEDIA_S3_ENDPOINT || secrets.B2_S3_ENDPOINT }}
      B2_MEDIA_OPEN_PHOTO_PREFIX: ${{ vars.B2_MEDIA_OPEN_PHOTO_PREFIX || 'media/photos/by-sha256' }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check duckdb boto3 pillow
      - id: active
        run: python scripts/global-data/active_snapshot.py
      - name: Reconcile pre-registry global B2 photo metadata once per snapshot
        run: python scripts/global-data/reconcile_existing_global_photo_claims.py
        env:
          GLOBAL_LOCATION_SNAPSHOT: ${{ steps.active.outputs.snapshot }}
          GLOBAL_PHOTO_EXISTING_RECONCILE_CONCURRENCY: ${{ vars.GLOBAL_PHOTO_EXISTING_RECONCILE_CONCURRENCY || '32' }}
      - name: Drain ranked unique licensed photos into immutable B2 media
        run: >-
          python scripts/global-data/materialize_photo_candidates.py
          --snapshot='${{ steps.active.outputs.snapshot }}'
          --countries='${{ github.event_name == 'workflow_dispatch' && inputs.countries || vars.GLOBAL_PHOTO_COUNTRIES }}'
          --limit='${{ github.event_name == 'workflow_dispatch' && inputs.materialize_limit || vars.GLOBAL_PHOTO_MATERIALIZE_LIMIT || '100000' }}'
        env:
          MAPILLARY_ACCESS_TOKEN: ${{ secrets.MAPILLARY_ACCESS_TOKEN }}
          # High overall parallelism; published provider limits are enforced independently in the materializer.
          GLOBAL_PHOTO_DOWNLOAD_CONCURRENCY: '192'
          # Wikimedia media policy: total concurrency <=2 and aggregate download speed <=25 Mbps.
          GLOBAL_PHOTO_WIKIMEDIA_DOWNLOAD_CONCURRENCY: '2'
          GLOBAL_PHOTO_WIKIMEDIA_DOWNLOAD_MBIT: '25'
          # Mapillary Graph API ceiling; direct CDN limits are not publicly specified, so 429/Retry-After controls downloads.
          MAPILLARY_GRAPH_REQUESTS_PER_MINUTE: '50000'
          GLOBAL_PHOTO_FALLBACK_CANDIDATES: ${{ vars.GLOBAL_PHOTO_FALLBACK_CANDIDATES || '9' }}
          GLOBAL_PHOTO_LOCATION_BATCH: ${{ vars.GLOBAL_PHOTO_LOCATION_BATCH || '2500' }}
          GLOBAL_PHOTO_CLAIM_LEASE_SECONDS: ${{ vars.GLOBAL_PHOTO_CLAIM_LEASE_SECONDS || '1200' }}
