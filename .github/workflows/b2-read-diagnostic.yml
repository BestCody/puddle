name: Diagnose B2 catalogue reads

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/b2-read-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    name: Read-only B2 diagnostics
    if: contains(github.event.head_commit.message, '[diagnose-b2-read]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      B2_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
      B2_REGION: ${{ secrets.B2_REGION }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      B2_DOWNLOAD_BASE_URL: ${{ secrets.B2_DOWNLOAD_BASE_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Inspect signed and public read responses
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { b2Configuration, b2PublicUrl, signB2Request } from './lib/app/b2-s3.js'

          const config = b2Configuration()
          if (!config) throw new Error('B2 configuration is invalid or incomplete.')

          const key = 'catalogue/releases/us-ca-cities-2026-08-05-catalogue-01/manifest.json'
          const prefix = 'catalogue/releases/us-ca-cities-2026-08-05-catalogue-01/'
          const timeout = () => AbortSignal.timeout(30_000)
          const xmlValue = (body, name) => body.match(new RegExp(`<${name}>([\\s\\S]*?)<\\/${name}>`))?.[1] || null
          const summarize = async (label, response, includeBody = true) => {
            const body = includeBody ? await response.text() : ''
            console.log(JSON.stringify({
              label,
              status: response.status,
              ok: response.ok,
              contentType: response.headers.get('content-type'),
              errorCode: xmlValue(body, 'Code'),
              errorMessage: xmlValue(body, 'Message')
            }))
          }

          const signedGet = signB2Request({ method: 'GET', key, config })
          await summarize('signed-get', await fetch(signedGet.url, {
            method: 'GET', headers: signedGet.headers, redirect: 'error', signal: timeout()
          }))

          const signedHead = signB2Request({ method: 'HEAD', key, config })
          await summarize('signed-head', await fetch(signedHead.url, {
            method: 'HEAD', headers: signedHead.headers, redirect: 'error', signal: timeout()
          }), false)

          const signedList = signB2Request({
            method: 'GET', key: '', query: { 'list-type': '2', prefix, 'max-keys': 5 }, config
          })
          await summarize('signed-list', await fetch(signedList.url, {
            method: 'GET', headers: signedList.headers, redirect: 'error', signal: timeout()
          }))

          const publicUrl = b2PublicUrl(key, config)
          if (!publicUrl) {
            console.log(JSON.stringify({ label: 'public-get', status: null, ok: false, errorCode: 'NO_PUBLIC_URL' }))
          } else {
            const url = new URL(publicUrl)
            url.searchParams.set('_puddle_read', String(Date.now()))
            await summarize('public-get', await fetch(url, {
              method: 'GET', headers: { 'cache-control': 'no-cache' }, cache: 'no-store', redirect: 'follow', signal: timeout()
            }))
          }
          NODE
