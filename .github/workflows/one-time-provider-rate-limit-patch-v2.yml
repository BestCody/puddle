name: One-time provider rate-limit patch v2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/harden-photo-downloads
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Patch provider-specific rate controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          # --- Materializer: high global parallelism + provider-specific external limits. ---
          path = Path('scripts/global-data/materialize_photo_candidates.py')
          text = path.read_text()
          if 'import threading\n' not in text:
              text = text.replace('import os\nimport time\n', 'import os\nimport threading\nimport time\n', 1)

          marker = "PROVIDER_CODES = {'wikimedia-commons': 1, 'mapillary': 2, 'kartaview': 3}\n"
          constants = dedent('''\
          PROVIDER_CODES = {'wikimedia-commons': 1, 'mapillary': 2, 'kartaview': 3}
          TRANSIENT_HTTP_CODES = {408, 425, 429, 500, 502, 503, 504}
          WIKIMEDIA_DOWNLOAD_CONCURRENCY = max(1, min(2, int(os.getenv('GLOBAL_PHOTO_WIKIMEDIA_DOWNLOAD_CONCURRENCY', '2'))))
          WIKIMEDIA_DOWNLOAD_MBIT = max(1.0, min(25.0, float(os.getenv('GLOBAL_PHOTO_WIKIMEDIA_DOWNLOAD_MBIT', '25'))))
          WIKIMEDIA_DOWNLOAD_BYTES_PER_SECOND = WIKIMEDIA_DOWNLOAD_MBIT * 1_000_000 / 8.0
          WIKIMEDIA_DOWNLOAD_GATE = threading.BoundedSemaphore(WIKIMEDIA_DOWNLOAD_CONCURRENCY)
          WIKIMEDIA_BANDWIDTH_LOCK = threading.Lock()
          WIKIMEDIA_BANDWIDTH_NEXT_AT = 0.0
          MAPILLARY_GRAPH_REQUESTS_PER_MINUTE = max(1, min(50_000, int(os.getenv('MAPILLARY_GRAPH_REQUESTS_PER_MINUTE', '50000'))))
          MAPILLARY_GRAPH_START_INTERVAL = 60.0 / MAPILLARY_GRAPH_REQUESTS_PER_MINUTE
          MAPILLARY_GRAPH_LOCK = threading.Lock()
          MAPILLARY_GRAPH_NEXT_AT = 0.0
          ''')
          if 'WIKIMEDIA_DOWNLOAD_CONCURRENCY =' not in text:
              if marker not in text:
                  raise SystemExit('provider constant anchor not found')
              text = text.replace(marker, constants, 1)

          helper_anchor = 'def mapillary_details(image_id):\n'
          helpers = dedent('''\
          def wait_mapillary_graph_start():
              global MAPILLARY_GRAPH_NEXT_AT
              with MAPILLARY_GRAPH_LOCK:
                  now = time.monotonic()
                  start = max(now, MAPILLARY_GRAPH_NEXT_AT)
                  MAPILLARY_GRAPH_NEXT_AT = start + MAPILLARY_GRAPH_START_INTERVAL
              if start > now:
                  time.sleep(start - now)


          def reserve_wikimedia_bandwidth(byte_count):
              global WIKIMEDIA_BANDWIDTH_NEXT_AT
              duration = max(0, int(byte_count)) / WIKIMEDIA_DOWNLOAD_BYTES_PER_SECOND
              with WIKIMEDIA_BANDWIDTH_LOCK:
                  now = time.monotonic()
                  start = max(now, WIKIMEDIA_BANDWIDTH_NEXT_AT)
                  WIKIMEDIA_BANDWIDTH_NEXT_AT = start + duration
              if start > now:
                  time.sleep(start - now)


          ''')
          if 'def wait_mapillary_graph_start():' not in text:
              if helper_anchor not in text:
                  raise SystemExit('mapillary helper anchor not found')
              text = text.replace(helper_anchor, helpers + helper_anchor, 1)

          old_mapillary = """    fields = 'id,thumb_2048_url,width,height,creator,quality_score'\n    url = f'https://graph.mapillary.com/{urllib.parse.quote(str(image_id))}?' + urllib.parse.urlencode({'fields': fields, 'access_token': MAPILLARY_TOKEN})\n    for attempt in range(6):\n        try:\n            with urllib.request.urlopen(urllib.request.Request(url, headers={'Accept': 'application/json', 'User-Agent': 'Puddle/1.0 global photo materializer'}), timeout=20) as response:\n"""
          new_mapillary = """    fields = 'id,thumb_2048_url,width,height,creator,quality_score'\n    url = f'https://graph.mapillary.com/{urllib.parse.quote(str(image_id))}?' + urllib.parse.urlencode({'fields': fields})\n    for attempt in range(6):\n        wait_mapillary_graph_start()\n        try:\n            request = urllib.request.Request(url, headers={\n                'Accept': 'application/json',\n                'Authorization': f'OAuth {MAPILLARY_TOKEN}',\n                'User-Agent': 'Puddle/1.0 global photo materializer (https://puddle.you/)',\n            })\n            with urllib.request.urlopen(request, timeout=20) as response:\n"""
          if old_mapillary in text:
              text = text.replace(old_mapillary, new_mapillary, 1)
          elif "'Authorization': f'OAuth {MAPILLARY_TOKEN}'" not in text:
              raise SystemExit('mapillary details anchor not found')

          start = text.index('def download(url, provider):')
          end = text.index('\n\ndef dhash(image):', start)
          new_download = dedent('''\
          def download(url, provider):
              current = str(url or '')
              redirects = 0
              for attempt in range(6):
                  parsed = urllib.parse.urlparse(current)
                  if parsed.scheme != 'https' or not approved_host(provider, parsed.hostname or ''):
                      raise RuntimeError(f'unapproved {provider} asset host')
                  request = urllib.request.Request(current, headers={
                      'Accept': 'image/avif,image/webp,image/png,image/jpeg',
                      'User-Agent': 'Puddle/1.0 licensed photo materializer (https://puddle.you/)',
                  })
                  gate = WIKIMEDIA_DOWNLOAD_GATE if provider == 'wikimedia-commons' else None
                  if gate:
                      gate.acquire()
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          content_type = (response.headers.get_content_type() or '').lower()
                          declared = int(response.headers.get('Content-Length') or 0)
                          if declared > MAX_BYTES:
                              raise RuntimeError('image exceeds 10 MB')
                          if provider == 'wikimedia-commons':
                              chunks = []
                              total = 0
                              while total <= MAX_BYTES:
                                  chunk_size = min(64 * 1024, MAX_BYTES + 1 - total)
                                  if chunk_size <= 0:
                                      break
                                  reserve_wikimedia_bandwidth(chunk_size)
                                  chunk = response.read(chunk_size)
                                  if not chunk:
                                      break
                                  chunks.append(chunk)
                                  total += len(chunk)
                              body = b''.join(chunks)
                          else:
                              body = response.read(MAX_BYTES + 1)
                          if not body or len(body) > MAX_BYTES:
                              raise RuntimeError('image is empty or exceeds 10 MB')
                          if content_type not in {'image/jpeg', 'image/png', 'image/webp', 'image/avif', 'application/octet-stream'}:
                              raise RuntimeError(f'unsupported image type {content_type}')
                          return body
                  except urllib.error.HTTPError as error:
                      if error.code in {301, 302, 303, 307, 308} and error.headers.get('Location'):
                          redirects += 1
                          if redirects > 3:
                              raise RuntimeError('too many image redirects') from error
                          current = urllib.parse.urljoin(current, error.headers['Location'])
                          continue
                      if error.code in TRANSIENT_HTTP_CODES and attempt < 5:
                          retry_after = error.headers.get('Retry-After')
                          try:
                              delay = float(retry_after) if retry_after else 0.0
                          except ValueError:
                              delay = 0.0
                          if delay <= 0:
                              delay = min(30.0, 0.5 * (2 ** attempt))
                          time.sleep(min(60.0, delay))
                          continue
                      raise
                  finally:
                      if gate:
                          gate.release()
              raise RuntimeError(f'{provider} image download exhausted retries')
          ''')
          text = text[:start] + new_download.rstrip() + text[end:]
          path.write_text(text)

          # --- Wikimedia discovery: guaranteed 200/min tier, auth-aware concurrency, current standard thumbnails. ---
          path = Path('scripts/global-data/build_wikimedia_candidates.py')
          text = path.read_text()
          if 'import gzip\n' not in text:
              text = text.replace('import concurrent.futures\n', 'import concurrent.futures\nimport gzip\n', 1)
          old = """REQUESTS_PER_MINUTE = max(1, min(2000, int(os.getenv('WIKIMEDIA_REQUESTS_PER_MINUTE', '200'))))\nMIN_INTERVAL = 60.0 / REQUESTS_PER_MINUTE\nCONCURRENCY = max(1, min(3, int(os.getenv('WIKIMEDIA_MAX_CONCURRENCY', '3'))))\nACCESS_TOKEN = os.getenv('WIKIMEDIA_ACCESS_TOKEN', '').strip()\n"""
          new = """ACCESS_TOKEN = os.getenv('WIKIMEDIA_ACCESS_TOKEN', '').strip()\n# Use the guaranteed identified/new-authenticated tier until account privileges are explicitly verified higher.\nREQUESTS_PER_MINUTE = max(1, min(200, int(os.getenv('WIKIMEDIA_REQUESTS_PER_MINUTE', '200'))))\nMIN_INTERVAL = 60.0 / REQUESTS_PER_MINUTE\n# Action API robot policy: concurrency 1 unauthenticated, up to 3 authenticated.\nCONCURRENCY = max(1, min(3 if ACCESS_TOKEN else 1, int(os.getenv('WIKIMEDIA_MAX_CONCURRENCY', '3'))))\n"""
          if old in text:
              text = text.replace(old, new, 1)
          elif "min(200, int(os.getenv('WIKIMEDIA_REQUESTS_PER_MINUTE'" not in text:
              raise SystemExit('wikimedia rate block anchor not found')
          text = text.replace("'iiurlwidth': '1800',", "'iiurlwidth': '1920',", 1)
          text = text.replace("headers = {'Accept': 'application/json', 'User-Agent': USER_AGENT}", "headers = {'Accept': 'application/json', 'Accept-Encoding': 'gzip', 'User-Agent': USER_AGENT}", 1)
          old_open = """        try:\n            with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=25) as response:\n                return json.load(response), None\n"""
          new_open = """        try:\n            started = time.monotonic()\n            with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=25) as response:\n                raw = response.read()\n                if (response.headers.get('Content-Encoding') or '').lower() == 'gzip':\n                    raw = gzip.decompress(raw)\n                payload = json.loads(raw)\n            if time.monotonic() - started > 1.0:\n                gate.defer(5.0)\n            return payload, None\n"""
          if old_open in text:
              text = text.replace(old_open, new_open, 1)
          elif "'Accept-Encoding': 'gzip'" not in text:
              raise SystemExit('wikimedia request anchor not found')
          path.write_text(text)

          # --- Workflows: do not globally throttle all providers because Wikimedia has a narrow media limit. ---
          path = Path('.github/workflows/global-photo-enrichment.yml')
          text = path.read_text()
          old = """          # The materializer is network-bound; 192 concurrent image downloads caused\n          # Wikimedia 429s during the live production proof. Keep the provider burst\n          # bounded rather than trading useful throughput for throttled requests.\n          GLOBAL_PHOTO_DOWNLOAD_CONCURRENCY: '16'\n"""
          new = """          # High overall parallelism; published provider limits are enforced independently in the materializer.\n          GLOBAL_PHOTO_DOWNLOAD_CONCURRENCY: '192'\n          # Wikimedia media policy: total concurrency <=2 and aggregate download speed <=25 Mbps.\n          GLOBAL_PHOTO_WIKIMEDIA_DOWNLOAD_CONCURRENCY: '2'\n          GLOBAL_PHOTO_WIKIMEDIA_DOWNLOAD_MBIT: '25'\n          # Mapillary Graph API ceiling; direct CDN limits are not publicly specified, so 429/Retry-After controls downloads.\n          MAPILLARY_GRAPH_REQUESTS_PER_MINUTE: '50000'\n"""
          if old not in text:
              raise SystemExit('global photo workflow anchor not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('.github/workflows/global-wikimedia-enrichment.yml')
          lines = path.read_text().splitlines()
          out = []
          replaced = False
          for line in lines:
              if line.strip().startswith('WIKIMEDIA_REQUESTS_PER_MINUTE:'):
                  out.append("          # Guaranteed identified/new-authenticated tier; raise only after account privilege verification.")
                  out.append("          WIKIMEDIA_REQUESTS_PER_MINUTE: '200'")
                  replaced = True
              else:
                  out.append(line)
          if not replaced:
              raise SystemExit('wikimedia workflow request-rate line not found')
          path.write_text('\n'.join(out) + '\n')

          # Mapillary tiles: every run may reserve the full remaining daily budget; B2 ledger prevents >50k/day.
          path = Path('.github/workflows/global-mapillary-enrichment.yml')
          text = path.read_text()
          text = text.replace("        default: '12500'", "        default: '50000'", 1)
          old_line = "          --request-limit='${{ github.event_name == 'workflow_dispatch' && inputs.request_limit || '12500' }}'"
          # Avoid embedding a GitHub expression in replacement matching: replace by its unique suffix.
          for line in text.splitlines():
              if '--request-limit=' in line and "inputs.request_limit" in line:
                  text = text.replace(line, line.replace("'12500'", "'50000'"), 1)
                  break
          path.write_text(text)

          # --- Regression tests lock all three provider contracts into CI. ---
          path = Path('tests/integration/photo-enrichment-runner.test.mjs')
          tests = path.read_text()
          if "provider rate limits match upstream contracts" not in tests:
              tests += dedent('''\

              test('provider rate limits match upstream contracts', async () => {
                const materializeWorkflow = await read('.github/workflows/global-photo-enrichment.yml')
                const materializer = await read('scripts/global-data/materialize_photo_candidates.py')
                const wikimediaWorkflow = await read('.github/workflows/global-wikimedia-enrichment.yml')
                const wikimedia = await read('scripts/global-data/build_wikimedia_candidates.py')
                const mapillaryWorkflow = await read('.github/workflows/global-mapillary-enrichment.yml')
                const mapillary = await read('scripts/global-data/build_mapillary_candidates.py')
                const kartaWorkflow = await read('.github/workflows/global-kartaview-enrichment.yml')
                const karta = await read('scripts/global-data/build_kartaview_candidates.py')

                assert.match(materializeWorkflow, /GLOBAL_PHOTO_DOWNLOAD_CONCURRENCY: '192'/)
                assert.match(materializeWorkflow, /GLOBAL_PHOTO_WIKIMEDIA_DOWNLOAD_CONCURRENCY: '2'/)
                assert.match(materializeWorkflow, /GLOBAL_PHOTO_WIKIMEDIA_DOWNLOAD_MBIT: '25'/)
                assert.match(materializeWorkflow, /MAPILLARY_GRAPH_REQUESTS_PER_MINUTE: '50000'/)
                assert.match(materializer, /WIKIMEDIA_DOWNLOAD_CONCURRENCY/)
                assert.match(materializer, /WIKIMEDIA_DOWNLOAD_MBIT/)
                assert.match(materializer, /MAPILLARY_GRAPH_REQUESTS_PER_MINUTE/)
                assert.match(materializer, /Authorization': f'OAuth/)
                assert.match(materializer, /Retry-After/)

                assert.match(wikimediaWorkflow, /WIKIMEDIA_REQUESTS_PER_MINUTE: '200'/)
                assert.match(wikimedia, /min\(200, int\(os\.getenv\('WIKIMEDIA_REQUESTS_PER_MINUTE'/)
                assert.match(wikimedia, /3 if ACCESS_TOKEN else 1/)
                assert.match(wikimedia, /'iiurlwidth': '1920'/)
                assert.match(wikimedia, /'Accept-Encoding': 'gzip'/)
                assert.match(wikimedia, /gate\.defer\(5\.0\)/)

                assert.match(mapillaryWorkflow, /default: '50000'/)
                assert.match(mapillaryWorkflow, /MAPILLARY_TILE_DAILY_LIMIT: '50000'/)
                assert.match(mapillary, /DAILY_REQUEST_LIMIT = max\(1, min\(50_000/)
                assert.match(mapillary, /reserve_daily_budget/)
                assert.match(mapillary, /release_unused_budget/)

                assert.match(kartaWorkflow, /default: '1000'/)
                assert.match(kartaWorkflow, /KARTAVIEW_REQUESTS_PER_HOUR: .*'1000'/)
                assert.match(karta, /PROVIDER_HOURLY_MAX = 1000 if TOKEN else 100/)
                assert.match(karta, /START_INTERVAL = 3600\.0 \/ REQUESTS_PER_HOUR/)
                assert.match(karta, /Retry-After/)
              })
              ''')
          path.write_text(tests)
          PY
      - name: Validate patched provider controls
        run: |
          python -m py_compile scripts/global-data/materialize_photo_candidates.py scripts/global-data/build_wikimedia_candidates.py scripts/global-data/build_mapillary_candidates.py scripts/global-data/build_kartaview_candidates.py
          node --test tests/integration/photo-enrichment-runner.test.mjs
      - name: Commit provider controls
        run: |
          git config user.name 'puddle-maintenance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/global-data/materialize_photo_candidates.py scripts/global-data/build_wikimedia_candidates.py .github/workflows/global-photo-enrichment.yml .github/workflows/global-wikimedia-enrichment.yml .github/workflows/global-mapillary-enrichment.yml tests/integration/photo-enrichment-runner.test.mjs
          git commit -m 'Enforce provider-specific photo rate limits'
          git push origin HEAD:agent/harden-photo-downloads
