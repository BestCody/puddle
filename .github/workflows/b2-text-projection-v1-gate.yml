name: Build and gate B2 text projection v1

on:
  push:
    branches: [main]
    paths:
      - 'lib/app/b2-location-search.js'
      - 'lib/app/b2-text-search-projection.js'
      - 'lib/app/location-search-ranking.js'
      - 'scripts/global-data/build_b2_text_search_projection.py'
      - 'tests/unit/b2-location-search.test.mjs'
      - 'app/api/internal/b2-production-selftest/route.js'
      - '.github/workflows/b2-text-projection-v1-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: b2-text-projection-v1-production-candidate
  cancel-in-progress: false

jobs:
  build-and-parity-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: '1'
      B2_DATA_APPLICATION_KEY_ID: ${{ secrets.B2_DATA_APPLICATION_KEY_ID }}
      B2_DATA_APPLICATION_KEY: ${{ secrets.B2_DATA_APPLICATION_KEY }}
      B2_DATA_BUCKET_NAME: ${{ vars.B2_DATA_BUCKET_NAME }}
      B2_DATA_S3_ENDPOINT: ${{ secrets.B2_DATA_S3_ENDPOINT }}
      B2_DATA_S3_REGION: ${{ vars.B2_DATA_S3_REGION }}
      B2_DATA_PREFIX: data
      GLOBAL_LOCATION_SEARCH_INDEX: locations-active
      GLOBAL_LOCATION_MAX_RADIUS_KM: '100'
      GLOBAL_LOCATION_MAX_DIRECTORY_TILES: '64'
      GLOBAL_LOCATION_MAX_SHARDS: '128'
      GLOBAL_LOCATION_MAX_OBJECT_BYTES: '16777216'
      GLOBAL_LOCATION_MAX_DECODED_OBJECT_BYTES: '67108864'
      GLOBAL_LOCATION_MAX_COMPRESSED_BYTES: '16777216'
      GLOBAL_LOCATION_MAX_CANDIDATES: '150000'
      GLOBAL_LOCATION_FETCH_CONCURRENCY: '16'
      GLOBAL_LOCATION_SEARCH_TIMEOUT_MS: '12000'
      GLOBAL_LOCATION_PLANNER_WORKERS: '16'
      GLOBAL_LOCATION_TEXT_DETAIL_CHUNK_SIZE: '512'

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install projection dependencies
        run: python -m pip install --disable-pip-version-check boto3 brotli orjson zstandard

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - id: active
        name: Resolve active packed B2 planner
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          import boto3
          from botocore.client import Config

          client = boto3.client(
              's3',
              endpoint_url=os.environ['B2_DATA_S3_ENDPOINT'],
              aws_access_key_id=os.environ['B2_DATA_APPLICATION_KEY_ID'],
              aws_secret_access_key=os.environ['B2_DATA_APPLICATION_KEY'],
              region_name=os.environ['B2_DATA_S3_REGION'],
              config=Config(retries={'max_attempts': 10, 'mode': 'adaptive'}),
          )
          bucket = os.environ['B2_DATA_BUCKET_NAME']
          active_key = f"{os.environ['B2_DATA_PREFIX'].strip('/')}/search/active.json"
          active = json.loads(client.get_object(Bucket=bucket, Key=active_key)['Body'].read())
          manifest_key = str(active.get('manifest_key') or '').strip()
          if not manifest_key:
              raise SystemExit('Active B2 search pointer has no manifest_key.')
          manifest = json.loads(client.get_object(Bucket=bucket, Key=manifest_key)['Body'].read())
          planner_id = str((manifest.get('planner') or {}).get('id') or '').strip()
          prefix = str(manifest.get('prefix') or '').strip().rstrip('/')
          if not planner_id or not prefix:
              raise SystemExit('Active B2 manifest is not a packed planner manifest.')
          print(f'manifest_key={manifest_key}')
          print(f'planner_id={planner_id}')
          print(f'prefix={prefix}')
          PY

      - name: Build or reuse compact text projection candidate
        shell: bash
        run: |
          set -o pipefail
          logfile="$(mktemp)"
          set +e
          python scripts/global-data/build_b2_text_search_projection.py \
            --manifest-key='${{ steps.active.outputs.manifest_key }}' \
            --planner-id='${{ steps.active.outputs.planner_id }}' \
            --workers="$GLOBAL_LOCATION_PLANNER_WORKERS" \
            --detail-chunk-size="$GLOBAL_LOCATION_TEXT_DETAIL_CHUNK_SIZE" 2>&1 | tee "$logfile"
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::error::projection builder failed exit=$code; last output lines follow"
            tail -n 6 "$logfile" | cut -c1-240 | while IFS= read -r line; do echo "::error::$line"; done
            exit "$code"
          fi