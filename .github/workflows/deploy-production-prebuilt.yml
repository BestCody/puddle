name: Deploy production prebuilt

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-production-prebuilt.yml'
      - '.github/trigger-deploy-production-prebuilt'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: deploy-production-prebuilt
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_aY04PVtKs2MUrxR38csNwmUc
      VERCEL_PROJECT_ID: prj_7By05EO9g3fqAJkubBtaeYelvwEQ
      VERCEL_SCOPE: bestcodys-projects
      NEXT_TELEMETRY_DISABLED: 1
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish deploy pending status
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=pending \
            -f context='Prebuilt production deploy' \
            -f description='Checking CI deploy credentials and building production artifact' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Verify deployment credential exists
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo 'VERCEL_TOKEN is not configured in GitHub Actions secrets.' >&2
            exit 2
          fi

      - name: Check out production main
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Vercel CLI
        run: npm install --global vercel@59.1.4

      - name: Verify Vercel account and team access
        shell: bash
        run: |
          set -euo pipefail
          vercel whoami --token="$VERCEL_TOKEN"
          vercel teams list --token="$VERCEL_TOKEN"

      - name: Pull production project configuration
        run: vercel pull --yes --environment=production --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Build production artifact on GitHub
        run: vercel build --prod --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN"

      - name: Upload prebuilt artifact to production
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --prod --yes --scope="$VERCEL_SCOPE" --token="$VERCEL_TOKEN")"
          echo "Production deployment submitted: ${deployment_url}"

      - name: Publish deploy success status
        if: success()
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=success \
            -f context='Prebuilt production deploy' \
            -f description='Production artifact built in GitHub and uploaded to Vercel' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Publish deploy failure status
        if: failure()
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state=failure \
            -f context='Prebuilt production deploy' \
            -f description='Prebuilt deploy failed; inspect the linked Actions run' \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
