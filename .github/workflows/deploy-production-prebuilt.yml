name: Deploy production prebuilt

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-production-prebuilt.yml'
      - '.github/trigger-deploy-production-prebuilt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production-prebuilt
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_aY04PVtKs2MUrxR38csNwmUc
      VERCEL_PROJECT_ID: prj_7By05EO9g3fqAJkubBtaeYelvwEQ
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Verify deployment credential exists
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_TOKEN:-}" ]]; then
            echo 'VERCEL_TOKEN is not configured in GitHub Actions secrets.' >&2
            exit 2
          fi

      - name: Check out production main
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull production project configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build production artifact on GitHub
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Upload prebuilt artifact to production
        shell: bash
        run: |
          set -euo pipefail
          deployment_url="$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "Production deployment submitted: ${deployment_url}"
