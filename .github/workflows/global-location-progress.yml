name: Global location build progress

on:
  push:
    branches: [main]
    paths:
      - '.github/trigger-global-location-progress'

permissions:
  contents: read

jobs:
  progress:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      B2_DATA_APPLICATION_KEY_ID: ${{ secrets.B2_DATA_APPLICATION_KEY_ID || secrets.B2_KEY_ID }}
      B2_DATA_APPLICATION_KEY: ${{ secrets.B2_DATA_APPLICATION_KEY || secrets.B2_APPLICATION_KEY }}
      B2_DATA_BUCKET_NAME: ${{ vars.B2_DATA_BUCKET_NAME || secrets.B2_BUCKET || 'puddle-assets' }}
      B2_DATA_S3_ENDPOINT: ${{ secrets.B2_DATA_S3_ENDPOINT || secrets.B2_S3_ENDPOINT }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check boto3
      - name: Count resolved country partitions
        shell: python
        run: |
          import os, re, boto3
          s3=boto3.client('s3', endpoint_url=os.environ['B2_DATA_S3_ENDPOINT'], aws_access_key_id=os.environ['B2_DATA_APPLICATION_KEY_ID'], aws_secret_access_key=os.environ['B2_DATA_APPLICATION_KEY'])
          bucket=os.environ['B2_DATA_BUCKET_NAME']
          prefix='data/normalized/schema=v1/snapshot=2026-08-17/'
          paginator=s3.get_paginator('list_objects_v2')
          locations=[]; crosswalk=[]; aliases=[]
          for page in paginator.paginate(Bucket=bucket, Prefix=prefix):
            for row in page.get('Contents',[]):
              key=row['Key']
              m=re.search(r'/country_code=([^/]+)/([^/]+)$', key)
              if not m: continue
              country,name=m.groups()
              if name=='locations.parquet': locations.append(country)
              elif name=='source_crosswalk.parquet': crosswalk.append(country)
              elif name=='location_aliases.parquet': aliases.append(country)
          complete=sorted(set(locations)&set(crosswalk)&set(aliases))
          print(f'locations_files={len(set(locations))}')
          print(f'crosswalk_files={len(set(crosswalk))}')
          print(f'alias_files={len(set(aliases))}')
          print(f'complete_country_partitions={len(complete)}')
          print('last_complete=' + ','.join(complete[-20:]))
