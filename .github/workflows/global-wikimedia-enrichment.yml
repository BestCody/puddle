name: Saturate Wikimedia photo discovery

on:
  workflow_dispatch:
    inputs:
      countries:
        description: Comma-separated country codes; empty continues the global cursor
        required: false
        default: ''
        type: string
      request_limit:
        description: Optional request cap for this run; empty derives the safe maximum from requests/minute
        required: false
        default: ''
        type: string
  schedule:
    - cron: '3 */6 * * *'

permissions:
  contents: read

concurrency:
  group: global-wikimedia-photo-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    if: github.event_name == 'workflow_dispatch' || vars.GLOBAL_PHOTO_PIPELINE_ENABLED == 'true'
    runs-on: ${{ vars.GLOBAL_DATA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 360
    env:
      B2_DATA_APPLICATION_KEY_ID: ${{ secrets.B2_DATA_APPLICATION_KEY_ID || secrets.B2_KEY_ID }}
      B2_DATA_APPLICATION_KEY: ${{ secrets.B2_DATA_APPLICATION_KEY || secrets.B2_APPLICATION_KEY }}
      B2_DATA_BUCKET_NAME: ${{ vars.B2_DATA_BUCKET_NAME || secrets.B2_BUCKET || 'puddle-assets' }}
      B2_DATA_S3_ENDPOINT: ${{ secrets.B2_DATA_S3_ENDPOINT || secrets.B2_S3_ENDPOINT }}
      B2_DATA_S3_REGION: ${{ vars.B2_DATA_S3_REGION || secrets.B2_REGION || 'us-east-005' }}
      B2_DATA_PREFIX: data
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check duckdb boto3 numpy
      - id: active
        run: python scripts/global-data/active_snapshot.py
      - name: Spend the Wikimedia request entitlement on new geographic cells
        shell: bash
        run: |
          args=(--snapshot='${{ steps.active.outputs.snapshot }}' --countries='${{ github.event_name == 'workflow_dispatch' && inputs.countries || vars.GLOBAL_PHOTO_COUNTRIES }}')
          if [[ -n "${{ github.event_name == 'workflow_dispatch' && inputs.request_limit || '' }}" ]]; then
            args+=(--request-limit='${{ inputs.request_limit }}')
          fi
          python scripts/global-data/build_wikimedia_candidates.py "${args[@]}"
        env:
          WIKIMEDIA_ACCESS_TOKEN: ${{ secrets.WIKIMEDIA_ACCESS_TOKEN }}
          # This repository currently has no Wikimedia token, so the compliant User-Agent tier is 200 requests/minute.
          WIKIMEDIA_REQUESTS_PER_MINUTE: '200'
          # The worker clamps this to 1 when no access token is present, matching the Action API robot policy.
          WIKIMEDIA_MAX_CONCURRENCY: '3'
          WIKIMEDIA_RESCAN_DAYS: ${{ vars.WIKIMEDIA_RESCAN_DAYS || '30' }}
          OPEN_PHOTO_MAX_CANDIDATES_PER_PROVIDER: '3'
