name: Validate open photo B2 migration

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/trigger-validate-open-photo-b2'

permissions:
  contents: read

concurrency:
  group: validate-open-photo-b2
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Validate database mappings, B2 delivery, hashes, and bytes
        run: node scripts/validate-open-photo-b2-migration.mjs
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          OPEN_PHOTO_SUPABASE_BUCKET: puddle-public-media
          B2_MEDIA_VALIDATION_CONCURRENCY: ${{ vars.B2_MEDIA_VALIDATION_CONCURRENCY || '16' }}
