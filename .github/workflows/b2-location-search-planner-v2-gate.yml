name: Build and gate B2 location planner v2

on:
  push:
    branches: [main]
    paths:
      - '.github/b2-location-search-planner-v2-trigger'
      - '.github/workflows/b2-location-search-planner-v2-gate.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: b2-location-search-planner-v2-production
  cancel-in-progress: false

jobs:
  build-validate-parity-activate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: '1'
      B2_DATA_APPLICATION_KEY_ID: ${{ secrets.B2_DATA_APPLICATION_KEY_ID || secrets.B2_KEY_ID }}
      B2_DATA_APPLICATION_KEY: ${{ secrets.B2_DATA_APPLICATION_KEY || secrets.B2_APPLICATION_KEY }}
      B2_DATA_BUCKET_NAME: ${{ vars.B2_DATA_BUCKET_NAME || secrets.B2_BUCKET || 'puddle-assets' }}
      B2_DATA_S3_ENDPOINT: ${{ secrets.B2_DATA_S3_ENDPOINT || secrets.B2_S3_ENDPOINT }}
      B2_DATA_S3_REGION: ${{ vars.B2_DATA_S3_REGION || secrets.B2_REGION || 'us-east-005' }}
      B2_DATA_PREFIX: data
      GLOBAL_LOCATION_SEARCH_URL: ${{ secrets.OPENSEARCH_URL }}
      GLOBAL_LOCATION_SEARCH_INDEX: locations-active
      OPENSEARCH_USERNAME: ${{ secrets.OPENSEARCH_USERNAME }}
      OPENSEARCH_PASSWORD: ${{ secrets.OPENSEARCH_PASSWORD }}
      OPENSEARCH_BEARER_TOKEN: ${{ secrets.OPENSEARCH_BEARER_TOKEN }}
      GLOBAL_LOCATION_MAX_RADIUS_KM: '100'
      GLOBAL_LOCATION_MAX_DIRECTORY_TILES: '64'
      GLOBAL_LOCATION_MAX_SHARDS: '128'
      GLOBAL_LOCATION_MAX_OBJECT_BYTES: '16777216'
      GLOBAL_LOCATION_MAX_DECODED_OBJECT_BYTES: '67108864'
      GLOBAL_LOCATION_MAX_COMPRESSED_BYTES: '16777216'
      GLOBAL_LOCATION_MAX_CANDIDATES: '150000'
      GLOBAL_LOCATION_FETCH_CONCURRENCY: '16'
      GLOBAL_LOCATION_SEARCH_TIMEOUT_MS: '12000'
      GLOBAL_LOCATION_PLANNER_ID: v2-c16000-b2097152
      GLOBAL_LOCATION_PLANNER_TARGET_CANDIDATES: '16000'
      GLOBAL_LOCATION_PLANNER_TARGET_BYTES: '2097152'
      GLOBAL_LOCATION_PLANNER_WORKERS: '16'

    steps:
      - name: Publish planner migration pending status
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}"
          body = json.dumps({
              'state': 'pending',
              'context': 'B2 planner v2 migration gate',
              'description': 'Building and validating bounded B2 query planner',
              'target_url': os.environ['STATUS_URL'],
          }).encode()
          request = urllib.request.Request(url, data=body, method='POST', headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              print(response.status)
          PY

      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install planner dependencies
        run: python -m pip install --disable-pip-version-check boto3 'h3>=4,<5' brotli orjson

      - name: Install application dependencies
        run: npm ci --no-audit --no-fund

      - id: snapshot
        name: Resolve newest completed canonical snapshot with base B2 candidate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re
          import boto3
          from botocore.client import Config

          bucket = os.environ['B2_DATA_BUCKET_NAME']
          endpoint = os.environ['B2_DATA_S3_ENDPOINT']
          region = os.environ.get('B2_DATA_S3_REGION') or 'us-east-005'
          key_id = os.environ['B2_DATA_APPLICATION_KEY_ID']
          key = os.environ['B2_DATA_APPLICATION_KEY']
          data_prefix = os.environ.get('B2_DATA_PREFIX', 'data').strip('/')
          normalized_prefix = f'{data_prefix}/normalized/schema=v1/snapshot='
          client = boto3.client(
              's3', endpoint_url=endpoint, aws_access_key_id=key_id,
              aws_secret_access_key=key, region_name=region,
              config=Config(retries={'max_attempts': 10, 'mode': 'adaptive'}),
          )

          candidates = set()
          paginator = client.get_paginator('list_objects_v2')
          for page in paginator.paginate(Bucket=bucket, Prefix=normalized_prefix, Delimiter='/'):
              for item in page.get('CommonPrefixes', []):
                  match = re.search(r'/snapshot=(\d{4}-\d{2}-\d{2})/$', item.get('Prefix', ''))
                  if match:
                      candidates.add(match.group(1))

          selected = None
          for snapshot in sorted(candidates, reverse=True):
              required = [
                  f'{data_prefix}/normalized/schema=v1/snapshot={snapshot}/manifest.json',
                  f'{data_prefix}/search/schema=v1/snapshot={snapshot}/manifest.json',
                  f'{data_prefix}/search/candidates/{snapshot}.json',
              ]
              try:
                  for object_key in required:
                      client.head_object(Bucket=bucket, Key=object_key)
              except Exception:
                  continue
              selected = snapshot
              break

          if not selected:
              raise SystemExit('No completed normalized snapshot with a completed base B2 search candidate was found.')
          print(f'snapshot={selected}')
          PY

      - name: Build or reuse tight-bounds microshard planner overlay
        shell: bash
        run: |
          set -euo pipefail
          python scripts/global-data/build_b2_search_planner_overlay.py \
            --snapshot='${{ steps.snapshot.outputs.snapshot }}' \
            --target-candidates="$GLOBAL_LOCATION_PLANNER_TARGET_CANDIDATES" \
            --target-compressed-bytes="$GLOBAL_LOCATION_PLANNER_TARGET_BYTES" \
            --workers="$GLOBAL_LOCATION_PLANNER_WORKERS"

      - name: Validate planner overlay artifacts and routing
        run: >-
          python scripts/global-data/validate_b2_search_planner_overlay.py
          --snapshot='${{ steps.snapshot.outputs.snapshot }}'
          --planner-id="$GLOBAL_LOCATION_PLANNER_ID"

      - name: Compare planner candidate against live OpenSearch before activation
        env:
          GLOBAL_LOCATION_SEARCH_MANIFEST_KEY: data/search/candidates/${{ steps.snapshot.outputs.snapshot }}-v2-c16000-b2097152.json
        run: node scripts/global-data/compare_location_search_backends.mjs

      - name: Atomically activate only the validated parity-passing planner
        run: >-
          python scripts/global-data/validate_b2_search_planner_overlay.py
          --snapshot='${{ steps.snapshot.outputs.snapshot }}'
          --planner-id="$GLOBAL_LOCATION_PLANNER_ID"
          --activate

      - name: Smoke active B2 planner against live OpenSearch
        env:
          GLOBAL_LOCATION_SEARCH_MANIFEST_KEY: data/search/active.json
        run: node scripts/global-data/compare_location_search_backends.mjs

      - name: Publish planner migration final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS_STATE: ${{ job.status == 'success' && 'success' || 'failure' }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          state = os.environ['STATUS_STATE']
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}"
          body = json.dumps({
              'state': state,
              'context': 'B2 planner v2 migration gate',
              'description': 'B2 bounded planner gate passed' if state == 'success' else 'B2 bounded planner gate failed',
              'target_url': os.environ['STATUS_URL'],
          }).encode()
          request = urllib.request.Request(url, data=body, method='POST', headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              print(response.status)
          PY