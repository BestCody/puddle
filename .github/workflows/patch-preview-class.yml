name: Patch preview class

on:
  push:
    branches:
      - feat/figma-landing-v2-swipe-motion
    paths:
      - .github/workflows/patch-preview-class.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/figma-landing-v2-swipe-motion
      - name: Separate preview from active swipe-card selector
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('components/minimal-swipe-card.js')
          text = path.read_text()
          old = 'className="minimal-swipe-card minimal-swipe-card-preview"'
          new = 'className="minimal-swipe-card-preview"'
          if text.count(old) != 1:
              raise SystemExit(f'expected one preview class anchor, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add components/minimal-swipe-card.js
          git commit -m "Separate preview from active swipe card selector"
          git push origin HEAD:feat/figma-landing-v2-swipe-motion
