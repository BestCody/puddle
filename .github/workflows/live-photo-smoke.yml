name: Live photo smoke

on:
  push:
    branches:
      - debug/live-photo-smoke

permissions:
  contents: read

jobs:
  live-photo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LIVE_BASE_URL: https://puddle.you
      PRODUCTION_ACCEPTANCE_COMMIT: 4ecc2faeb17be9405d979decfcdfb8a585e28d7a
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install Playwright smoke dependencies
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run production photo smoke
        run: node tests/live-photo-smoke.mjs
      - name: Upload live photo diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: live-photo-diagnostics
          path: test-results
          if-no-files-found: error
          retention-days: 7