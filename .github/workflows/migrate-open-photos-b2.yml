name: Migrate open photos to B2

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Maximum Supabase-backed approved photos to migrate
        required: false
        default: '100000'
        type: string
      delete_source:
        description: Dangerous cleanup opt-in; leave false during initial migration and validation
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: migrate-open-photos-b2
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Copy and verify approved media
        shell: bash
        run: |
          set -euo pipefail
          args=(--apply "--limit=${{ inputs.limit }}")
          if [[ "${{ inputs.delete_source }}" == "true" ]]; then
            if [[ "${{ vars.B2_MEDIA_SOURCE_DELETION_ENABLED }}" != "true" ]]; then
              echo "Refusing source deletion: set repository variable B2_MEDIA_SOURCE_DELETION_ENABLED=true only after count/hash/delivery validation." >&2
              exit 1
            fi
            args+=(--delete-source)
          fi
          npm run locations:photos:migrate-b2 -- "${args[@]}"
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          B2_MEDIA_APPLICATION_KEY_ID: ${{ secrets.B2_MEDIA_APPLICATION_KEY_ID || secrets.B2_KEY_ID }}
          B2_MEDIA_APPLICATION_KEY: ${{ secrets.B2_MEDIA_APPLICATION_KEY || secrets.B2_APPLICATION_KEY }}
          B2_MEDIA_BUCKET_ID: ${{ secrets.B2_MEDIA_BUCKET_ID }}
          B2_MEDIA_BUCKET_NAME: ${{ vars.B2_MEDIA_BUCKET_NAME || secrets.B2_BUCKET || 'puddle-assets' }}
          B2_MEDIA_PUBLIC_BASE_URL: ${{ vars.B2_MEDIA_PUBLIC_BASE_URL || secrets.B2_DOWNLOAD_BASE_URL }}
          B2_MEDIA_OPEN_PHOTO_PREFIX: ${{ vars.B2_MEDIA_OPEN_PHOTO_PREFIX || 'media/photos/by-sha256' }}
          B2_MEDIA_MIGRATION_CONCURRENCY: ${{ vars.B2_MEDIA_MIGRATION_CONCURRENCY || '32' }}
