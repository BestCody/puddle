name: US and Canada catalogue canary

on:
  workflow_dispatch:
    inputs:
      release:
        description: Unique inactive release name containing canary, for example us-ca-canary-2026-08-04-toronto-01
        required: true
        type: string
      market_id:
        description: Priority market to validate before the full launch
        required: true
        default: toronto
        type: choice
        options:
          - toronto
          - new-york

permissions:
  contents: read

concurrency:
  group: us-canada-catalogue-canary-${{ inputs.release }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  B2_LAUNCH_MAX_BYTES: '9000000000'
  B2_PHOTO_START_MAX_BYTES: '8900000000'
  SUPABASE_LAUNCH_MAX_BYTES: '400000000'
  VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}

jobs:
  canary:
    name: Build inactive ${{ inputs.market_id }} canary
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      FSQ_OS_CONNECTION_SQL: ${{ secrets.FSQ_OS_CONNECTION_SQL }}
      MARKET_ID: ${{ inputs.market_id }}
      RELEASE: ${{ inputs.release }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install application and data clients
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate GitHub launch configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VERCEL_TOKEN" || { echo 'Missing VERCEL_TOKEN secret.' >&2; exit 1; }
          test -n "$VERCEL_ORG_ID" || { echo 'Missing VERCEL_ORG_ID repository variable.' >&2; exit 1; }
          test -n "$VERCEL_PROJECT_ID" || { echo 'Missing VERCEL_PROJECT_ID repository variable.' >&2; exit 1; }
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN secret.' >&2; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Missing SUPABASE_DB_PASSWORD secret.' >&2; exit 1; }
          test -n "$SUPABASE_PROJECT_REF" || { echo 'Missing SUPABASE_PROJECT_REF repository variable.' >&2; exit 1; }
          test -n "$FSQ_OS_CONNECTION_SQL" || { echo 'Missing FSQ_OS_CONNECTION_SQL secret.' >&2; exit 1; }

      - name: Link Vercel project for CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .vercel
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs'

          const orgId = String(process.env.VERCEL_ORG_ID || '').trim()
          const projectId = String(process.env.VERCEL_PROJECT_ID || '').trim()
          if (!orgId || !projectId) throw new Error('Missing Vercel project identifiers.')

          writeFileSync(
            '.vercel/project.json',
            `${JSON.stringify({ orgId, projectId }, null, 2)}\n`,
            { mode: 0o600 }
          )
          console.log('Created the temporary Vercel project link for this runner.')
          NODE

      - name: Resolve and validate canary market
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'

          const release = String(process.env.RELEASE || '').trim()
          if (!/^[a-z0-9][a-z0-9-]{2,79}$/.test(release)) {
            throw new Error('release must contain only lowercase letters, numbers, and hyphens (3-80 characters).')
          }
          if (!release.includes('canary')) {
            throw new Error('Canary release names must contain the word canary.')
          }

          const plan = JSON.parse(readFileSync('config/launch-markets.json', 'utf8'))
          const market = plan.markets.find((entry) => entry.id === process.env.MARKET_ID)
          if (!market) throw new Error(`Unknown market_id: ${process.env.MARKET_ID}`)
          if (!Array.isArray(market.bbox) || market.bbox.length !== 4) {
            throw new Error(`Invalid bbox for ${market.id}`)
          }

          const lines = [
            `MARKET_BBOX=${market.bbox.join(',')}`,
            `MARKET_NAME=${market.name}`,
            `ZOOM=${plan.zoom}`
          ]
          appendFileSync(process.env.GITHUB_ENV, `${lines.join('\n')}\n`)
          console.log(`Canary market: ${market.name} (${market.id})`)
          console.log(`Bounding box: ${market.bbox.join(',')}`)
          console.log(`Inactive release: ${release}`)
          NODE

      - name: Validate Vercel production variables
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest env run -e production --token="$VERCEL_TOKEN" -- \
            node --input-type=module -e '
              const required = [
                "NEXT_PUBLIC_SUPABASE_URL",
                "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY",
                "SUPABASE_SECRET_KEY",
                "B2_S3_ENDPOINT",
                "B2_REGION",
                "B2_KEY_ID",
                "B2_APPLICATION_KEY",
                "B2_BUCKET",
                "B2_DOWNLOAD_BASE_URL"
              ];
              const missing = required.filter((name) => !String(process.env[name] || "").trim());
              if (missing.length) throw new Error(`Missing Vercel Production variables: ${missing.join(", ")}`);
              console.log(`Validated ${required.length} Vercel Production variables.`);
            '

      - name: Apply pending Supabase migrations
        shell: bash
        run: |
          set -euo pipefail
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          npx supabase db push --linked --password "$SUPABASE_DB_PASSWORD"

      - name: Check starting storage and database budgets
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest env run -e production --token="$VERCEL_TOKEN" -- \
            node scripts/check-launch-budgets.mjs --phase=preflight

      - name: Download Overture places for canary market
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/overture"
          overturemaps download \
            --bbox="$MARKET_BBOX" \
            -f geojsonseq \
            --type=place \
            -o "$RUNNER_TEMP/overture/$MARKET_ID.geojsonseq"
          test -s "$RUNNER_TEMP/overture/$MARKET_ID.geojsonseq" || {
            echo 'Overture download produced an empty file.' >&2
            exit 1
          }

      - name: Export FSQ OS places for canary market
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fsq"
          python <<'PY'
          import os
          from pathlib import Path
          import duckdb

          west, south, east, north = [float(value) for value in os.environ['MARKET_BBOX'].split(',')]
          output = Path(os.environ['RUNNER_TEMP']) / 'fsq' / f"{os.environ['MARKET_ID']}.jsonl"
          connection_sql = os.environ['FSQ_OS_CONNECTION_SQL'].strip()
          if not connection_sql:
              raise RuntimeError('FSQ_OS_CONNECTION_SQL is empty.')

          con = duckdb.connect()
          con.execute(connection_sql)
          predicate = f"""
            date_closed IS NULL
            AND longitude BETWEEN {west} AND {east}
            AND latitude BETWEEN {south} AND {north}
          """
          count = con.execute(f"SELECT count(*) FROM places WHERE {predicate}").fetchone()[0]
          if count <= 0:
              raise RuntimeError('FSQ OS returned zero open places for the canary bounding box.')

          escaped_output = str(output).replace("'", "''")
          con.execute(f"""
            COPY (
              SELECT *
              FROM places
              WHERE {predicate}
            ) TO '{escaped_output}' (FORMAT JSON, ARRAY false)
          """)
          print(f"Exported {count} FSQ OS places to {output} ({output.stat().st_size} bytes).")
          PY

      - name: Build mixed canary partition
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest env run -e production --token="$VERCEL_TOKEN" -- \
            npm run locations:catalogue:build-mixed -- \
              --input="overture:$RUNNER_TEMP/overture" \
              --input="fsq_os:$RUNNER_TEMP/fsq" \
              --output="$RUNNER_TEMP/static-catalogue" \
              --release="$RELEASE" \
              --partition="$MARKET_ID" \
              --append-release \
              --zoom="$ZOOM"

      - name: Enforce partition storage limits
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest env run -e production --token="$VERCEL_TOKEN" -- \
            node scripts/check-launch-budgets.mjs \
              --phase=partition \
              --incoming-directory="$RUNNER_TEMP/static-catalogue"

      - name: Upload canary partition without activation
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest env run -e production --token="$VERCEL_TOKEN" -- \
            npm run locations:catalogue:publish-b2 -- \
              --directory="$RUNNER_TEMP/static-catalogue" \
              --apply

      - name: Build final inactive canary release
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest env run -e production --token="$VERCEL_TOKEN" -- \
            npm run locations:catalogue:build-mixed -- \
              --output="$RUNNER_TEMP/static-catalogue-final" \
              --release="$RELEASE" \
              --finalize-release \
              --zoom="$ZOOM"
          mkdir -p "$RUNNER_TEMP/root-manifest/catalogue"
          cp "$RUNNER_TEMP/static-catalogue-final/catalogue/manifest.json" "$RUNNER_TEMP/root-manifest/catalogue/manifest.json"
          rm "$RUNNER_TEMP/static-catalogue-final/catalogue/manifest.json"

      - name: Enforce final release storage limits
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest env run -e production --token="$VERCEL_TOKEN" -- \
            node scripts/check-launch-budgets.mjs \
              --phase=partition \
              --incoming-directory="$RUNNER_TEMP/static-catalogue-final"

      - name: Upload finalized canary without activation
        shell: bash
        run: |
          set -euo pipefail
          npx --yes vercel@latest env run -e production --token="$VERCEL_TOKEN" -- \
            npm run locations:catalogue:publish-b2 -- \
              --directory="$RUNNER_TEMP/static-catalogue-final" \
              --apply

      - name: Preserve inactive root manifest for inspection
        uses: actions/upload-artifact@v6
        with:
          name: catalogue-canary-root-${{ inputs.release }}
          path: ${{ runner.temp }}/root-manifest/catalogue/manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Write canary summary
        shell: bash
        run: |
          {
            echo '## Catalogue canary completed'
            echo ''
            echo "- Market: $MARKET_NAME ($MARKET_ID)"
            echo "- Release: $RELEASE"
            echo '- Activation: disabled by design'
            echo '- Photo enrichment: not run'
            echo '- Google fallback: not run'
            echo ''
            echo 'The active catalogue manifest was not changed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary canary data
        if: always()
        shell: bash
        run: |
          rm -rf \
            "$RUNNER_TEMP/overture" \
            "$RUNNER_TEMP/fsq" \
            "$RUNNER_TEMP/static-catalogue" \
            "$RUNNER_TEMP/static-catalogue-final" \
            "$RUNNER_TEMP/root-manifest" \
            .vercel
