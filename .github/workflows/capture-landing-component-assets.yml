name: Capture landing component assets

on:
  push:
    branches:
      - agent/genuine-figma-landing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/genuine-figma-landing
      - name: Download exact mobile logo asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/figma/assets
          curl -L --fail --retry 3 -o public/figma/assets/mobile-logo-exact.svg 'https://www.figma.com/api/mcp/asset/76aa39b2-820b-4ad0-b30a-cd253c56b161.svg'
      - name: Commit captured asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/figma/assets/mobile-logo-exact.svg
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add exact mobile Figma logo asset'
          git push origin HEAD:agent/genuine-figma-landing
