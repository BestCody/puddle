name: Capture landing component assets

on:
  push:
    branches:
      - agent/genuine-figma-landing
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/genuine-figma-landing
      - name: Download remaining exact Figma assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p public/figma/assets
          curl -L --fail --retry 3 -o public/figma/assets/hero-phone-exact.png 'https://www.figma.com/api/mcp/asset/dc8a3a2a-026a-4614-b833-7e1bc8cb282b.png'
          curl -L --fail --retry 3 -o public/figma/assets/phone-swipe-exact.png 'https://www.figma.com/api/mcp/asset/a6a043b2-dccc-45c0-96d4-23cf1aa661d1.png'
          curl -L --fail --retry 3 -o public/figma/assets/city-exact.png 'https://www.figma.com/api/mcp/asset/7c6d822a-fb9f-4f09-ac20-dff4e0f9b7eb.png'
      - name: Commit captured assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add public/figma/assets
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Add remaining exact Figma component assets'
          git push origin HEAD:agent/genuine-figma-landing
