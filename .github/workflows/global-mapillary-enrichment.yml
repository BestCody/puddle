name: Saturate Mapillary photo discovery

on:
  workflow_dispatch:
    inputs:
      countries:
        description: Comma-separated country codes; empty continues the global cursor
        required: false
        default: ''
        type: string
      request_limit:
        description: Maximum tile-request attempts to reserve for this run
        required: false
        default: '50000'
        type: string
  schedule:
    - cron: '7 */6 * * *'

permissions:
  contents: read

concurrency:
  group: global-mapillary-photo-enrichment
  cancel-in-progress: false

jobs:
  enrich:
    if: github.event_name == 'workflow_dispatch' || vars.GLOBAL_PHOTO_PIPELINE_ENABLED == 'true'
    runs-on: ${{ vars.GLOBAL_DATA_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 360
    env:
      B2_DATA_APPLICATION_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_DATA_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_DATA_BUCKET_NAME: ${{ secrets.B2_BUCKET }}
      B2_DATA_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
      B2_DATA_S3_REGION: ${{ secrets.B2_REGION }}
      B2_DATA_PREFIX: data
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check duckdb boto3 mapbox-vector-tile
      - id: active
        run: python scripts/global-data/active_snapshot.py
      - name: Spend the Mapillary tile allowance on new coverage tiles
        run: >-
          python scripts/global-data/build_mapillary_candidates.py
          --snapshot='${{ steps.active.outputs.snapshot }}'
          --countries='${{ github.event_name == 'workflow_dispatch' && inputs.countries || vars.GLOBAL_PHOTO_COUNTRIES }}'
          --request-limit='${{ github.event_name == 'workflow_dispatch' && inputs.request_limit || '50000' }}'
        env:
          MAPILLARY_ACCESS_TOKEN: ${{ secrets.MAPILLARY_ACCESS_TOKEN }}
          # Reserve up to the full published daily tile allowance; the B2 UTC-day ledger prevents overspend and releases unused reservations.
          MAPILLARY_TILE_DAILY_LIMIT: '50000'
          MAPILLARY_TILE_CONCURRENCY: ${{ vars.MAPILLARY_TILE_CONCURRENCY || '192' }}
          MAPILLARY_RESCAN_DAYS: ${{ vars.MAPILLARY_RESCAN_DAYS || '30' }}
          OPEN_PHOTO_MAX_CANDIDATES_PER_PROVIDER: '3'
