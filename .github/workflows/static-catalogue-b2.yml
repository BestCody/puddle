name: Build static place catalogue

on:
  workflow_dispatch:
    inputs:
      bbox:
        description: 'Overture bounding box: west,south,east,north'
        required: true
        type: string
      release:
        description: 'Immutable release label'
        required: true
        type: string
      zoom:
        description: 'Static tile zoom'
        required: false
        default: '10'
        type: string

permissions:
  contents: read

concurrency:
  group: static-place-catalogue-${{ inputs.release }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: ${{ vars.B2_INFRA_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: npm ci --no-audit --no-fund
      - name: Install official Overture client
        run: python -m pip install --disable-pip-version-check overturemaps==1.0.1
      - name: Download Overture places shard
        run: overturemaps download --bbox="${{ inputs.bbox }}" -f geojsonseq --type=place -o overture-places.geojsonseq
      - name: Build compressed static tiles
        run: npm run locations:catalogue:build-static -- --source=overture --file=overture-places.geojsonseq --output=dist/static-catalogue --release="${{ inputs.release }}" --zoom="${{ inputs.zoom }}"
      - name: Publish immutable release to private Backblaze B2
        run: npm run locations:catalogue:publish-b2 -- --directory=dist/static-catalogue --apply
        env:
          B2_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
          B2_REGION: ${{ secrets.B2_REGION }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_DOWNLOAD_BASE_URL: ${{ secrets.B2_DOWNLOAD_BASE_URL }}
          B2_UPLOAD_CONCURRENCY: '4'
