name: Cleanup disposable test accounts

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DELETE_TEST_ACCOUNTS to remove reserved-domain test accounts
        required: true
        type: string

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Install cleanup dependency
        run: npm ci --omit=dev --no-audit --no-fund
      - name: Audit and remove disposable accounts
        run: node scripts/cleanup-test-accounts.mjs --delete --confirm='${{ inputs.confirm }}'
