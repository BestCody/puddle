name: US and Canada catalogue sequential build

on:
  workflow_dispatch:
    inputs:
      release:
        description: Inactive release to rebuild locally and upload once
        required: true
        default: us-ca-cities-2026-08-05-catalogue-01
        type: string
  push:
    branches:
      - main
    paths:
      - .github/workflows/us-canada-catalogue-sequential.yml

permissions:
  contents: read

concurrency:
  group: us-canada-catalogue-sequential-${{ inputs.release || 'us-ca-cities-2026-08-05-catalogue-01' }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  B2_LAUNCH_MAX_BYTES: '9000000000'
  SUPABASE_LAUNCH_MAX_BYTES: '400000000'
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
  SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
  B2_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
  B2_REGION: ${{ secrets.B2_REGION }}
  B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
  B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
  B2_BUCKET: ${{ secrets.B2_BUCKET }}
  B2_DOWNLOAD_BASE_URL: ${{ secrets.B2_DOWNLOAD_BASE_URL }}
  STATIC_CATALOGUE_BASE_URL: ${{ secrets.B2_DOWNLOAD_BASE_URL }}
  FSQ_OS_CONNECTION_SQL: ${{ secrets.FSQ_OS_CONNECTION_SQL }}
  RELEASE: ${{ inputs.release || 'us-ca-cities-2026-08-05-catalogue-01' }}

jobs:
  build:
    name: Build all markets locally and upload inactive release
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[start-sequential-catalogue]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install application and data clients
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate inactive build configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
            SUPABASE_SECRET_KEY
            SUPABASE_ACCESS_TOKEN
            SUPABASE_DB_PASSWORD
            SUPABASE_PROJECT_REF
            B2_S3_ENDPOINT
            B2_REGION
            B2_KEY_ID
            B2_APPLICATION_KEY
            B2_BUCKET
            B2_DOWNLOAD_BASE_URL
            FSQ_OS_CONNECTION_SQL
          )
          missing=()
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub Actions secrets or variables: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          [[ "$RELEASE" =~ ^[a-z0-9][a-z0-9-]{2,79}$ ]] || {
            echo 'release must contain only lowercase letters, numbers, and hyphens (3-80 characters).' >&2
            exit 1
          }
          [[ "$RELEASE" != *canary* ]] || {
            echo 'The full sequential build cannot use a canary release name.' >&2
            exit 1
          }
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { b2Configuration } from './lib/app/b2-s3.js'

          const plan = JSON.parse(readFileSync('config/launch-markets.json', 'utf8'))
          if (Number(plan.version) !== 1 || !Array.isArray(plan.markets) || plan.markets.length === 0) {
            throw new Error('Invalid launch market plan.')
          }
          const ids = new Set()
          for (const market of plan.markets) {
            if (!/^[a-z0-9-]+$/.test(String(market.id || '')) || ids.has(market.id)) {
              throw new Error(`Invalid or duplicate market id: ${market.id}`)
            }
            ids.add(market.id)
            if (!['US', 'CA'].includes(market.country)) throw new Error(`Unsupported country for ${market.id}`)
            if (!Array.isArray(market.bbox) || market.bbox.length !== 4 || market.bbox.some((value) => !Number.isFinite(Number(value)))) {
              throw new Error(`Invalid bbox for ${market.id}`)
            }
            const [west, south, east, north] = market.bbox.map(Number)
            if (!(west < east && south < north)) throw new Error(`Inverted bbox for ${market.id}`)
          }
          if (!b2Configuration()?.downloadBaseUrl) throw new Error('Invalid B2 publisher configuration.')
          console.log(`Validated ${plan.markets.length} markets for an inactive sequential build.`)
          NODE

      - name: Apply pending Supabase migrations
        shell: bash
        run: |
          set -euo pipefail
          npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          npx supabase db push --linked --password "$SUPABASE_DB_PASSWORD" --include-all

      - name: Check starting launch budgets
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-launch-budgets.mjs --phase=preflight

      - name: Build every market with local-only catalogue reads
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/static-catalogue"
          overture_dir="$RUNNER_TEMP/overture"
          fsq_dir="$RUNNER_TEMP/fsq"
          zoom="$(jq -r '.zoom' config/launch-markets.json)"
          market_total="$(jq '.markets | length' config/launch-markets.json)"
          market_number=0

          rm -rf "$output" "$overture_dir" "$fsq_dir"
          mkdir -p "$output"

          while IFS= read -r market; do
            market_number=$((market_number + 1))
            export MARKET_ID="$(jq -r '.id' <<<"$market")"
            market_name="$(jq -r '.name' <<<"$market")"
            export MARKET_BBOX="$(jq -r '.bbox | map(tostring) | join(",")' <<<"$market")"

            echo "Building market $market_number/$market_total: $market_name ($MARKET_ID)"
            rm -rf "$overture_dir" "$fsq_dir"
            mkdir -p "$overture_dir" "$fsq_dir"

            overturemaps download \
              --bbox="$MARKET_BBOX" \
              -f geojsonseq \
              --type=place \
              -o "$overture_dir/$MARKET_ID.geojsonseq"
            test -s "$overture_dir/$MARKET_ID.geojsonseq" || {
              echo "Overture download produced an empty file for $MARKET_ID." >&2
              exit 1
            }

            python <<'PY'
          import os
          from pathlib import Path
          import duckdb

          west, south, east, north = [float(value) for value in os.environ['MARKET_BBOX'].split(',')]
          output = Path(os.environ['RUNNER_TEMP']) / 'fsq' / f"{os.environ['MARKET_ID']}.jsonl"
          con = duckdb.connect()
          con.execute(os.environ['FSQ_OS_CONNECTION_SQL'].strip())
          predicate = f"""
            date_closed IS NULL
            AND longitude BETWEEN {west} AND {east}
            AND latitude BETWEEN {south} AND {north}
          """
          count = con.execute(f"SELECT count(*) FROM places WHERE {predicate}").fetchone()[0]
          if count <= 0:
              raise RuntimeError(f"FSQ OS returned zero open places for {os.environ['MARKET_ID']}.")
          escaped_output = str(output).replace("'", "''")
          con.execute(f"""
            COPY (
              SELECT * FROM places WHERE {predicate}
            ) TO '{escaped_output}' (FORMAT JSON, ARRAY false)
          """)
          if not output.exists() or output.stat().st_size <= 0:
              raise RuntimeError(f"FSQ OS export produced an empty file for {os.environ['MARKET_ID']}.")
          print(f"Exported {count} FSQ OS places for {os.environ['MARKET_ID']}.")
          PY

            B2_S3_ENDPOINT='' \
            B2_REGION='' \
            B2_KEY_ID='' \
            B2_APPLICATION_KEY='' \
            B2_BUCKET='' \
            B2_DOWNLOAD_BASE_URL='' \
            STATIC_CATALOGUE_BASE_URL='' \
            npm run locations:catalogue:build-mixed -- \
              --input="overture:$overture_dir" \
              --input="fsq_os:$fsq_dir" \
              --output="$output" \
              --release="$RELEASE" \
              --partition="$MARKET_ID" \
              --append-release \
              --zoom="$zoom"

            node scripts/check-launch-budgets.mjs \
              --phase=partition \
              --incoming-directory="$output"
            du -sh "$output"
          done < <(jq -c '.markets[]' config/launch-markets.json)

          rm -rf "$overture_dir" "$fsq_dir"

      - name: Finalize local release without activating production
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/static-catalogue"
          zoom="$(jq -r '.zoom' config/launch-markets.json)"

          B2_S3_ENDPOINT='' \
          B2_REGION='' \
          B2_KEY_ID='' \
          B2_APPLICATION_KEY='' \
          B2_BUCKET='' \
          B2_DOWNLOAD_BASE_URL='' \
          STATIC_CATALOGUE_BASE_URL='' \
          npm run locations:catalogue:build-mixed -- \
            --output="$output" \
            --release="$RELEASE" \
            --finalize-release \
            --zoom="$zoom"

          mkdir -p "$RUNNER_TEMP/root-manifest/catalogue"
          cp "$output/catalogue/manifest.json" "$RUNNER_TEMP/root-manifest/catalogue/manifest.json"
          rm "$output/catalogue/manifest.json"

          node scripts/check-launch-budgets.mjs \
            --phase=partition \
            --incoming-directory="$output"

      - name: Upload complete inactive release once
        shell: bash
        run: |
          set -euo pipefail
          npm run locations:catalogue:publish-b2 -- \
            --directory="$RUNNER_TEMP/static-catalogue" \
            --apply

      - name: Preserve activation manifest without publishing it
        uses: actions/upload-artifact@v6
        with:
          name: catalogue-root-${{ env.RELEASE }}
          path: ${{ runner.temp }}/root-manifest/catalogue/manifest.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30

      - name: Confirm inactive completion
        shell: bash
        run: |
          set -euo pipefail
          test ! -f "$RUNNER_TEMP/static-catalogue/catalogue/manifest.json"
          echo "Completed inactive sequential release: $RELEASE"
          echo 'Production catalogue manifest was not uploaded.'

      - name: Remove temporary catalogue data
        if: always()
        shell: bash
        run: rm -rf "$RUNNER_TEMP/overture" "$RUNNER_TEMP/fsq" "$RUNNER_TEMP/static-catalogue"
