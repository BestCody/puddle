name: One-off production B2 card smoke

on:
  push:
    branches: [ops/production-open-photo-cleanup-20260817]
    paths:
      - '.github/workflows/one-off-production-b2-card-smoke.yml'

permissions:
  contents: read
  statuses: write

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GLOBAL_LOCATION_SEARCH_URL: ${{ secrets.OPENSEARCH_URL }}
      GLOBAL_LOCATION_SEARCH_INDEX: locations-active
      OPENSEARCH_USERNAME: ${{ secrets.OPENSEARCH_USERNAME }}
      OPENSEARCH_PASSWORD: ${{ secrets.OPENSEARCH_PASSWORD }}
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify actual card URLs and canonical B2 delivery
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { searchGlobalLocationsInViewport } from './lib/app/global-location-search.js'

          for (const name of ['GLOBAL_LOCATION_SEARCH_URL','OPENSEARCH_USERNAME','OPENSEARCH_PASSWORD','NEXT_PUBLIC_SUPABASE_URL','SUPABASE_SECRET_KEY']) {
            if (!String(process.env[name] || '').trim()) throw new Error(`${name} is not configured.`)
          }

          const viewports = [
            { name: 'Toronto', north: 43.85, south: 43.45, west: -79.80, east: -79.00, zoom: 11 },
            { name: 'Montreal', north: 45.75, south: 45.35, west: -74.05, east: -73.35, zoom: 11 },
            { name: 'Vancouver', north: 49.45, south: 49.05, west: -123.45, east: -122.80, zoom: 11 }
          ]

          let candidateCount = 0
          const cardPhotos = []
          for (const viewport of viewports) {
            const result = await searchGlobalLocationsInViewport(viewport)
            if (result.timedOut) throw new Error(`${viewport.name} OpenSearch viewport timed out.`)
            if (!Array.isArray(result.candidates) || result.candidates.length === 0) throw new Error(`${viewport.name} returned no candidates.`)
            candidateCount += result.candidates.length
            for (const row of result.candidates) {
              const url = String(row?.primary_photo?.url || '').trim()
              if (url) cardPhotos.push({ id: row.id, url })
            }
          }
          if (cardPhotos.length === 0) throw new Error('No card photos were returned in smoke viewports.')

          const badCards = []
          for (const photo of cardPhotos) {
            const isPuddleB2Delivery = /^https:\/\/puddle\.you\/api\/open-photo\/[0-9a-f]{64}$/i.test(photo.url)
            let status = null
            let type = null
            try {
              const response = await fetch(photo.url, { redirect: 'error', signal: AbortSignal.timeout(15000) })
              status = response.status
              type = String(response.headers.get('content-type') || '')
            } catch (error) {
              status = `fetch_error:${error.message}`
            }
            if (!isPuddleB2Delivery || status !== 200 || !String(type || '').startsWith('image/')) {
              badCards.push({ ...photo, isPuddleB2Delivery, status, type })
            }
          }

          const supabaseUrl = String(process.env.NEXT_PUBLIC_SUPABASE_URL).replace(/\/$/, '')
          const serviceKey = process.env.SUPABASE_SECRET_KEY
          const mediaResponse = await fetch(`${supabaseUrl}/rest/v1/media_objects?storage_backend=eq.b2&storage_key=like.media/photos/by-sha256/*&content_hash=not.is.null&select=content_hash,byte_size,storage_key&order=created_at.asc&limit=8`, {
            headers: { apikey: serviceKey, Authorization: `Bearer ${serviceKey}`, Accept: 'application/json' },
            redirect: 'error', signal: AbortSignal.timeout(15000)
          })
          if (!mediaResponse.ok) throw new Error(`Could not read canonical B2 photo samples: HTTP ${mediaResponse.status}`)
          const media = await mediaResponse.json()
          if (!Array.isArray(media) || media.length < 3) throw new Error('Not enough canonical B2 photo samples.')

          for (const item of media) {
            const hash = String(item.content_hash || '').toLowerCase()
            const expectedKey = `media/photos/by-sha256/${hash.slice(0, 2)}/${hash}.jpg`
            if (!/^[0-9a-f]{64}$/.test(hash) || String(item.storage_key || '') !== expectedKey) throw new Error(`Invalid canonical B2 photo ${hash}`)
            const response = await fetch(`https://puddle.you/api/open-photo/${hash}`, { redirect: 'error', signal: AbortSignal.timeout(15000) })
            if (!response.ok) throw new Error(`Production B2 delivery failed HTTP ${response.status} for ${hash}`)
            const bytes = Buffer.from(await response.arrayBuffer())
            if (createHash('sha256').update(bytes).digest('hex') !== hash) throw new Error(`Production delivery hash mismatch for ${hash}`)
            if (bytes.length !== Number(item.byte_size)) throw new Error(`Production delivery size mismatch for ${hash}`)
            if (!String(response.headers.get('content-type') || '').startsWith('image/')) throw new Error(`Production delivery was not an image for ${hash}`)
          }

          console.log(JSON.stringify({ candidateCount, cardPhotoCount: cardPhotos.length, badCardCount: badCards.length, canonicalB2SamplesVerified: media.length, badCards: badCards.slice(0, 12) }, null, 2))
          if (badCards.length) throw new Error(`Live card photo path is stale or incorrect for ${badCards.length}/${cardPhotos.length} sampled photos.`)
          NODE
      - name: Publish smoke success
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GITHUB_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"success\",\"context\":\"Strict production B2 card smoke\",\"description\":\"Live card URLs use verified Puddle B2 delivery\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
      - name: Publish smoke failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error -X POST \
            -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GITHUB_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"failure\",\"context\":\"Strict production B2 card smoke\",\"description\":\"Live card URL path is stale or incorrect\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
