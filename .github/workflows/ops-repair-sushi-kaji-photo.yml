name: Ops - repair Sushi Kaji photo metadata

on:
  push:
    branches:
      - ops/repair-sushi-kaji-photo
    paths:
      - '.github/workflows/ops-repair-sushi-kaji-photo.yml'

permissions:
  contents: read

jobs:
  repair-photo-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      MAPILLARY_ACCESS_TOKEN: ${{ secrets.MAPILLARY_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Refresh approved Mapillary identity for Sushi Kaji only
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createAdminClient } from './lib/supabase/admin.js'
          import { streetCandidateScore } from './lib/app/open-photo-candidates.js'

          const LOCATION_ID = '4b4fd9de-c44d-4c07-a6bc-f6077d06a4cd'
          const MIN_SCORE = 0.76
          const token = String(process.env.MAPILLARY_ACCESS_TOKEN || '').trim()
          if (!token) throw new Error('MAPILLARY_ACCESS_TOKEN is unavailable.')
          const admin = createAdminClient()

          const locationResult = await admin
            .from('locations')
            .select('id,name,kind,city,region,country,country_code,address_public,latitude,longitude,status,visibility')
            .eq('id', LOCATION_ID)
            .maybeSingle()
          if (locationResult.error) throw locationResult.error
          const location = locationResult.data
          if (!location || location.name !== 'Sushi Kaji') throw new Error('Target Sushi Kaji location was not found.')
          if (location.status !== 'published' || location.visibility !== 'public') throw new Error('Target location is not public/published.')

          const sourceResult = await admin
            .from('location_photo_sources')
            .select('location_id,provider,external_photo_id,status,is_ai_generated,is_primary,sort_order,verified_at')
            .eq('location_id', LOCATION_ID)
            .eq('provider', 'mapillary')
            .eq('status', 'approved')
            .eq('is_ai_generated', false)
            .limit(1)
            .maybeSingle()
          if (sourceResult.error) throw sourceResult.error
          const source = sourceResult.data
          if (!source) throw new Error('Approved Sushi Kaji Mapillary source was not found.')

          const place = {
            id: location.id,
            name: location.name,
            kind: location.kind,
            city: location.city,
            region: location.region,
            country: location.country,
            countryCode: location.country_code,
            addressPublic: location.address_public,
            latitude: Number(location.latitude),
            longitude: Number(location.longitude)
          }

          function bbox(latitude, longitude, radiusM = 45) {
            const latDelta = radiusM / 111_320
            const lngDelta = radiusM / (111_320 * Math.max(0.2, Math.cos(Number(latitude) * Math.PI / 180)))
            return [Number(longitude) - lngDelta, Number(latitude) - latDelta, Number(longitude) + lngDelta, Number(latitude) + latDelta]
          }

          async function fetchMapillary() {
            const url = new URL('https://graph.mapillary.com/images')
            url.search = new URLSearchParams({
              access_token: token,
              bbox: bbox(place.latitude, place.longitude).join(','),
              limit: '30',
              fields: 'id,computed_geometry,geometry,compass_angle,captured_at,thumb_2048_url,width,height,creator'
            }).toString()
            let lastError = null
            for (let attempt = 1; attempt <= 3; attempt += 1) {
              try {
                const response = await fetch(url, {
                  headers: { Accept: 'application/json' },
                  cache: 'no-store',
                  signal: AbortSignal.timeout(15_000)
                })
                if (!response.ok) throw new Error(`Mapillary returned ${response.status}.`)
                return response.json()
              } catch (error) {
                lastError = error
                console.warn(`Mapillary attempt ${attempt} failed: ${error.message}`)
                if (attempt < 3) await new Promise((resolve) => setTimeout(resolve, attempt * 1_000))
              }
            }
            throw lastError || new Error('Mapillary lookup failed.')
          }

          const payload = await fetchMapillary()
          const candidates = (payload?.data || []).flatMap((row) => {
            const coordinates = row?.computed_geometry?.coordinates || row?.geometry?.coordinates || []
            const image = {
              latitude: Number(coordinates[1]),
              longitude: Number(coordinates[0]),
              heading: Number(row?.compass_angle),
              capturedAt: row?.captured_at,
              width: Number(row?.width),
              height: Number(row?.height)
            }
            const scored = streetCandidateScore({ location: place, image })
            if (!scored || !row?.thumb_2048_url || scored.score < MIN_SCORE) return []
            const creator = String(row?.creator?.username || row?.creator?.name || 'Mapillary contributor').trim()
            return [{
              externalId: String(row.id),
              score: scored.score,
              attribution: `${creator} · Mapillary · CC BY-SA 4.0`,
              pageUrl: `https://www.mapillary.com/app/?pKey=${encodeURIComponent(String(row.id))}&focus=photo`,
              license: 'CC-BY-SA-4.0',
              licenseUrl: 'https://creativecommons.org/licenses/by-sa/4.0/',
              width: Number(row?.width) || null,
              height: Number(row?.height) || null
            }]
          }).sort((a, b) => b.score - a.score)

          if (!candidates.length) throw new Error(`No current Mapillary candidate met production score ${MIN_SCORE}.`)
          const candidate = candidates[0]
          const oldId = String(source.external_photo_id || '')
          const newId = candidate.externalId

          const updateResult = await admin
            .from('location_photo_sources')
            .update({
              external_photo_id: newId,
              attribution_text: candidate.attribution,
              attribution_url: candidate.pageUrl,
              license_code: candidate.license,
              terms_url: candidate.licenseUrl,
              width: candidate.width,
              height: candidate.height,
              verified_at: new Date().toISOString()
            })
            .eq('location_id', LOCATION_ID)
            .eq('provider', 'mapillary')
            .eq('status', 'approved')
            .eq('is_ai_generated', false)
            .select('location_id,provider,external_photo_id,status,verified_at')
          if (updateResult.error) throw updateResult.error
          if (!Array.isArray(updateResult.data) || updateResult.data.length !== 1) {
            throw new Error(`Expected exactly one approved Mapillary row to update; updated ${updateResult.data?.length || 0}.`)
          }

          console.log(JSON.stringify({
            locationId: LOCATION_ID,
            name: location.name,
            oldExternalPhotoId: oldId,
            newExternalPhotoId: newId,
            candidateScore: Number(candidate.score.toFixed(4)),
            provider: 'mapillary',
            updatedRows: updateResult.data.length
          }, null, 2))
          NODE
