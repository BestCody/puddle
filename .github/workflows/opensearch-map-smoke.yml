name: OpenSearch map smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/opensearch-map-smoke.yml'
      - 'lib/app/global-location-search.js'
      - 'instrumentation.js'
      - 'supabase/migrations/10071_opensearch_runtime_vault.sql'
      - '.github/trigger-opensearch-map-smoke'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: opensearch-map-smoke
  cancel-in-progress: false

jobs:
  viewport:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GLOBAL_LOCATION_SEARCH_URL: ${{ secrets.OPENSEARCH_URL }}
      GLOBAL_LOCATION_SEARCH_INDEX: locations-active
      OPENSEARCH_USERNAME: ${{ secrets.OPENSEARCH_USERNAME }}
      OPENSEARCH_PASSWORD: ${{ secrets.OPENSEARCH_PASSWORD }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Publish pending smoke status
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"pending\",\"context\":\"OpenSearch map smoke\",\"description\":\"Testing authenticated Toronto viewport\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Execute real Toronto map viewport request
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { searchGlobalLocationsInViewport } from './lib/app/global-location-search.js'

          for (const name of ['GLOBAL_LOCATION_SEARCH_URL', 'OPENSEARCH_USERNAME', 'OPENSEARCH_PASSWORD']) {
            if (!String(process.env[name] || '').trim()) throw new Error(`${name} is not configured.`)
          }

          const result = await searchGlobalLocationsInViewport({
            north: 43.85,
            south: 43.45,
            west: -79.80,
            east: -79.00,
            zoom: 11
          })

          if (result.timedOut) throw new Error('OpenSearch map viewport request timed out.')
          if (result.index !== 'locations-active') throw new Error(`Unexpected OpenSearch index: ${result.index}`)
          if (!Array.isArray(result.candidates) || result.candidates.length === 0) {
            throw new Error('Toronto map viewport returned zero published locations.')
          }

          const valid = result.candidates.filter((row) =>
            row?.id && row?.slug && Number.isFinite(Number(row?.latitude)) && Number.isFinite(Number(row?.longitude))
          )
          if (valid.length === 0) throw new Error('Map viewport returned no renderable location points.')

          console.log(JSON.stringify({
            ok: true,
            index: result.index,
            tookMs: result.tookMs,
            candidateCount: result.candidates.length,
            renderableCount: valid.length
          }))
          NODE

      - name: Publish successful smoke status
        if: success()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"success\",\"context\":\"OpenSearch map smoke\",\"description\":\"Authenticated Toronto viewport passed\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"

      - name: Publish failed smoke status
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -d "{\"state\":\"failure\",\"context\":\"OpenSearch map smoke\",\"description\":\"Authenticated Toronto viewport failed\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
