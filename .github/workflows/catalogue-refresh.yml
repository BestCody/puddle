name: Refresh legacy database catalogue

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy-database-place-catalogue
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install application dependencies
        run: npm ci --no-audit --no-fund
      - name: Install the official Overture client
        run: python -m pip install --disable-pip-version-check overturemaps==1.0.1
      - name: Refresh queued database regions as an explicit rollback tool
        run: npm run locations:catalogue:refresh
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          CATALOGUE_REFRESH_REGION_LIMIT: '4'
          CATALOGUE_REFRESH_PLACE_LIMIT: '1000000'
          CATALOGUE_REFRESH_TILE_KM: '60'
          CATALOGUE_PHOTO_ENRICH: 'false'
