name: Audit inactive US and Canada catalogue

on:
  workflow_dispatch:
    inputs:
      release:
        description: Inactive release to audit
        required: true
        default: us-ca-cities-2026-08-05-catalogue-01
        type: string
      mode:
        description: Structural listing audit or full content and enrichment audit
        required: true
        default: structure
        type: choice
        options:
          - structure
          - full
  push:
    branches:
      - main
    paths:
      - .github/workflows/us-canada-catalogue-audit.yml
      - scripts/audit-static-catalogue-structure.mjs

permissions:
  contents: read

concurrency:
  group: us-canada-catalogue-audit-${{ inputs.release || 'us-ca-cities-2026-08-05-catalogue-01' }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  B2_LAUNCH_MAX_BYTES: '9000000000'
  SUPABASE_LAUNCH_MAX_BYTES: '400000000'
  NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
  NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
  SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
  B2_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
  B2_REGION: ${{ secrets.B2_REGION }}
  B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
  B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
  B2_BUCKET: ${{ secrets.B2_BUCKET }}
  B2_DOWNLOAD_BASE_URL: ${{ secrets.B2_DOWNLOAD_BASE_URL }}
  STATIC_CATALOGUE_BASE_URL: ${{ secrets.B2_DOWNLOAD_BASE_URL }}
  RELEASE: ${{ inputs.release || 'us-ca-cities-2026-08-05-catalogue-01' }}
  AUDIT_MODE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[audit-full-catalogue]') && 'full' || inputs.mode || 'structure' }}

jobs:
  audit:
    name: Audit inactive release
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[audit-inactive-catalogue]') || contains(github.event.head_commit.message, '[audit-full-catalogue]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate read-only audit configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(
            NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
            SUPABASE_SECRET_KEY
            B2_S3_ENDPOINT
            B2_REGION
            B2_KEY_ID
            B2_APPLICATION_KEY
            B2_BUCKET
            B2_DOWNLOAD_BASE_URL
          )
          missing=()
          for name in "${required[@]}"; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub Actions secrets: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          [[ "$RELEASE" =~ ^[a-z0-9][a-z0-9-]{2,79}$ ]] || {
            echo 'release must contain only lowercase letters, numbers, and hyphens (3-80 characters).' >&2
            exit 1
          }
          [[ "$RELEASE" != *canary* ]] || {
            echo 'The catalogue audit cannot use a canary release name.' >&2
            exit 1
          }
          [[ "$AUDIT_MODE" == 'structure' || "$AUDIT_MODE" == 'full' ]] || {
            echo 'audit mode must be structure or full.' >&2
            exit 1
          }

      - name: Enforce final byte ceilings
        shell: bash
        run: |
          set -euo pipefail
          node scripts/check-launch-budgets.mjs --phase=audit

      - name: Verify release object structure using B2 listings
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-static-catalogue-structure.mjs \
            --release="$RELEASE" \
            --fail-on-incomplete

      - name: Verify every enrichment state and object by reading content
        if: ${{ env.AUDIT_MODE == 'full' }}
        shell: bash
        run: |
          set -euo pipefail
          npm run locations:catalogue:audit -- \
            --release="$RELEASE" \
            --fail-on-incomplete

      - name: Confirm audit remained inactive
        shell: bash
        run: |
          set -euo pipefail
          echo "Completed read-only $AUDIT_MODE audit for inactive release: $RELEASE"
          echo 'No catalogue manifest was published and production was not activated.'
