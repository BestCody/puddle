name: Clean R2 catalogue and photos

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Delete stale objects after reviewing dry-run output'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: r2-catalogue-photo-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: ${{ vars.R2_INFRA_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Remove stale releases and expired cached photos
        run: npm run locations:r2:cleanup -- ${{ inputs.apply && '--apply' || '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL }}
          R2_RELEASES_TO_KEEP: '2'
