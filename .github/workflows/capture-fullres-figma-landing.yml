name: Capture full-resolution Figma landing artboards

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  capture:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Download full-resolution Figma screenshots
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://www.figma.com/api/mcp/asset/93828898-bdf4-454a-b4dc-5e7c4413b1d0.png' \
            --output public/figma/landing-desktop.png
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://www.figma.com/api/mcp/asset/7d860e6c-7cbf-4472-aea9-7b91abda4c08.png' \
            --output public/figma/landing-mobile.png
          file public/figma/landing-desktop.png public/figma/landing-mobile.png
          file public/figma/landing-desktop.png | grep -q '1281 x 8736'
          file public/figma/landing-mobile.png | grep -q '704 x 9660'
      - name: Remove one-time capture workflow
        run: rm -f .github/workflows/capture-fullres-figma-landing.yml
      - name: Commit exact full-resolution artboards
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/figma .github/workflows/capture-fullres-figma-landing.yml
          git commit -m 'Store full-resolution Figma landing artboards'
          git push origin HEAD:main
