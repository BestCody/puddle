name: One-time Mapillary auth alignment

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/harden-photo-downloads
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Align Mapillary client-token usage with current guidance
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/global-data/materialize_photo_candidates.py')
          text = path.read_text()
          text = text.replace(
              "url = f'https://graph.mapillary.com/{urllib.parse.quote(str(image_id))}?' + urllib.parse.urlencode({'fields': fields})",
              "url = f'https://graph.mapillary.com/{urllib.parse.quote(str(image_id))}?' + urllib.parse.urlencode({'fields': fields, 'access_token': MAPILLARY_TOKEN})",
              1,
          )
          text = text.replace("                'Authorization': f'OAuth {MAPILLARY_TOKEN}',\n", '', 1)
          path.write_text(text)

          path = Path('tests/integration/photo-enrichment-runner.test.mjs')
          tests = path.read_text()
          tests = tests.replace("assert.match(materializer, /Authorization': f'OAuth/)", "assert.match(materializer, /'access_token': MAPILLARY_TOKEN/)", 1)
          path.write_text(tests)
          PY
      - name: Validate
        run: |
          python -m py_compile scripts/global-data/materialize_photo_candidates.py
          node --test tests/integration/photo-enrichment-runner.test.mjs
      - name: Commit
        run: |
          git config user.name 'puddle-maintenance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add scripts/global-data/materialize_photo_candidates.py tests/integration/photo-enrichment-runner.test.mjs
          git commit -m 'Align Mapillary client token usage'
          git push origin HEAD:agent/harden-photo-downloads
