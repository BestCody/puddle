name: Match Google Place IDs

# Spend each capped no-cost rich verification SKU in order. Continuous IDs-only
# discovery and reverse-geocoding repair run in separate concurrency groups.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum published photo-less locations to inspect'
        required: false
        default: '2000'
        type: string
      apply:
        description: 'Save verified Place IDs to Supabase'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '29 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/google-place-match.yml'
      - 'scripts/match-google-places.mjs'
      - 'lib/app/google-place-match.js'
      - 'lib/app/google-place-discovery.js'
      - 'supabase/migrations/10052_google_places_free_quota_matching.sql'
      - 'supabase/migrations/10053_google_places_autocomplete_matching.sql'
      - 'supabase/migrations/10054_google_place_matching_architecture.sql'
      - 'supabase/migrations/10055_google_place_matching_stage_progression.sql'

permissions:
  contents: read

concurrency:
  group: google-place-id-matching
  cancel-in-progress: false

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Maximize free Google Place ID coverage
        if: github.event_name != 'workflow_dispatch'
        run: npm run locations:google:match -- --limit=2000 --apply
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_MATCH_MIN_SCORE: '0.86'
          GOOGLE_PLACE_MATCH_DELAY_MS: '100'
          GOOGLE_PLACE_MATCH_MAX_DETAILS_CANDIDATES: '5'
      - name: Match Google Place IDs manually
        if: github.event_name == 'workflow_dispatch'
        run: npm run locations:google:match -- --limit="${{ inputs.limit }}" ${{ inputs.apply && '--apply' || '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_MATCH_MIN_SCORE: '0.86'
          GOOGLE_PLACE_MATCH_DELAY_MS: '100'
          GOOGLE_PLACE_MATCH_MAX_DETAILS_CANDIDATES: '5'
