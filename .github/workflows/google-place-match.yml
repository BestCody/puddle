name: Match Google Place IDs

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum published photo-less locations to inspect'
        required: false
        default: '100'
        type: string
      apply:
        description: 'Save verified Place IDs to Supabase'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '29 5 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/google-place-match.yml'
      - 'scripts/match-google-places.mjs'
      - 'lib/app/google-place-match.js'

permissions:
  contents: read

concurrency:
  group: google-place-id-matching
  cancel-in-progress: false

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Persist verified Google Place IDs
        if: github.event_name != 'workflow_dispatch'
        run: npm run locations:google:match -- --limit=250 --apply
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_MATCH_MIN_SCORE: '0.86'
          GOOGLE_PLACE_MATCH_DELAY_MS: '250'
      - name: Match Google Place IDs manually
        if: github.event_name == 'workflow_dispatch'
        run: npm run locations:google:match -- --limit="${{ inputs.limit }}" ${{ inputs.apply && '--apply' || '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
          GOOGLE_PLACE_MATCH_MIN_SCORE: '0.86'
          GOOGLE_PLACE_MATCH_DELAY_MS: '250'
