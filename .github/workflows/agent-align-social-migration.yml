name: One-time social migration version alignment

on:
  push:
    branches:
      - agent/post-cutover-runtime-cleanup
    paths:
      - .github/workflows/agent-align-social-migration.yml

permissions:
  contents: write

jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/post-cutover-runtime-cleanup
      - name: Match production migration version
        run: |
          set -euo pipefail
          git mv supabase/migrations/20260819070000_post_cutover_social_v2_contracts.sql supabase/migrations/20260819071151_post_cutover_social_v2_contracts.sql
          git config user.name 'puddle-maintenance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'Align social migration version with production'
          git push origin HEAD:agent/post-cutover-runtime-cleanup
