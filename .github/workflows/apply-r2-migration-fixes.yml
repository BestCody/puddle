name: Apply R2 migration fixes

on:
  push:
    branches:
      - agent/r2-opt-scratch

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[migration-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/r2-opt-scratch
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Apply and commit migration fixes
        run: |
          node scripts/apply-r2-migration-fixes.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/10026_r2_runtime_optimizations.sql
          git commit -m "[migration-fix] Harden optimized R2 migration"
          git push origin HEAD:agent/r2-opt-scratch
