name: Ops - verify production Google fallback

on:
  push:
    branches:
      - ops/verify-production-google-fallback
    paths:
      - '.github/workflows/ops-verify-production-google-fallback.yml'
      - 'tests/live-google-photo-smoke.mjs'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIVE_BASE_URL: https://puddle.you
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify production Google fallback
        run: node tests/live-google-photo-smoke.mjs
