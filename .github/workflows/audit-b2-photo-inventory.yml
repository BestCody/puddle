name: Audit canonical B2 photo inventory

on:
  workflow_dispatch:
    inputs:
      snapshot:
        description: ISO snapshot date to audit; empty uses the active manifest
        required: false
        default: ''
        type: string
  schedule:
    # A full byte audit is intentionally weekly: it reads the complete
    # canonical media prefix and is too expensive to run on every enrichment.
    - cron: '17 4 * * 1'

permissions:
  contents: read

concurrency:
  group: audit-b2-photo-inventory
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      B2_DATA_APPLICATION_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_DATA_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_DATA_BUCKET_NAME: ${{ secrets.B2_BUCKET }}
      B2_DATA_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
      B2_DATA_S3_REGION: ${{ secrets.B2_REGION }}
      B2_DATA_PREFIX: data
      B2_MEDIA_APPLICATION_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_MEDIA_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_MEDIA_BUCKET_NAME: ${{ secrets.B2_BUCKET }}
      B2_MEDIA_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
      B2_MEDIA_S3_REGION: ${{ secrets.B2_REGION }}
      B2_MEDIA_OPEN_PHOTO_PREFIX: ${{ vars.B2_MEDIA_OPEN_PHOTO_PREFIX || 'media/photos/by-sha256' }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install audit dependencies
        run: python -m pip install --disable-pip-version-check boto3 duckdb pillow
      - name: Audit canonical B2 photos
        shell: bash
        run: python scripts/global-data/audit_b2_photo_inventory.py --snapshot='${{ inputs.snapshot }}' 2>&1 | tee b2-photo-inventory-audit.json
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: b2-photo-inventory-audit
          path: b2-photo-inventory-audit.json
          if-no-files-found: ignore
          retention-days: 30
