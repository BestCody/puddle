name: End-to-end product

on:
  push:
    branches:
      - main
      - agent/scalable-map-viewport-search
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  statuses: write

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      E2E_BASE_URL: http://localhost:3000
      GLOBAL_LOCATION_SEARCH_BACKEND: opensearch
      GLOBAL_LOCATION_SEARCH_URL: http://127.0.0.1:39200
      GLOBAL_LOCATION_SEARCH_INDEX: e2e-locations-active
    steps:
      - uses: actions/checkout@v6
      - name: Publish E2E pending status
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "{\"state\":\"pending\",\"context\":\"E2E browser-tests\",\"description\":\"Browser E2E suite is running\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - uses: supabase/setup-cli@v3.0.0
        with:
          version: latest
      - name: Prepare isolated E2E Supabase project
        run: |
          rm -rf .e2e-local
          mkdir -p .e2e-local
          cp -R supabase .e2e-local/supabase
          python - <<'PY'
          from pathlib import Path
          path = Path('.e2e-local/supabase/config.toml')
          value = path.read_text()
          replacements = {
              'project_id = "puddle-local"': 'project_id = "puddle-e2e"',
              'port = 54321': 'port = 55321',
              'port = 54322': 'port = 55322',
              'shadow_port = 54320': 'shadow_port = 55320',
              'port = 54323': 'port = 55323',
              'port = 54324': 'port = 55324',
              'smtp_port = 54325': 'smtp_port = 55325',
              'pop3_port = 54326': 'pop3_port = 55326',
          }
          for old, new in replacements.items():
              if old not in value:
                  raise SystemExit(f'Missing expected Supabase config value: {old}')
              value = value.replace(old, new, 1)
          path.write_text(value)
          PY
      - name: Start isolated local Supabase
        working-directory: .e2e-local
        run: |
          supabase start
          supabase db reset --local
      - name: Export local Supabase environment
        working-directory: .e2e-local
        run: |
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000" >> "$GITHUB_ENV"
          echo "MAILPIT_URL=$INBUCKET_URL" >> "$GITHUB_ENV"
      - name: Run current product browser tests
        run: |
          node tests/e2e/global-location-search-stub.mjs > /tmp/puddle-e2e-opensearch.log 2>&1 &
          search_pid=$!
          trap 'kill "$search_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:39200/health >/dev/null; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              cat /tmp/puddle-e2e-opensearch.log
              exit 1
            fi
            sleep 0.2
          done
          npm run e2e:test
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop isolated local Supabase
        if: always()
        working-directory: .e2e-local
        run: supabase stop --no-backup
      - name: Publish E2E final status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          state=success
          description='Browser E2E suite passed'
          if [ "$JOB_STATUS" != 'success' ]; then
            state=failure
            description='Browser E2E suite failed'
          fi
          curl --fail-with-body --silent --show-error --location \
            --request POST \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            --data "{\"state\":\"$state\",\"context\":\"E2E browser-tests\",\"description\":\"$description\",\"target_url\":\"$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID\"}"
