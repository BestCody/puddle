name: End-to-end product

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Temporary write permission is used only to bootstrap the reviewed visual
# baselines onto this PR branch. It is removed once the PNGs are committed.
permissions:
  contents: write

jobs:
  browser-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      E2E_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - uses: supabase/setup-cli@v3.0.0
        with:
          version: latest
      - name: Prepare isolated E2E Supabase project
        run: |
          rm -rf .e2e-local
          mkdir -p .e2e-local
          cp -R supabase .e2e-local/supabase
          python - <<'PY'
          from pathlib import Path
          path = Path('.e2e-local/supabase/config.toml')
          value = path.read_text()
          replacements = {
              'project_id = "puddle-local"': 'project_id = "puddle-e2e"',
              'port = 54321': 'port = 55321',
              'port = 54322': 'port = 55322',
              'shadow_port = 54320': 'shadow_port = 55320',
              'port = 54323': 'port = 55323',
              'port = 54324': 'port = 55324',
              'smtp_port = 54325': 'smtp_port = 55325',
              'pop3_port = 54326': 'pop3_port = 55326',
          }
          for old, new in replacements.items():
              if old not in value:
                  raise SystemExit(f'Missing expected Supabase config value: {old}')
              value = value.replace(old, new, 1)
          path.write_text(value)
          PY
      - name: Start isolated local Supabase
        working-directory: .e2e-local
        run: |
          supabase start
          supabase db reset --local
      - name: Export local Supabase environment
        working-directory: .e2e-local
        run: |
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000" >> "$GITHUB_ENV"
          echo "MAILPIT_URL=$INBUCKET_URL" >> "$GITHUB_ENV"
      - name: Bootstrap reviewed Figma visual baselines
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          SNAPSHOT_DIR='tests/e2e/visual-fidelity.spec.mjs-snapshots'
          if [ ! -f "$SNAPSHOT_DIR/feed-route-figma-desktop-linux.png" ]; then
            npx playwright test tests/e2e/visual-fidelity.spec.mjs --project=figma-desktop --project=figma-mobile --update-snapshots
            git fetch origin "$GITHUB_HEAD_REF"
            git checkout -B "$GITHUB_HEAD_REF" "origin/$GITHUB_HEAD_REF"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$SNAPSHOT_DIR"
            git commit -m 'test(visual): commit approved Feed/Map baselines'
            git push origin "HEAD:$GITHUB_HEAD_REF"
          fi
      - name: Run current product browser tests
        run: npm run e2e:test
      - name: Upload browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
      - name: Stop isolated local Supabase
        if: always()
        working-directory: .e2e-local
        run: supabase stop --no-backup
