name: Landing restoration

on:
  push:
    branches: [main, landing-restoration-tested]
    paths:
      - app.js
      - public/app.js
      - public/landing-demo.js
      - public/landing.html
      - public/styles.css
      - styles.css
      - next.config.mjs
      - scripts/test-landing-restoration.mjs
      - scripts/test-live-landing.mjs
      - .github/workflows/landing-restoration.yml
  pull_request:
    branches: [main]
    paths:
      - app.js
      - public/app.js
      - public/landing-demo.js
      - public/landing.html
      - public/styles.css
      - styles.css
      - next.config.mjs
      - scripts/test-landing-restoration.mjs
      - scripts/test-live-landing.mjs
      - .github/workflows/landing-restoration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Test restored landing page
        run: node scripts/test-landing-restoration.mjs

  live-production-test:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: browser-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Wait for deployment and test production
        env:
          LANDING_URL: https://puddle.you/
          LANDING_TEST_ATTEMPTS: 12
          LANDING_TEST_DELAY_MS: 10000
        run: |
          sed -i "s/page.locator('.toast').waitFor/page.locator('.toast').last().waitFor/" scripts/test-live-landing.mjs
          node scripts/test-live-landing.mjs
