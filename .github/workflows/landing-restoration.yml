name: Landing restoration

on:
  push:
    branches: [main, landing-restoration-tested]
    paths:
      - public/app.js
      - public/landing.html
      - public/landing.css
      - public/figma/**
      - app/landing-demo/**
      - app/landing-phone-demo.css
      - app/profile/page.js
      - components/landing-phone-demo.js
      - lib/security/headers.js
      - proxy.js
      - tests/integration/landing-phone-demos.test.mjs
      - tests/integration/swipe-motion.test.mjs
      - next.config.mjs
      - scripts/test-landing-restoration.mjs
      - scripts/test-responsive-landing.mjs
      - scripts/test-live-landing.mjs
      - tests/live/public-figma-smoke.spec.mjs
      - .github/workflows/landing-restoration.yml
  pull_request:
    branches: [main]
    paths:
      - public/app.js
      - public/landing.html
      - public/landing.css
      - public/figma/**
      - app/landing-demo/**
      - app/landing-phone-demo.css
      - app/profile/page.js
      - components/landing-phone-demo.js
      - lib/security/headers.js
      - proxy.js
      - tests/integration/landing-phone-demos.test.mjs
      - tests/integration/swipe-motion.test.mjs
      - next.config.mjs
      - scripts/test-landing-restoration.mjs
      - scripts/test-responsive-landing.mjs
      - scripts/test-live-landing.mjs
      - tests/live/public-figma-smoke.spec.mjs
      - .github/workflows/landing-restoration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install landing verification dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Test genuine Figma landing page
        run: |
          node scripts/test-landing-restoration.mjs
          node scripts/test-responsive-landing.mjs
          node --test tests/integration/swipe-motion.test.mjs
          node --test tests/integration/landing-phone-demos.test.mjs
      - name: Upload landing comparison renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: genuine-landing-renders
          path: landing-artifacts/
          if-no-files-found: ignore
          retention-days: 14

  live-production-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: browser-test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install landing verification dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.54.1
          npx playwright install --with-deps chromium
      - name: Wait for deployment and verify production
        env:
          LANDING_URL: https://puddle.you/
          LANDING_TEST_ATTEMPTS: 3
          LANDING_TEST_DELAY_MS: 10000
        run: node scripts/test-live-landing.mjs
