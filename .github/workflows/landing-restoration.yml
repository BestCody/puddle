name: Landing restoration

on:
  push:
    branches: [main, landing-restoration-tested]
    paths:
      - public/app.js
      - public/landing.html
      - public/figma-landing.css
      - public/figma/**
      - next.config.mjs
      - scripts/test-landing-restoration.mjs
      - scripts/test-responsive-landing.mjs
      - scripts/test-live-landing.mjs
      - tests/live/public-figma-smoke.spec.mjs
      - .github/workflows/landing-restoration.yml
  pull_request:
    branches: [main]
    paths:
      - public/app.js
      - public/landing.html
      - public/figma-landing.css
      - public/figma/**
      - next.config.mjs
      - scripts/test-landing-restoration.mjs
      - scripts/test-responsive-landing.mjs
      - scripts/test-live-landing.mjs
      - tests/live/public-figma-smoke.spec.mjs
      - .github/workflows/landing-restoration.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install landing verification dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.54.1 sharp@0.35.3
          npx playwright install --with-deps chromium
      - name: Test exact Figma landing page
        run: |
          node scripts/test-landing-restoration.mjs
          node scripts/test-responsive-landing.mjs

  live-production-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: browser-test
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install landing verification dependencies
        run: |
          npm install --no-save --package-lock=false playwright@1.54.1 sharp@0.35.3
          npx playwright install --with-deps chromium
      - name: Wait for deployment and compare production with Figma
        env:
          LANDING_URL: https://puddle.you/
          LANDING_TEST_ATTEMPTS: 3
          LANDING_TEST_DELAY_MS: 10000
        run: node scripts/test-live-landing.mjs
