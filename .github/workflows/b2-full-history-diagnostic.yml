name: Read-only full B2 candidate history diagnostic

on:
  push:
    branches: [b2-candidate-consistency-recovery-v2]

permissions:
  contents: read
  statuses: write

# Temporary branch-only diagnostic. Performs no B2 writes or restores.
jobs:
  inspect-full-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      B2_DATA_APPLICATION_KEY_ID: ${{ secrets.B2_DATA_APPLICATION_KEY_ID || secrets.B2_KEY_ID }}
      B2_DATA_APPLICATION_KEY: ${{ secrets.B2_DATA_APPLICATION_KEY || secrets.B2_APPLICATION_KEY }}
      B2_DATA_BUCKET_NAME: ${{ vars.B2_DATA_BUCKET_NAME || secrets.B2_BUCKET || 'puddle-assets' }}
      B2_DATA_S3_ENDPOINT: ${{ secrets.B2_DATA_S3_ENDPOINT || secrets.B2_S3_ENDPOINT }}
      B2_DATA_S3_REGION: ${{ vars.B2_DATA_S3_REGION || secrets.B2_REGION || 'us-east-005' }}
      B2_DATA_PREFIX: data
      GLOBAL_LOCATION_VALIDATE_HEAD_WORKERS: '32'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install diagnostic dependencies
        run: python -m pip install --disable-pip-version-check boto3 brotli duckdb 'h3>=4,<5' orjson zstandard
      - id: diagnostic
        name: Scan all ledger artifacts and exact B2 history
        shell: bash
        run: |
          set +e
          python scripts/global-data/repair_b2_search_candidate.py \
            --snapshot=2026-08-17 \
            --head-workers=32 2>&1 | tee /tmp/b2-full-history-diagnostic.log
          status=${PIPESTATUS[0]}
          if grep -q 'repair_dry_run_exact_matches=' /tmp/b2-full-history-diagnostic.log; then
            echo 'outcome=found' >> "$GITHUB_OUTPUT"
          elif grep -q 'repair_history_exact_match=false' /tmp/b2-full-history-diagnostic.log; then
            echo 'outcome=missing' >> "$GITHUB_OUTPUT"
          else
            echo 'outcome=error' >> "$GITHUB_OUTPUT"
          fi
          exit "$status"
      - name: Publish diagnostic commit status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME: ${{ steps.diagnostic.outputs.outcome }}
          STATUS_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          outcome = os.environ.get('OUTCOME') or 'error'
          if outcome == 'found':
              state = 'success'
              description = 'All B2 mismatches have exact ledger-matching history'
          elif outcome == 'missing':
              state = 'failure'
              description = 'At least one B2 mismatch lacks exact ledger history'
          else:
              state = 'error'
              description = 'Full B2 history diagnostic could not complete'
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/statuses/{os.environ['GITHUB_SHA']}"
          body = json.dumps({
              'state': state,
              'context': 'B2 full history diagnostic',
              'description': description,
              'target_url': os.environ['STATUS_URL'],
          }).encode()
          request = urllib.request.Request(url, data=body, method='POST', headers={
              'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          })
          with urllib.request.urlopen(request, timeout=30) as response:
              print(response.status)
          PY
