name: Refresh patched nanoid lock once

on:
  push:
    branches:
      - agent/center-sidebar-nav-content

permissions:
  contents: write

jobs:
  refresh-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v6
        with:
          ref: agent/center-sidebar-nav-content
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Regenerate patched transitive lock entry
        shell: bash
        run: |
          set -euo pipefail
          cp package.json "$RUNNER_TEMP/package.json.original"
          npm pkg set overrides.nanoid=3.3.17
          npm install --package-lock-only --ignore-scripts
          mv "$RUNNER_TEMP/package.json.original" package.json
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high

      - name: Remove one-shot workflow and commit lockfile
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/refresh-nanoid-lock-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/refresh-nanoid-lock-once.yml
          git diff --cached --exit-code && { echo "No lockfile change produced"; exit 1; } || true
          git commit -m "Refresh patched nanoid lock"
          git push origin HEAD:agent/center-sidebar-nav-content
