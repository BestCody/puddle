name: One-time post-cutover call rewrite

on:
  push:
    branches:
      - agent/post-cutover-runtime-cleanup
    paths:
      - .github/workflows/agent-post-cutover-string-rewrite.yml

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/post-cutover-runtime-cleanup
      - name: Replace retired social RPC call names
        shell: bash
        run: |
          set -euo pipefail
          files=$(git grep -Il -E 'social_(friends|friend_search|messages)_v1' -- app components lib || true)
          if [[ -n "$files" ]]; then
            while IFS= read -r file; do
              sed -i \
                -e 's/social_friends_v1/social_friends_v2/g' \
                -e 's/social_friend_search_v1/social_friend_search_v2/g' \
                -e 's/social_messages_v1/social_messages_v2/g' \
                "$file"
            done <<< "$files"
          fi
          if git diff --quiet; then
            echo 'No retired social RPC call names remained.'
            exit 0
          fi
          git config user.name 'puddle-maintenance-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add app components lib
          git commit -m 'Replace retired social RPC call names'
          git push origin HEAD:agent/post-cutover-runtime-cleanup
