name: Apply internal table RLS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3.0.0
        with:
          version: latest
      - name: Apply the idempotent internal table RLS migration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN"
          supabase db query \
            --linked \
            --project-ref cegoqtvajwajczbofpep \
            --file supabase/migrations/20260826190000_intentional_rls_for_internal_tables.sql
