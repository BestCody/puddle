name: Apply permanent location-first cutover

on:
  push:
    branches:
      - agent/r2-runtime-optimization-pass

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/r2-runtime-optimization-pass
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Patch cleanup marker in cutover script
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/permanent-location-first-cutover.py')
          s=p.read_text()
          start=s.index('old = """let releases')
          end=s.index('"""', start+9)+3
          replacement='''old = """let releases = registry.releases.map((item) => item?.release).filter(Boolean)
          if (!releases.length) {
            const releaseObjects = await allObjects('catalogue/releases/')
            releases = [...new Set(releaseObjects.map((object) => object.key.split('/')[2]).filter(Boolean))].sort().reverse()
          }"""'''
          p.write_text(s[:start]+replacement+s[end:])
          PY
      - name: Apply cutover
        id: cutover
        continue-on-error: true
        shell: bash
        run: python scripts/permanent-location-first-cutover.py > cutover-output.txt 2>&1
      - name: Commit failure diagnostics
        if: steps.cutover.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          cat cutover-output.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add cutover-output.txt
          git commit -m "Record permanent cutover failure"
          git push origin HEAD:agent/r2-runtime-optimization-pass
      - name: Stop after failure
        if: steps.cutover.outcome == 'failure'
        run: exit 1
      - name: Refresh dependency lock
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Remove temporary migration aids
        run: rm -f legacy-audit.txt dependency-audit.txt action-schema-audit.txt cutover-output.txt scripts/permanent-location-first-cutover.py .github/workflows/audit-legacy-removal.yml
      - name: Commit permanent cutover
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Complete permanent R2 location-first cutover"
          git push origin HEAD:agent/r2-runtime-optimization-pass
