name: Audit legacy removal

on:
  push:
    branches:
      - agent/r2-runtime-optimization-pass

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/r2-runtime-optimization-pass
      - name: Build action schema audit
        shell: bash
        run: |
          set -euo pipefail
          report=action-schema-audit.txt
          : > "$report"
          {
            echo '=== MATCHES ==='
            grep -RIn -E "(create table.*discovery_actions|record_discovery_action_v1|discovery_actions|location_visits|saved|interested|dismissed|undone_at)" supabase/migrations/*.sql | head -5000 || true
            echo '=== FILE CONTENTS WITH ACTION FUNCTION ==='
            for file in $(grep -Rl "record_discovery_action_v1" supabase/migrations/*.sql | sort); do
              echo "--- $file ---"
              cat "$file"
            done
          } >> "$report"
      - name: Commit action schema audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add action-schema-audit.txt
          git commit -m "Record discovery action schema audit" || exit 0
          git push origin HEAD:agent/r2-runtime-optimization-pass
