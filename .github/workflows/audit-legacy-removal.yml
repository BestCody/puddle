name: Audit legacy removal

on:
  push:
    branches:
      - agent/r2-runtime-optimization-pass

permissions:
  contents: write

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/r2-runtime-optimization-pass
      - name: Build legacy audit report
        shell: bash
        run: |
          set -euo pipefail
          report=legacy-audit.txt
          : > "$report"
          {
            echo '=== ALL FILES ==='
            find . -path './.git' -prune -o -path './node_modules' -prune -o -type f -print | sed 's#^./##' | sort
            echo '=== PRODUCT VISION IMPORTS ==='
            grep -RIl --exclude-dir=.git --exclude-dir=node_modules --exclude='*.sql' -E "legacySystemsEnabled|legacyRedirectForPath|isLegacyApiPath|PUDDLE_LEGACY_SYSTEMS_ENABLED" . | sort || true
            echo '=== LEGACY PAGE/API PATHS ==='
            for path in \
              app/events app/create/event app/studio/events app/hosts app/friends app/inbox app/wallet app/orders app/settings/payouts app/admin/finance \
              app/api/stripe app/api/tickets app/api/check-in app/api/location-sharing app/api/studio/events app/api/events app/api/hosts app/api/friends app/api/conversations app/api/messages app/api/maps app/api/ai/assist app/api/ai/decision; do
              if [ -e "$path" ]; then find "$path" -type f | sort; fi
            done
            echo '=== LEGACY NAMED FILES ==='
            find app components lib scripts tests -type f \( \
              -iname '*event*' -o -iname '*ticket*' -o -iname '*stripe*' -o -iname '*friend*' -o -iname '*message*' -o -iname '*conversation*' -o -iname '*location-sharing*' -o -iname '*itinerar*' -o -iname '*finance*' -o -iname '*payout*' -o -iname '*check-in*' -o -iname '*host*' \
            \) | sort || true
            echo '=== LEGACY IMPORTS / ROUTE STRINGS ==='
            grep -RIn --exclude-dir=.git --exclude-dir=node_modules --exclude='*.sql' -E "(/api/(stripe|tickets|check-in|location-sharing|events|hosts|friends|conversations|messages|maps|ai/assist|ai/decision)|/events|/friends|/inbox|/wallet|/orders|/admin/finance|requireLegacy|legacySystemsEnabled)" app components lib scripts tests proxy.js package.json .env.example | head -5000 || true
          } >> "$report"
      - name: Commit audit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add legacy-audit.txt
          git commit -m "Record legacy removal audit" || exit 0
          git push origin HEAD:agent/r2-runtime-optimization-pass
