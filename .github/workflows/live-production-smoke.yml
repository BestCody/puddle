name: Live production smoke

on:
  workflow_dispatch:
    inputs:
      deployed_sha:
        description: Full commit SHA reported by the self-hosted deployment after its health gate passes
        required: true
        type: string

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      LIVE_BASE_URL: https://puddle.you
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Confirm the deployed revision matches main
        env:
          DEPLOYED_SHA: ${{ inputs.deployed_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$DEPLOYED_SHA"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Install application dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Playwright test runner
        run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Confirm the requested revision is actually deployed
        env:
          DEPLOYED_SHA: ${{ inputs.deployed_sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$DEPLOYED_SHA" =~ ^[0-9a-f]{40}$ ]]
          health="$(curl --fail --silent --show-error https://puddle.you/api/health)"
          HEALTH="$health" node -e 'const health = JSON.parse(process.env.HEALTH); if (!health.ok || health.buildSha !== process.env.DEPLOYED_SHA) process.exit(1)'
      - name: Run live product UI smoke
        run: npx playwright test --config=playwright.live.config.mjs tests/live/production-smoke.spec.mjs tests/live/completed-ui-production-smoke.spec.mjs tests/live/public-figma-smoke.spec.mjs tests/live/public-catalogue.spec.mjs
      - name: Run bounded production load until SLOs pass
        shell: bash
        run: |
          set +e
          for attempt in 1 2 3 4; do
            echo "Production load attempt ${attempt}/4"
            npx playwright test --config=playwright.live.config.mjs tests/live/production-load.spec.mjs
            status=$?
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if [ "$attempt" -lt 4 ]; then
              echo "Production load did not meet every SLO; waiting 30 seconds before retrying."
              sleep 30
            fi
          done
          exit 1
      - name: Upload live browser diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: live-production-smoke-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 14
