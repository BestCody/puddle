name: Apply revised Figma landing patches

on:
  push:
    branches:
      - feat/figma-landing-v2-swipe-motion
    paths:
      - .github/workflows/apply-figma-v2-patches.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/figma-landing-v2-swipe-motion
      - name: Patch landing includes and swipe timing
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          landing = Path('public/landing.html')
          text = landing.read_text()
          old = '<link rel="stylesheet" href="/figma-landing-exact.css?v=1" />'
          new = old + '\n  <link rel="stylesheet" href="/figma-landing-v2.css?v=1" />'
          if old not in text:
              raise SystemExit('landing exact stylesheet include not found')
          text = text.replace(old, new, 1)
          if '/app.js?v=6' not in text:
              raise SystemExit('landing app cache key not found')
          text = text.replace('/app.js?v=6', '/app.js?v=7', 1)
          landing.write_text(text)

          card = Path('components/minimal-swipe-card.js')
          text = card.read_text()
          old_target = "    setDragX(action === 'pass' ? -720 : 720)"
          new_target = "    setDragX(action === 'pass' ? -720 : action === 'save' ? 720 : 0)"
          old_wait = '    await new Promise((resolve) => window.setTimeout(resolve, 160))'
          new_wait = "    const motionMs = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : action === 'save' ? 560 : 280\n    await new Promise((resolve) => window.setTimeout(resolve, motionMs))"
          if old_target not in text or old_wait not in text:
              raise SystemExit('minimal swipe motion anchors not found')
          text = text.replace(old_target, new_target, 1).replace(old_wait, new_wait, 1)
          card.write_text(text)
          PY
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add public/landing.html components/minimal-swipe-card.js
          git commit -m "Wire revised landing CSS and swipe timing"
          git push origin HEAD:feat/figma-landing-v2-swipe-motion
