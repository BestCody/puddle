name: Figma raster transparency audit

on:
  pull_request:
    branches: [main]
    paths:
      - public/figma/assets/**
      - public/landing.html
      - public/landing.css
      - components/**
      - scripts/audit-figma-raster-transparency.mjs
      - scripts/generate-transparent-hero-phone.mjs
      - scripts/prepare-figma-transparency-production-patch.mjs
      - .github/workflows/figma-raster-transparency-audit.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/audit-figma-raster-transparency.mjs
      - run: node scripts/generate-transparent-hero-phone.mjs
      - run: node scripts/prepare-figma-transparency-production-patch.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: figma-raster-transparency-audit
          path: |
            figma-raster-transparency-audit.json
            figma-raster-artifacts/
            figma-transparency-production-patch/
          if-no-files-found: error
          retention-days: 7
      - name: Apply verified patch to production branch
        env:
          PRODUCTION_BRANCH: fix/figma-transparent-raster-exports
        run: |
          set -euo pipefail
          cp -a figma-transparency-production-patch /tmp/figma-transparency-production-patch
          git fetch origin "$PRODUCTION_BRANCH"
          git switch -C "$PRODUCTION_BRANCH" "origin/$PRODUCTION_BRANCH"
          cp /tmp/figma-transparency-production-patch/public/figma/assets/hero-phone-exact.png public/figma/assets/hero-phone-exact.png
          cp /tmp/figma-transparency-production-patch/public/app.js public/app.js
          cp /tmp/figma-transparency-production-patch/scripts/check-landing-assets.mjs scripts/check-landing-assets.mjs
          while IFS= read -r path; do
            [ -z "$path" ] && continue
            rm -f "$path"
          done < <(node -e "for (const p of require('/tmp/figma-transparency-production-patch/deletions.json')) console.log(p)")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No production patch changes"
            exit 0
          fi
          git commit -m "Fix opaque Figma foreground exports"
          git push origin "HEAD:$PRODUCTION_BRANCH"
