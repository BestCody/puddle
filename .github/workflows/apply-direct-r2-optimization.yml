name: Apply direct R2 optimization patch

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.pull_request.head.ref == 'agent/r2-catalogue-google-ui' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/r2-catalogue-google-ui
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Apply and validate direct R2 patch
        run: |
          if git log -1 --pretty=%B | grep -Fq '[direct-r2-patch]'; then
            echo 'Direct R2 patch is already applied.'
            exit 0
          fi
          node scripts/apply-direct-r2-optimization-patch.mjs
          node --check scripts/import-open-location-photos.mjs
          node --check scripts/enrich-open-location-photos.mjs
          node --check lib/app/open-photo-r2.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/import-open-location-photos.mjs scripts/enrich-open-location-photos.mjs
          git commit -m "[direct-r2-patch] Upload open photos directly to R2"
          git push origin HEAD:agent/r2-catalogue-google-ui
