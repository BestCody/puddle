name: Clean private Backblaze B2 catalogue and photos

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Delete stale objects after reviewing dry-run output'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: b2-catalogue-photo-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    if: ${{ vars.B2_INFRA_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Remove stale releases and expired cached photos
        run: npm run locations:b2:cleanup -- ${{ inputs.apply && '--apply' || '' }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          B2_S3_ENDPOINT: ${{ secrets.B2_S3_ENDPOINT }}
          B2_REGION: ${{ secrets.B2_REGION }}
          B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_DOWNLOAD_BASE_URL: ${{ secrets.B2_DOWNLOAD_BASE_URL }}
          B2_RELEASES_TO_KEEP: '2'
          B2_DELETE_CONCURRENCY: '6'
