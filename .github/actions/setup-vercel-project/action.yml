name: Set up Vercel project

description: Create the temporary Vercel CLI project link used by GitHub-hosted runners.

runs:
  using: composite
  steps:
    - name: Create temporary Vercel project link
      shell: bash
      run: |
        set -euo pipefail
        test -n "${VERCEL_ORG_ID:-}" || { echo 'Missing VERCEL_ORG_ID.' >&2; exit 1; }
        test -n "${VERCEL_PROJECT_ID:-}" || { echo 'Missing VERCEL_PROJECT_ID.' >&2; exit 1; }

        rm -rf .vercel
        mkdir -p .vercel
        node --input-type=module <<'NODE'
        import { writeFileSync } from 'node:fs'

        const orgId = String(process.env.VERCEL_ORG_ID || '').trim()
        const projectId = String(process.env.VERCEL_PROJECT_ID || '').trim()
        writeFileSync(
          '.vercel/project.json',
          `${JSON.stringify({ orgId, projectId }, null, 2)}\n`,
          { mode: 0o600 }
        )
        console.log('Created the temporary Vercel project link.')
        NODE
